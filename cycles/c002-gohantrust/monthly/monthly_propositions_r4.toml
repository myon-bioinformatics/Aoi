# サイクル2 月次の命題・第4弾（族 Y に量の段）。事前宣言 monthly_prelock_r4_2026-11-13.md と一緒に固定した（判定の前）。
# 量の段は国民経済計算の値がそろう 2001〜2024 年だけなので、2025 を除く版（末尾 x）しかない。

[[proposition]]
id = "C2Y4ax"
statement = "食料の相対価格から量を固定して見込んだ E の動きが、年平均の標本のばらつき（1 標準誤差）以上の年では、E の年の変化は見込みの向きに動く（上げ・下げをまとめた形、2001〜2024 年）"
strength = "always"
scope = { seasons = "2001-2024", where = [{ col = "family", op = "==", value = "Y" }, { col = "acy4", op = ">=", value = 1 }] }
then = [{ col = "agree4", op = "==", value = true }]
parent = "C2Y4x"
change = "上げと言い切った年（条件）と下げと言い切った年を、「見込みの向きと同じ」という 1 つの結論にまとめた。範囲は 2001〜2024 年（量の段と同じ年）。第4弾の段 5・6 と同じ形で比べるため"
surprise = "u4"
context = ["c4", "q", "c5", "c6", "ayE"]
falsifier = "見込みの向きと E の年の変化の向きが逆の年が 1 つでもある"
note = "単位は暦年（2001〜2024 年）。帯は σ_Y = 0.0063（第3弾と同じ）。q は国全体の 1 人当たり実質の消費の伸び（世界銀行 家計最終消費支出の名目 ÷ 総合の物価指数 ÷ 人口）で、家計調査とは別の出所。段 5 は c5 = c4 − q（食料の量は一定）、段 6 は c6 = c4 − (1 − η)q（η = 0.492、USDA ERS 2005 年の日本の食料の所得弾力性）。会計上のつながりを含む。年次の E の動きは L1 の入力として見えていた"

