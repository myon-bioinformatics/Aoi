[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aoi"
version = "0.1.0"
description = "Observe. Measure. Question."
requires-python = ">=3.11"
# git から入るのは標準ライブラリの共有モジュールだけ。研究用ライブラリは下のグループ。

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage>=7",
    "selectolax>=1",
    "editables>=0.3",
    # 🌡️ dragowing/tests/test_heatmap_page.py が scripts/build_heatmap_page.py 経由で使う（子の pages グループと同じ）
    "pysaiyanweboo",
]
runtime = [
    "polars>=2",
    "httpx>=0.28",
    # 2.4 系は Python 3.11–3.14、2.5.2 以降は 3.12–3.15（3.15 の wheel は 2.5.2 から）。
    "numpy>=2.4; python_version < '3.12'",
    "numpy>=2.5.2; python_version >= '3.12'",
    # 図はブラウザの plotly.js と、SVG は親の plotly_min（dragowing/vendor）。Python plotly は置かない。
    # matplotlib / seaborn / statsmodels も置かない。ページの文章は自作の markdown.py（dragowing/vendor/markdown）。
]

[tool.uv]
default-groups = ["dev", "runtime"]

[tool.uv.sources]
pysaiyanweboo = { git = "https://github.com/myon-bioinformatics/PySaiyanWeBoo", rev = "main" }

[tool.hatch.build.targets.wheel]
packages = []
# Editable でリポジトリ根を sys.path に足さない。足すと blueprobe/ や queryu/ が
# 名前空間パッケージになり、子の aoi_sibling_path が本物のモジュールを足せなくなる。
dev-mode-exact = true

[tool.hatch.build.targets.wheel.force-include]
"scripts/fetch_module.py" = "fetch_module.py"
"shrink/numpy_min.py" = "numpy_min.py"
"vendor/uv_tool_build.py" = "uv_tool_build.py"

[tool.hatch.build.targets.sdist]
only-include = ["scripts/fetch_module.py", "shrink/numpy_min.py", "vendor/uv_tool_build.py"]

[tool.pytest.ini_options]
# サブプロジェクトはそれぞれ単独のディレクトリ。将来の分離に備え、互いをパッケージにしない
pythonpath = [".", "blueprobe", "blueprobe/npb", "queryu", "queryu/core", "queryu/ask", "sakanalytics", "sakanalytics/core", "sakanalytics/npb", "pythdragoras", "pythdragoras/core", "pythdragoras/npb", "nagoyaction", "nagoyaction/inbox", "nagoyaction/npb", "dragowing"]
testpaths = ["tests", "blueprobe/tests", "queryu/tests", "sakanalytics/tests", "pythdragoras/tests", "nagoyaction/tests", "dragowing/tests"]
