name: Pages

# 🌡️ The heatmap editor is published by the portfolio under /tools/heatmap/ (scripts/project_pages.py --record-tools
# runs scripts/build_heatmap_page.py). Here `build` keeps checking it in Chrome, and `guide` publishes
# docs/guide.page.json (🎞 GIF demo / 🧩 features) with the parent's reusable workflow.
on:
  pull_request:
    paths: ['dragowing.py', 'scripts/build_heatmap_page.py', 'pyproject.toml', 'uv.lock', 'tests/check_heatmap_png.py', 'tests/test_heatmap_page.py', 'docs/guide.page.json', 'docs/evidence/heatmap.gif', '.github/workflows/heatmap-pages.yml']
  push:
    branches: [main]
    paths: ['dragowing.py', 'scripts/build_heatmap_page.py', 'pyproject.toml', 'uv.lock', 'tests/check_heatmap_png.py', 'tests/test_heatmap_page.py', 'docs/guide.page.json', 'docs/evidence/heatmap.gif', '.github/workflows/heatmap-pages.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Build heatmap and check the scene export
        # 📦 the pages group: the pinned PySaiyanWeBoo (pyproject.toml), like the other repositories.
        run: |
          mkdir -p site/heatmap
          uv run --locked --only-group pages python scripts/build_heatmap_page.py > site/heatmap/index.html
          echo '[[0,null]]' | python -S dragowing.py --heatmap - | python -c 'import json,sys; assert json.load(sys.stdin)["layers"][0]["z"] == [[0,None]]'
      - name: Exercise the generated editor in Chrome
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom "file://$PWD/site/heatmap/index.html" > "$RUNNER_TEMP/heatmap-dom.html"
          grep -F '2行 × 3列' "$RUNNER_TEMP/heatmap-dom.html"
          grep -F 'download="scene.json"' "$RUNNER_TEMP/heatmap-dom.html"
          python -S tests/check_heatmap_png.py site/heatmap/index.html
  guide:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@dccd07ea5c9820764e99d77251e9490afa77fe6e
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_assets: docs/evidence/heatmap.gif=demos/heatmap.gif
      guide_brand: DRAgoWing   # ♻️ icon and favicon from CaChereCyCle (DRAgoWing.icon / DRAgoWing.favicon)
