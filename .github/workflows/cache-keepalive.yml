# 生のページのキャッシュ（Actions のキャッシュ、7日間使われないと消える）を週1回読んで、消えないようにする。
# 取得元に二度取りに行かないため（QueRyu の「一度だけ取る」）。取得元にはアクセスしない。
# 定期実行は既定のブランチ（main）にこのファイルが入ってから動く。
name: cache keepalive

on:
  schedule:
    - cron: "17 3 * * 1"   # 毎週月曜 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycle-c001   # サイクルの実行と同時に動かない
  cancel-in-progress: false

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: data
          key: aoi-data-c001-keepalive-${{ github.run_id }}
          restore-keys: aoi-data-c001-
      - name: Report what was kept
        run: |
          echo "restored key: ${{ steps.restore.outputs.cache-matched-key }}"
          for m in data/raw/*/manifest.jsonl; do [ -f "$m" ] && echo "$m: $(wc -l < "$m") entries"; done
