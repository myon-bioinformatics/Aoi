[project]
name = "queryu"
version = "0.1.0"
description = "再現できる取得が、確かな理解をつくる。取得と観測データセットの作成（Aoi の queryu/ から独立）"
requires-python = ">=3.11"
# 抽出は固定 SHA の BlueProbe checkout を PYTHONPATH で渡す。実行時の依存は numpy だけ。
dependencies = [
    # 問いの候補（ask/suggest.py）。下限は Python 3.11 でも入る最新。
    # より新しい Python では、numpy 側の対応範囲で解決する。
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# サイクルデータ・blueprobe の fixture・nagoyaction/inbox は Aoi に残す（AOI_ROOT）。
# BlueProbe は固定 SHA の checkout を PYTHONPATH で渡す（.github/workflows/ci.yml と同じ）
pythonpath = [".", "ask"]
testpaths = ["tests"]
norecursedirs = [".test-deps", "build", "reports"]
