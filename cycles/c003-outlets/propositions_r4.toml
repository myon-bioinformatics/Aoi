# サイクル3の命題・第4弾（事前登録）。形式と判定規則は docs/propositions.md。第1弾〜第3弾のファイルは変更しない。
#
# 主題: 「入る量が 1 ステップのあいだ一定の速さで入る」と見なす取り方（uniform）を、エンジン本体に入れられるか。
#       総量を保ったまま、出口どうしを厳密に解く既定（outlets="exact"）と 1 つの式にまとめられるか。3 段・輪の配管でどうなるか。
#
# 記録: 2026-11-12 18:05 JST に書いた。このとき、エンジンへの実装（FluidFullSpeedSimulation のブランチ）も、
#       第4弾の単位（flow・combo・chain3・ring の組）と列も、まだ作っていない。
#   書く前に見ていたもの: 第1弾〜第3弾の結果すべて。とくに O30（上がポンプなら uniform で厳密）、
#     O31〜O33（上が弁なら厳密でないが 2 次まで小さい）、O27（2 段目のずれは dt/(2·τ2)）。
#   見ていないもの: エンジンに入れた実装の結果、入る量 + 弁が何本も + 出るポンプの槽、3 段の槽、輪になった配管。
#   紙の上で導いた式:
#     槽の量 V、弁の合計の速さ K（L = K·dt、Φ = 1 − e^(−L)）、このステップに出るポンプの量 P、入る量 I のとき、
#     dV/dt = −K·V + (I − P)/dt を 1 ステップぶん解くと、弁の合計 = V·Φ + (I − P)·(1 − Φ/L)。
#     I = 0 なら第1弾の affine、P = 0 で弁が 1 本なら第3弾の uniform と同じ式になる。
#   エンジンへの入れ方（予定）: まず今までどおり全部の管の量を決める（出る量はステップ最初の量まで）。次に、槽ごとに
#     「いま決まった量のうち、このステップに届く分」を I として、弁の合計を上の式まで増やす（増やす分は I まで）。
#     増やした分が下の槽に届いても、下の槽の I には数えない（2 次の差）。この入れ方で厳密さがどこまで保たれるかは見ていない。
#   O38 は O27 と同じ説明（半ステップぶん減りそこねる）を 3 段に延ばした予想。O35〜O37・O40・O41 は紙の上の式からの予想。
#   境の値（1e-9・5 %・h ≤ 1/32・10 倍・3.8〜4.2）は人が決めた仮置きで、結果に合わせて動かさない。
#
# 第4弾で足す単位（前の弾の命題の範囲には入らない組）。どれもエンジン本体で進める。inflows は入る量の扱い:
#   "end" = 今まで（入った量はステップの終わりに足す）、"uniform" = 一定の速さで入ると見なす。outlets はどれも "exact"。
#   flow   = 第3弾の fed・chain2 と同じ条件を、エンジンの inflows="uniform" で進める
#   combo  = 入るポンプ（V0·K/4）+ 弁 1・2・4 本（等分／偏り）+ 出るポンプ（V0·K/8）の槽。最初の量 V0、t ≈ 2τ。
#            厳密な量は V∞ + (V0 − V∞)·e^(−K·t)、V∞ = (入る速さ − 出る速さ)/K。inflows は end と uniform
#   chain3 = 槽 A（τ）→ 槽 B（τ2）→ 槽 C（τ3）→ 受け、どれも弁 1 本。(τ2/τ, τ3/τ) = (1/2, 1/3)・(2, 1/2)・(1/3, 3)・(3, 5)。
#            t ≈ 2τ の槽 C の量を 3 段の Bateman の式と比べる。inflows は end と uniform
#   ring   = 槽 A（τ）⇄ 槽 B（τ2）の輪（どちらも弁 1 本で相手へ）。τ2/τ = 1/4・1/2・2・4。全部を槽 A に入れて進め、
#            槽 B の量を 2 槽の厳密な解と比べる。測る時刻は T = τ·τ2/(τ + τ2) の 2 倍（行き渡る途中、settled = 偽）と
#            40 倍（行き渡った後、settled = 真。残りは e^(−40)）。inflows は end と uniform
# 第4弾で足す列:
#   uniform_in    = inflows="uniform" で進めたか（end なら偽）
#   from_pump     = flow の単位で、上がポンプか（偽なら上は弁の槽）
#   settled       = ring の単位で、行き渡った後に測ったか
#   native_gap    = |err − 第3弾の同じ条件の uniform（整数の漸化式）の err|（flow だけ）
#   chain3_pred_rel = |err − (dt/(2·τ2) + dt/(2·τ3))| / (dt/(2·τ2) + dt/(2·τ3))（chain3 の end）
#   gain_vs_end   = |同じ条件の end の err| / |この単位の err|（uniform_in の単位。分母が 0 のときは ε = 1e-15 に置き、ログに残す）
#   flow_halving・has_half = err / 同じ組で刻みが半分の単位の err と、その単位があるか（chain3 の uniform）

# ---- エンジンに入れた uniform の追試 ----

[[proposition]]
id = "O35"
statement = "エンジンに入れた uniform で、ポンプから入って弁 1 本から出る槽は厳密である"
strength = "always"
scope = { where = [{ col = "flow", op = "==", value = true }, { col = "from_pump", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "err"]
falsifier = "ずれる単位があれば、エンジンへの入れ方（先に全部の管の量を決め、後から弁を増やす）を見直す"
note = "O30 は整数の漸化式で確かめた。これはエンジン本体の実装を同じ条件で確かめ直す"

[[proposition]]
id = "O36"
statement = "エンジンに入れた uniform で、2 段の槽の 2 段目は、第3弾の整数の漸化式（uniform）と同じずれになる"
strength = "always"
scope = { where = [{ col = "flow", op = "==", value = true }, { col = "from_pump", op = "==", value = false }] }
if = []
then = [{ col = "native_gap", op = "<", value = 1e-9 }]
surprise = "native_gap"
context = ["h", "tau2_ratio", "span_ratio", "err"]
falsifier = "違う単位があれば、エンジンの実装と第3弾の式のどちらかが違うものを計算している"

# ---- 1 つの式にまとめる ----

[[proposition]]
id = "O37"
statement = "入るポンプ・何本もの弁・出るポンプがある槽は、エンジンに入れた uniform なら厳密である"
strength = "always"
scope = { where = [{ col = "combo", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "n", "equal_split", "err"]
falsifier = "ずれる単位があれば、弁の合計 = V·Φ + (I − P)·(1 − Φ/L) の式か、その入れ方を見直す"

[[proposition]]
id = "O38"
statement = "入るポンプ・何本もの弁・出るポンプがある槽は、今までの入る量の扱い（end）では厳密でない"
strength = "always"
scope = { where = [{ col = "combo", op = "==", value = true }, { col = "uniform_in", op = "==", value = false }] }
if = []
then = [{ col = "err_abs", op = ">=", value = 1e-9 }]
surprise = "err"
context = ["h", "n", "equal_split", "err"]
falsifier = "厳密な単位があれば、入る量のずれは出るポンプや弁の本数と打ち消し合うことがあると書く"
note = "O28（ポンプから入る槽は今のエンジンでずれる）を、弁が何本もあって出るポンプもある槽に広げた向き"

# ---- 3 段・輪 ----

[[proposition]]
id = "O39"
statement = "槽が 3 段つながるとき、今までの入る量の扱い（end）で、刻みが時定数の 1/32 以下なら、3 段目のずれは dt/(2·τ2) + dt/(2·τ3) と 5 % 以内で合う"
strength = "always"
scope = { where = [{ col = "chain3", op = "==", value = true }, { col = "uniform_in", op = "==", value = false }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "chain3_pred_rel", op = "<=", value = 0.05 }]
surprise = "chain3_pred_rel"
context = ["h", "tau2_ratio", "tau3_ratio", "err"]
falsifier = "外れる単位があれば、ずれは段ごとに足し算で積み上がるという読みを見直す"
note = "O27 の説明（入った量が半ステップぶん減りそこねる）を 3 段に延ばした予想。3 段目の中身は 2 段目と 3 段目を通ってきたので、両方の分だけ多い"

[[proposition]]
id = "O40"
statement = "槽が 3 段つながるとき、刻みが時定数の 1/32 以下なら、エンジンに入れた uniform は 3 段目のずれを end の 1/10 以下にする"
strength = "always"
scope = { where = [{ col = "chain3", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "gain_vs_end", op = ">=", value = 10 }]
surprise = "gain_vs_end"
context = ["h", "tau2_ratio", "tau3_ratio", "err"]
falsifier = "1/10 にならない単位があれば、増やした分を下の槽の入る量に数えない入れ方が 3 段では足りないと書く"

[[proposition]]
id = "O41"
statement = "槽が 3 段つながるとき、刻みが時定数の 1/32 以下なら、エンジンに入れた uniform のずれは刻みを半分にすると 1/4 になる（比 3.8〜4.2）"
strength = "always"
scope = { where = [{ col = "chain3", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }, { col = "has_half", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "flow_halving", op = ">=", value = 3.8 }, { col = "flow_halving", op = "<=", value = 4.2 }]
surprise = "flow_halving"
context = ["h", "tau2_ratio", "tau3_ratio", "err"]
falsifier = "比が外れる単位があれば、3 段では uniform の残りのずれは 2 次ではないと書く"

[[proposition]]
id = "O42"
statement = "2 つの槽が輪になっていて行き渡る途中のとき、刻みが時定数の 1/32 以下なら、エンジンに入れた uniform はずれを end の 1/10 以下にする"
strength = "always"
scope = { where = [{ col = "ring", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }, { col = "settled", op = "==", value = false }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "gain_vs_end", op = ">=", value = 10 }]
surprise = "gain_vs_end"
context = ["h", "tau2_ratio", "err"]
falsifier = "1/10 にならない単位があれば、輪（入る量が自分の出した量に戻ってくる）では uniform の効きが弱いと書く"

[[proposition]]
id = "O43"
statement = "2 つの槽が輪になっているとき、エンジンに入れた uniform なら、行き渡った後の槽の量は厳密である（滞在時間の比どおり）"
strength = "always"
scope = { where = [{ col = "ring", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }, { col = "settled", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "err"]
falsifier = "ずれる単位があれば、行き渡った後でも uniform は厳密な取り分を出さないと書く"
note = "行き渡った後は入る量が一定になるので、uniform の前提（一定の速さで入る）が成り立つはず、という予想"

[[proposition]]
id = "O44"
statement = "2 つの槽が輪になっているとき、今までの入る量の扱い（end）では、行き渡った後の槽の量は厳密でない"
strength = "always"
scope = { where = [{ col = "ring", op = "==", value = true }, { col = "uniform_in", op = "==", value = false }, { col = "settled", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = ">=", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "err"]
falsifier = "厳密な単位があれば、輪では 2 つの槽のずれが打ち消し合うことがあると書く"
note = "FluidFullSpeedSimulation の 🪙 金（E27）で、離散の定常が連続の式から刻みの 1 次だけ外れていたのと同じ向き"
