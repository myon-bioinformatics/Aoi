name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      aoi_ref:
        description: "Aoi ref override. Empty resolves refs/heads/main."
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  resolve-aoi:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve Aoi ref
        id: resolve
        env:
          AOI_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aoi_ref || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          REMOTE = "https://github.com/myon-bioinformatics/Aoi"
          EXPECTED_ID = "1402862784"
          EXPECTED_NWO = "myon-bioinformatics/Aoi"
          SHA = re.compile(r"[0-9a-f]{40}")

          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)

          request = urllib.request.Request(REMOTE, headers={"User-Agent": "blueprobe-ci"})
          with urllib.request.urlopen(request, timeout=60) as response:
              html = response.read().decode("utf-8", "replace")
          id_match = re.search(
              r'<meta name="octolytics-dimension-repository_id" content="(\d+)"',
              html,
          )
          nwo_match = re.search(
              r'<meta name="octolytics-dimension-repository_nwo" content="([^"]+)"',
              html,
          )
          if id_match is None or nwo_match is None:
              fail("missing repository identity on the public Aoi page")
          if nwo_match.group(1) != EXPECTED_NWO or id_match.group(1) != EXPECTED_ID:
              fail("Aoi repository id or name mismatch")

          override = os.environ.get("AOI_REF_INPUT", "").strip()
          if override == "":
              label = "refs/heads/main"
              listed = subprocess.run(
                  ["git", "ls-remote", REMOTE, "refs/heads/main"],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              ).stdout.splitlines()
          elif SHA.fullmatch(override):
              label = override
              listed = None
              sha = override
          else:
              label = override if override.startswith("refs/") else "refs/heads/" + override
              listed = subprocess.run(
                  ["git", "ls-remote", REMOTE, label],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              ).stdout.splitlines()

          if listed is not None:
              rows = [line.split() for line in listed if line.strip()]
              if len(rows) != 1 or not SHA.fullmatch(rows[0][0]):
                  fail("could not resolve a single Aoi SHA for " + label)
              sha = rows[0][0]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("sha=" + sha + "\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Aoi checkout\n\n")
                  handle.write(
                      "Repository id `" + EXPECTED_ID + "` matched `" + EXPECTED_NWO + "`.\n\n"
                  )
                  handle.write("Resolved `" + label + "` to `" + sha + "`.\n")
          print(sha)
          PY

  test:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [changes, resolve-aoi]
    runs-on: ubuntu-latest
    env:
      # LAB_SHA: past-pattern snapshot of mcp-toolcall-lab used as verification test data.
      # Fetched by SHA. The checkout must match this snapshot on every event.
      # A floating source-hash comparison is report-only on pull_request and
      # strict on push to main and on schedule.
      LAB_SHA: 81b1150d633d5c6aaedc893c951c8f584ba877e3
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.resolve-aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Confirm resolved Aoi checkout
        run: test "$(git -C .test-deps/aoi rev-parse HEAD)" = "${{ needs.resolve-aoi.outputs.sha }}"
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/mcp-toolcall-lab
          ref: ${{ env.LAB_SHA }}
          path: .test-deps/lab
          persist-credentials: false
      - run: test "$(git -C .test-deps/lab rev-parse HEAD)" = "$LAB_SHA"
      - run: python -m compileall -q -x '\.test-deps' .
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run --locked --python "${{ matrix.python }}" pytest -q --require-blueprobe-lab-integration --junitxml=reports/junit.xml
        env:
          PYTHONPATH: ${{ github.workspace }}/.test-deps/aoi/queryu:${{ github.workspace }}/.test-deps/lab/src
          AOI_LAB_SOURCE_ROOT: ${{ github.workspace }}/.test-deps/lab/src
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: always() && (needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
