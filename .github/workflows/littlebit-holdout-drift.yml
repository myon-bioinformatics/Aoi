name: LittleBit holdout drift

on:
  pull_request:
    paths:
      - 'pythdragoras/**'
      - 'cycles/c001-chunichi/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/littlebit-holdout-drift.yml'
  push:
    branches: [main]
    paths:
      - 'pythdragoras/**'
      - 'cycles/c001-chunichi/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/littlebit-holdout-drift.yml'
  workflow_dispatch:
    inputs:
      strict_regeneration:
        description: 'Also require bitwise reconstruction (known BLAS-dependent mismatch; never rebaseline)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: littlebit-holdout-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Provenance and related pytest (Python 3.14.8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Hash verification always runs. Strict reconstruction is NOT claimed to
      # pass: the original evidence did not record its BLAS/CPU configuration.
      AOI_REGENERATE_LITTLEBIT_HOLDOUT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_regeneration && '1' || '0' }}
      AOI_HOLDOUT_DRIFT_OUTPUT: build/littlebit-holdout-drift/regenerated
      PYTHONHASHSEED: '0'
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require supported Node in parity CI
        run: node -e "if (+process.versions.node.split('.')[0] < 24) process.exit(1)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Verify original sources, inputs, artifacts, and LittleBit regressions
        run: |
          mkdir -p build/littlebit-holdout-drift
          cp cycles/c001-chunichi/outputs/exploratory/littlebit-holdout/holdout.provenance.json build/littlebit-holdout-drift/
          uv run --locked --python 3.14.8 pytest -c pyproject.toml -q -s pythdragoras/tests -k littlebit \
            --junitxml=build/littlebit-holdout-drift/pytest.xml
      - name: Preserve audit results and any strict reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: littlebit-holdout-drift
          path: build/littlebit-holdout-drift/
          if-no-files-found: error
          retention-days: 14
