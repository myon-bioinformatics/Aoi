name: Season simulator
on:
  push:
    branches: [main, feature/season-simulator]
    paths: ['sakanalytics/season*', 'sakanalytics/tests/test_season_simulator.py', '.github/workflows/season-simulator.yml']
  pull_request:
    paths: ['sakanalytics/season*', 'sakanalytics/tests/test_season_simulator.py', '.github/workflows/season-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONPATH: sakanalytics
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r sakanalytics/season-requirements.txt pytest
      - run: python -m pytest sakanalytics/tests/test_season_simulator.py -q
      - run: python -m compileall -q sakanalytics/season_simulator.py sakanalytics/season_exact.py
      - name: Exercise result-free synthetic CLI
        run: python sakanalytics/season_simulator.py sakanalytics/season-example.json --as-of 2022-01-01 --through 2022-01-04 --trials 100 --exact --output /tmp/season-example-output.json
