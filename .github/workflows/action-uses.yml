name: Action uses

# 親と同じく、setup の SHA がコメントのリリースタグと一致するかを見る。
# pull request では警告、main への push と schedule では失敗。
# 時刻は親の vendor-parent-child-ci（親ピン監査を含む）と同じ 07:00 UTC。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: action-uses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Action use style and release hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Check action uses
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            python -S scripts/check_action_uses.py --check-hashes
          else
            python -S scripts/check_action_uses.py --check-hashes --warn
          fi
