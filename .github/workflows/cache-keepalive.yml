# Replaces raw-HTML cache keepalive with checks of committed research inputs.
name: c001 saved input verification

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/cache-keepalive.yml'
      - '.github/workflows/cycle-c001.yml'
      - 'scripts/check_c001_saved_inputs.py'
      - 'scripts/reconcile_season_2026.py'
      - 'tests/test_c001_saved_inputs.py'
      - 'cycles/c001-chunichi/recovered-inputs/**'
      - 'cycles/c001-chunichi/season-2026/**'
      - 'cycles/c001-chunichi/from-cycle-001/outputs/season.jsonl'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 'latest'
          enable-cache: false
          python-version: '3.15'
          activate-environment: true
      - name: Test saved-input failures and offline replay (stdlib only)
        run: python -S -m unittest discover -s tests -p test_c001_saved_inputs.py -v
      - name: Verify preserved inputs and replay saved 2026 observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python -S scripts/check_c001_saved_inputs.py | tee build/c001-saved-input-check.json
          cat build/c001-saved-input-check.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c001-saved-input-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/c001-saved-input-check.json
          if-no-files-found: error
          retention-days: 14
