name: Action uses

# 親と同じく、setup の SHA がコメントのリリースタグと一致するかを見る。
# pull request では警告、main への push と schedule では失敗。
# 時刻は親の vendor-parent-child-ci（親ピン監査を含む）と同じ 07:00 UTC。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: action-uses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Action use style and release hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check action uses
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            python -S scripts/check_action_uses.py --check-hashes
          else
            python -S scripts/check_action_uses.py --check-hashes --warn
          fi
