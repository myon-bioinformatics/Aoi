# Aoi の checkout は実行時に main の SHA を解決する（workflow_dispatch の aoi-ref で上書きできる）。
# vendor/aoi は共有ツールの写しで、vendor-lock ジョブが同じ SHA と照合する。
# vendor-dispatch は親 main の pilot/vendor_dispatch.py で vendor.lock.json を検証する。--record は付けない。
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      aoi-ref:
        description: "Aoi ref to checkout (default refs/heads/main; branch, tag, or full commit SHA)"
        required: false
        default: "refs/heads/main"
        type: string
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  aoi:
    name: Resolve Aoi
    needs: changes
    # vendor-lock は docs-only の PR でも Aoi の最新 main と照合する。product_changed では落とさない。
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve Aoi ref
        id: resolve
        env:
          AOI_REF_INPUT: ${{ inputs.aoi-ref || 'refs/heads/main' }}
          AOI_REPOSITORY_ID: "1402862784"
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          ref="${AOI_REF_INPUT}"
          if [[ ! "$ref" =~ ^([0-9a-fA-F]{40}|refs/[A-Za-z0-9._/-]+|[A-Za-z0-9._/-]+)$ ]]; then
            echo "invalid Aoi ref" >&2
            exit 1
          fi
          if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha=$(printf '%s' "$ref" | tr '[:upper:]' '[:lower:]')
            shown_ref="commit"
          else
            if [[ "$ref" != refs/* ]]; then
              ref="refs/heads/${ref}"
            fi
            if [[ "$ref" == "refs/heads/main" ]]; then
              line=$(git ls-remote https://github.com/myon-bioinformatics/Aoi refs/heads/main)
            else
              line=$(git ls-remote https://github.com/myon-bioinformatics/Aoi "$ref")
            fi
            sha=$(printf '%s\n' "$line" | awk 'NF { print $1; exit }')
            shown_ref="$ref"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve Aoi SHA from ${ref}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "dragowing-ci",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/Aoi",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["AOI_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/Aoi":
              raise SystemExit("Aoi repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Aoi"
            echo ""
            echo "- ref: ${shown_ref}"
            echo "- sha: ${sha}"
            echo "- repository_id: ${AOI_REPOSITORY_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  vendor-lock:
    name: Vendor lock
    needs: aoi
    if: always() && needs.aoi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Compare vendored tools to Aoi
        env:
          AOI_SHA: ${{ needs.aoi.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AOI_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
          uv --version
          {
            echo "## Vendor lock"
            echo ""
            echo "- sha: ${AOI_SHA}"
            echo "- repository_id: 1402862784"
          } >> "$GITHUB_STEP_SUMMARY"
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            python -S scripts/check_vendor_lock.py --aoi .test-deps/aoi
          else
            python -S scripts/check_vendor_lock.py --aoi .test-deps/aoi --warn
          fi

  vendor-dispatch:
    name: Vendor dispatch
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Resolve parent main
        id: parent
        env:
          PARENT_REPOSITORY_ID: "638801160"
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          line=$(git ls-remote https://github.com/myon-bioinformatics/myon-bioinformatics refs/heads/main)
          sha=$(printf '%s\n' "$line" | awk 'NF { print $1; exit }')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve parent main" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "dragowing-ci",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/myon-bioinformatics",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["PARENT_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/myon-bioinformatics":
              raise SystemExit("parent repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Parent"
            echo ""
            echo "- ref: refs/heads/main"
            echo "- sha: ${sha}"
            echo "- repository_id: ${PARENT_REPOSITORY_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout parent
        env:
          PARENT_SHA: ${{ steps.parent.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init -q .test-deps/parent
          git -C .test-deps/parent remote add origin https://github.com/myon-bioinformatics/myon-bioinformatics.git
          git -C .test-deps/parent fetch --depth 1 origin "$PARENT_SHA"
          git -C .test-deps/parent checkout -q FETCH_HEAD
          test "$(git -C .test-deps/parent rev-parse HEAD)" = "$PARENT_SHA"
          test -f .test-deps/parent/pilot/vendor_dispatch.py
          {
            echo "## Parent checkout"
            echo ""
            echo "- sha: ${PARENT_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify vendor lock
        env:
          PARENT_SHA: ${{ steps.parent.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .test-deps/parent rev-parse HEAD)" = "$PARENT_SHA"
          uv --version
          python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
          node_major=$(node -p "process.versions.node.split('.')[0]")
          [[ "$node_major" -ge 24 ]]
          python .test-deps/parent/pilot/vendor_dispatch.py --manifest vendor.lock.json

  test:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [changes, aoi]
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Aoi の CI と同じ
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Record resolved Aoi SHA
        env:
          AOI_SHA: ${{ needs.aoi.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AOI_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
          echo "Aoi ${AOI_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned Chromium dependency (no browser warmup)
        run: python3 scripts/install_ci_chromium.py --destination "$RUNNER_TEMP/dragowing-chromium"
      - name: Select and verify the installed Chromium without fallback
        shell: bash
        run: |
          set -euo pipefail
          chromium="$RUNNER_TEMP/dragowing-chromium/chrome-linux/chrome"
          test -x "$chromium"
          actual_version="$("$chromium" --version)"
          printf '%s\n' "$actual_version"
          if [[ "$actual_version" != 'Chromium 156.0.8078.0' && "$actual_version" != 'Chromium 156.0.8078.0 '* ]]; then
            echo '::error::Installed Chromium version does not match the reviewed snapshot.'
            exit 1
          fi
          printf 'CHROME=%s\nDRAGOWING_REQUIRE_CHROME=1\n' "$chromium" >> "$GITHUB_ENV"
      - name: Prepare local Plotly.js for required exports
        run: |
          mkdir -p build/test-assets
          python -S -c 'from pathlib import Path; from plotly_cdn import fetch_plotly_js; Path("build/test-assets/plotly.min.js").write_text(fetch_plotly_js(), encoding="utf-8")'
      - run: python -m compileall -q -x '\.test-deps' .
      - run: uv run --locked --python "${{ matrix.python }}" pytest -q --junitxml=reports/junit.xml
        env:
          DRAGOWING_PINNED_PLOTLY_JS: ${{ github.workspace }}/build/test-assets/plotly.min.js
          AOI_ROOT: ${{ github.workspace }}/.test-deps/aoi
          PYTHONPATH: ${{ github.workspace }}/.test-deps/aoi/pythdragoras:${{ github.workspace }}/.test-deps/aoi/queryu/ask
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
