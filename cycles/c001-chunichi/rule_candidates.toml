# R11: 「B クラス」を言い当てる条件の組み合わせの候補（research/R11-b-class-rule.md）
# 記録: 2026-10-04。探索を実行する前に書いた。候補を後から足して探し直すときは、この版を残して別のファイルにする。
# 全年にそろっている列だけを使う（イニング集計の inn_* は 2012年がないので入れない）。順位・勝率そのものは使わない。

target = [{ col = "upper_half", op = "==", value = false }]
max_terms = 2   # 「または」でつなぐ組の数の上限
max_conds = 2   # 1つの組の中の「かつ」の数の上限

