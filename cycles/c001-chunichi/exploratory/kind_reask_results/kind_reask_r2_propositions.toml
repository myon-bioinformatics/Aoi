# 保留の問い直し・第2弾（探索。正本の P1〜P114 と outputs/ は変えない）。この冒頭が宣言で、下が命題。
#
# 記録: 2026-11-13 に書いた。固定の時刻と sha256 は kind_reask_prelock_timestamp.txt に足す。
#       このファイルを固定した時点では、第2弾のスクリプトも、下の A・B の計算も書いていない（見たものは各節に書く）。
# 承諾: 2026-11-13 のユーザーの指示（第1弾の「次の候補」2 つの両方）。
# 置き場: ファイルと仕組みを増やさないため、第1弾と同じスクリプト（../kind_reask.py）と同じ結果ファイルに足す。
#         第1弾の宣言と命題（kind_reask_prelock_2026-11-13.md・kind_reask_propositions.toml）は書き換えない。
#
# ==== A. 第1弾の 22 命題を、まだ使っていない 2026年の単位で照らす ====
#
# 対象: 確かめとして読むのは、第1弾で読み 1（種類の性質）だった K32 と K51 の 2 件。
#       残りの 20 件と下の D の 3 件は、数を並べるだけ（記録のみ。読みはつけない）。
# データ: r18_partial_results/r18_partial_panel_2026.jsonl（試合の記録だけから作った 2026年の 12 単位、318 列。
#         R18 の部分実行が保存したもの）。この表に無い列（inn_* と bat_*）は空にする。空の列を使う命題は判定不能になる。
# 仕組み: R18 と同じ propositions.confirm_units。単位ごとに 成立／判例／逆の判例／どちらも当たらない／判定不能 に分けて数える。
#         単位は 12 しかないので、統計の判定（終了コード）はしない。
# 読み方（R18 の登録の形を、命題ごとに選ばず機械的に当てる）:
#   学習データ（2012〜2025年、2020年を除く）での率を、2026年の単位にそのまま当てる。
#   判例の数が、学習データの率での見込みより多い（その数以上になる確率が 0.05 未満）なら「学習データほどは成り立っていない」。
#   逆の判例も同じ。どちらでもなければ「学習データと矛盾しない」。期待どおりでも「確かめられた」とは書かない。
#   学習データに判例が 1 件も無かった側で 2026年に判例が出たら、数にかかわらず名前を出して記録する。
# 見たもの（この宣言を書く前）:
#   - 上の表の 12 単位の rank・upper_half・rank_rf・sim_p_upper。
#     だから **K51 の 2026年の結果（B クラスの 6 単位はどれも 0.5 未満、A クラスの 6 単位はどれも 0.5 以上）は、
#     この宣言の前に分かっていた。** K51 の定義と強さは、見る前の刻印（2026-11-13 14:36 JST）で固定済み。
#   - K32 の条件（得点 5 位以下）に当たる 2026年の単位は c・s・b・e の 4 つ。中日は得点 4 位で条件の外。
#     結論の列 bat_d_obp は表に無い。2026年のチーム打撃（npb.jp の 2 ページ）を既存の取得手順で取ろうとしたが、
#     この作業環境からは届かなかった（403）。別の経路では取っていない。
#   - R18 の部分実行の README（P51: 中日 2026 の分布の見込みは 0.5 未満）。
#   - 2026年の A・B の別（R18 の時点で全球団が知られている）。
#   見ていないもの: 上の 4 列以外の 2026年の値（残り 20 件と D の結論の列）。
# 予想（走らせる前に書く。結果を見て変えない。判定には使わない）:
#   (A1) K51: 成立 6・判例 0・逆の判例 0・どちらも当たらない 6（見た値から決まる）。読みは「学習データと矛盾しない」。
#   (A2) K32: 12 単位とも判定不能。
#   (A3) 22 件のうち、inn_*・bat_* を使う 10 件（K25〜K29・K31・K32・K40・K45・K46）は全単位が判定不能。残り 12 件は判定できる。
#   (A4) K85（第1弾の読みは「どこでも多い」）: 結論は 2026年でも 12 単位のうち 10 以上で成り立ち、A クラスと B クラスで 1 単位より大きくは違わない。
#
# ==== B. 中日の値が目立った 3 つを、「中日と、中日以外の同じ種類の差」として問う ====
#
# 形: 既存の命題の形のまま、範囲（where）を種類にし、「もし」を中日にする（正本の P7 と同じ書き方）。
#       [範囲: その種類のチーム・シーズン]  中日である ⇒ 結論
#     元の命題の単位は中日のその種類の年、比べる相手は中日以外の同じ種類。逆・裏は、条件が主語を選ぶだけなので省く（docs/propositions.md）。
#     新しい列も、新しい評価の仕組みも作らない。差は、すでに出ている fisher_p（その範囲の中で、条件が結論の割合を上げているかの片側検定）で読む。
# 対象: 第1弾の読み 4（種類では言えない）の 6 件のうち、中日の値が目立って高かった P40・P86・P102 の 3 件（第1弾の README の表）。
# 読み方（判定ではない）: 元の命題の fisher_p が 0.05 未満なら「同じ種類の中でも、中日は多い」。0.05 以上なら「差は偶然の幅の中」。
#     終了コードは docs/propositions.md のまま。強さと結論は親のまま。
# 見たもの: 数はすべて見ている。P40 は中日 11 中 9・中日以外 41 中 23、P86 は中日の B の年 12 中 11・中日以外 66 中 42、
#     P102 は中日 12 中 8・中日以外 66 中 25。fisher_p はこの数から決まる（正確な値はまだ計算していない。正規近似での概算はした）。
# 弱い点（先に書く）:
#   - 6 件から目立つ 3 件を選んだあとの問い。0.05 を切っても、選んだ分だけ割り引いて読む。
#   - 見た単位そのもので作った形なので、「きっかけ以外」では読めない（中日を除くと元の命題が 0 件になる）。motivated_by は書かない。
#     読めるのは、これから足される年の単位だけ。
#   - D86 は親（中日の 13 単位）と範囲が違う。B クラスの年だけ（12 単位）で、2012年は範囲の外。
# 予想: (B1) 3 件とも fisher_p は 0.05 に届かない。(B2) 0.05 に最も遠いのは D40。
#
# ==== 走らせないこと ====
#   強さ・基準・範囲を結果を見てから変えること。2026年のチーム打撃を別の経路で取ること。正本の outputs/ の書き換え。
#   pipeline.toml の years を 2012-2026 にする正規の実行（R18 の手順 2）。思いついたことは README の未検討に書くだけ。

[[proposition]]
id = "D40"
statement = "得点がリーグ5位以下のチーム・シーズンの中で、中日は、出塁のうち四死球による割合が他球団より低い"
strength = "usually"
scope = { where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "bat_d_walk_share", op = "<", value = 0 }]
parent = "P40"
change = "主語（中日）を範囲から「もし」に移し、範囲を同じ種類（得点5位以下）の12球団にした。中日以外の同じ種類が比べる相手になる。強さと結論は親のまま"
skip_forms = ["converse", "inverse"]
skip_reason = "条件が主語（中日）を選ぶだけなので、逆（結論が成り立つなら中日）に意味がない"
surprise = "bat_d_walk_share"
context = ["bat_d_bb_pa", "bat_d_obp", "rank"]
links = ["H2", "H6"]
note = "見た単位そのもので作った形。差は fisher_p で読む。6 件から目立つ 3 件を選んだあとの問いなので、割り引いて読む"

