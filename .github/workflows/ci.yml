name: CI

# docs/・*.md だけの変更ではテストを走らせない（組織共通の変更検知。スキップは成功扱いになる）。
# リンク確認は links.yml が担当し、docs の変更でも走る。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      parent-ref:
        description: 'Parent ref override; empty resolves latest main'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  vendor-lock:
    name: Vendor lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Live lock check follows parent main. The parent's vendor-consumers-compat
      # workflow keeps 1eda992 as a past-pattern snapshot of the old tool and
      # registry together. This job is not that snapshot.
      - name: Resolve parent main
        id: parent
        env:
          PARENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.parent-ref || '' }}
          PARENT_REPOSITORY_ID: "638801160"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          remote=https://github.com/myon-bioinformatics/myon-bioinformatics.git
          ref="${PARENT_REF:-main}"
          ref="${ref#refs/heads/}"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$ref"
          elif [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            sha=$(git ls-remote "$remote" "refs/heads/${ref}" | awk 'NR==1 { print $1 }')
          else
            echo "parent ref contains unsupported characters" >&2
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve parent main" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "aoi-parent-resolve",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/myon-bioinformatics",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["PARENT_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/myon-bioinformatics":
              raise SystemExit("parent repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo '## Resolved parent'
            echo "myon-bioinformatics/myon-bioinformatics ${sha}"
            echo "repository_id ${PARENT_REPOSITORY_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: ${{ steps.parent.outputs.sha }}
          path: .vendor-sync-tools
          sparse-checkout: vendor_sync.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check vendor lock with the resolved parent tool
        env:
          PARENT_SHA: ${{ steps.parent.outputs.sha }}
        run: |
          set -euo pipefail
          head=$(git -C .vendor-sync-tools rev-parse HEAD)
          if [[ "$head" != "$PARENT_SHA" ]]; then
            echo "parent tool checkout is not the resolved SHA" >&2
            exit 1
          fi
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  vendor-dispatch:
    name: Vendor dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Verify mode follows parent main and does not record. Skips stay skips.
      # A recorded digest that does not match its recorded commit fails the job.
      - name: Resolve parent main
        id: parent
        env:
          PARENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.parent-ref || '' }}
          PARENT_REPOSITORY_ID: "638801160"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          remote=https://github.com/myon-bioinformatics/myon-bioinformatics.git
          ref="${PARENT_REF:-main}"
          ref="${ref#refs/heads/}"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$ref"
          elif [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            sha=$(git ls-remote "$remote" "refs/heads/${ref}" | awk 'NR==1 { print $1 }')
          else
            echo "parent ref contains unsupported characters" >&2
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve parent main" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "aoi-parent-resolve",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/myon-bioinformatics",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["PARENT_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/myon-bioinformatics":
              raise SystemExit("parent repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo '## Resolved parent'
            echo "myon-bioinformatics/myon-bioinformatics ${sha}"
            echo "repository_id ${PARENT_REPOSITORY_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: ${{ steps.parent.outputs.sha }}
          path: .vendor-dispatch-tools
          sparse-checkout: pilot/vendor_dispatch.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Verify vendor lock with the parent dispatch driver
        env:
          PARENT_SHA: ${{ steps.parent.outputs.sha }}
        run: |
          set -euo pipefail
          head=$(git -C .vendor-dispatch-tools rev-parse HEAD)
          if [[ "$head" != "$PARENT_SHA" ]]; then
            echo "parent tool checkout is not the resolved SHA" >&2
            exit 1
          fi
          python - <<'PY'
          import shutil
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit("uv lane requires Python 3.11 or newer")
          if sys.flags.no_site:
              raise SystemExit("uv lane must keep site enabled so the driver can see uv")
          if shutil.which("uv") is None:
              raise SystemExit("uv is not on PATH")
          print("python", ".".join(str(part) for part in sys.version_info[:3]))
          PY
          uv --version
          python .vendor-dispatch-tools/pilot/vendor_dispatch.py --manifest vendor.lock.json

  test:
    name: pytest (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # failure-identity の expected-reports と揃えること
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify recovered evidence against pinned Git history
        run: python scripts/audit_recovery_provenance.py
      # sakanalytics/ の Node エントリの一致テスト（子の tests）は、GITHUB_ACTIONS 上では Node 24+ がなければ失敗する（子の CI と同じ）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require supported Node in parity CI
        run: node -e "if (+process.versions.node.split('.')[0] < 24) process.exit(1)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - run: python -VV
      - name: Compile (syntax errors must never reach main)
        run: python -m compileall -q aoi_paths.py blueprobe queryu sakanalytics pythdragoras nagoyaction dragowing
      - name: Install pinned official Chromium without a browser warmup
        run: python3 dragowing/scripts/install_ci_chromium.py --destination "$RUNNER_TEMP/aoi-chromium"
      - name: Select required Chromium without Chrome fallback
        shell: bash
        run: |
          set -euo pipefail
          chromium="$RUNNER_TEMP/aoi-chromium/chrome-linux/chrome"
          test -x "$chromium"
          actual_version="$("$chromium" --version)"
          printf '%s\n' "$actual_version"
          if [[ "$actual_version" != 'Chromium 156.0.8078.0' && "$actual_version" != 'Chromium 156.0.8078.0 '* ]]; then
            echo '::error::Installed Chromium version does not match the reviewed snapshot.'
            exit 1
          fi
          printf 'CHROME=%s\nDRAGOWING_REQUIRE_CHROME=1\n' "$chromium" >> "$GITHUB_ENV"
      - name: Prepare local Plotly.js for required exports
        run: |
          mkdir -p build/test-assets
          python -S -c 'from pathlib import Path; from dragowing.plotly_cdn import fetch_plotly_js; Path("build/test-assets/plotly.min.js").write_text(fetch_plotly_js(), encoding="utf-8")'
      - name: Require first actual browser startup within eight seconds
        env:
          DRAGOWING_PINNED_PLOTLY_JS: ${{ github.workspace }}/build/test-assets/plotly.min.js
        run: |
          mkdir -p build/test-results
          uv run --locked --python "${{ matrix.python }}" python -m pytest -c pyproject.toml -q -p scripts.observe_dragowing_startup \
            --browser-startup-evidence="build/startup-observation/first-start-${{ matrix.python }}.json" \
            dragowing/tests/test_render.py::test_stalled_dbus_does_not_block_browser_get_version \
            --junitxml="build/test-results/first-start-${{ matrix.python }}.xml"
      - name: Test with JUnit
        env:
          DRAGOWING_PINNED_PLOTLY_JS: ${{ github.workspace }}/build/test-assets/plotly.min.js
        run: |
          mkdir -p build/test-results
          uv run --locked --python "${{ matrix.python }}" python -m pytest -c pyproject.toml -q --deselect=dragowing/tests/test_render.py::test_stalled_dbus_does_not_block_browser_get_version -p scripts.observe_dragowing_startup \
            --browser-startup-evidence="build/startup-observation/pytest-${{ matrix.python }}.json" \
            --junitxml="build/test-results/pytest-${{ matrix.python }}.xml"
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: |
            build/test-results/pytest-${{ matrix.python }}.xml
            build/test-results/first-start-${{ matrix.python }}.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual browser startup observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-observation-py${{ matrix.python }}
          path: build/startup-observation/
          if-no-files-found: warn
          retention-days: 14
      - name: NagoyAction is stdlib-only and the cycle pipeline is runnable
        run: |
          python -S nagoyaction/nagoyaction.py doctor cycles/c001-chunichi/pipeline.toml
          python -S nagoyaction/nagoyaction.py run cycles/c001-chunichi/pipeline.toml --dry-run

  lab-integration:
    name: Offline lab integration (Python 3.14)
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # LAB_SHA: past-pattern snapshot of mcp-toolcall-lab used as verification test data
      LAB_SHA: 6a3fe3aac7e5ae939d2fe2720dfae002d5f0dd90
      AOI_LAB_SOURCE_ROOT: ${{ github.workspace }}/.test-deps/lab/src
      PYTHONPATH: ${{ github.workspace }}/queryu:${{ github.workspace }}/.test-deps/lab/src
    steps:
      - uses: actions/checkout@v7
      # Test-only source checkout. Keep html_snapshot and css_inspect together;
      # never copy a single module or install lab as an Aoi runtime dependency.
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/mcp-toolcall-lab
          # LAB_SHA: past-pattern snapshot of mcp-toolcall-lab used as verification test data
          ref: 6a3fe3aac7e5ae939d2fe2720dfae002d5f0dd90
          path: .test-deps/lab
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Verify past-pattern snapshot and all import origins
        run: |
          test "$(git -C .test-deps/lab rev-parse HEAD)" = "$LAB_SHA"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from mcp_toolcall_lab.adapters import css_inspect, html_snapshot
          from mcp_toolcall_lab import source_access

          root = Path(os.environ["AOI_LAB_SOURCE_ROOT"]).resolve()
          for module in (html_snapshot, css_inspect):
              expected = root / "mcp_toolcall_lab/adapters" / (module.__name__.rsplit(".", 1)[1] + ".py")
              assert Path(module.__file__).resolve() == expected, module.__file__
              print(module.__name__, module.__file__)
          assert Path(source_access.__file__).resolve() == root / "mcp_toolcall_lab/source_access.py"
          print(source_access.__name__, source_access.__file__)
          PYCODE
      - name: Require real offline extractor tests with JUnit
        run: |
          mkdir -p build/test-results
          uv run --locked --python 3.14 pytest -q --require-blueprobe-lab-integration \
            blueprobe/tests/test_blueprobe_html_source.py::test_optional_real_lab_extractor_reuses_all_calendar_rows \
            blueprobe/tests/test_blueprobe_html_compare.py::test_real_saved_npb_fixture_coverage_and_css \
            blueprobe/tests/test_blueprobe_html_source.py::test_verified_cache_real_lab_snapshot_replay \
            --junitxml=build/test-results/lab-integration-3.14.xml
      - name: Preserve raw integration JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-lab-integration-py3.14
          path: build/test-results/lab-integration-3.14.xml
          if-no-files-found: error
          retention-days: 14

  # Keep the legacy job/artifact identifiers for existing report consumers.
  chrome-export:
    # Legacy check name is retained to avoid changing required-check contexts.
    name: Offline Chrome export (Python 3.14)
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Install dependencies before disconnecting the network
        run: |
          uv sync --locked --python 3.14
      # No browser and no network: the page given to Chromium and the saved PNG/SVG are compared with the figure
      # spec first, so a red browser step below can be told apart from wrong output. (The same tests also run in
      # every pytest job; this step only puts them ahead of the browser launch.)
      - name: Check the drawn output and the page against the figure spec before any browser starts
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c pyproject.toml -q tests/test_rendered_output_static.py
      - name: Prepare Plotly.js from jsDelivr before disconnecting the network
        run: |
          mkdir -p build/test-assets
          python -S -c 'from pathlib import Path; from dragowing.plotly_cdn import fetch_plotly_js; Path("build/test-assets/plotly.min.js").write_text(fetch_plotly_js(), encoding="utf-8")'
      - name: Install pinned official Chromium without a browser warmup
        run: python3 dragowing/scripts/install_ci_chromium.py --destination "$RUNNER_TEMP/aoi-chromium"
      - name: Select required Chromium without Chrome fallback
        shell: bash
        run: |
          set -euo pipefail
          chromium="$RUNNER_TEMP/aoi-chromium/chrome-linux/chrome"
          test -x "$chromium"
          actual_version="$("$chromium" --version)"
          printf '%s\n' "$actual_version"
          if [[ "$actual_version" != 'Chromium 156.0.8078.0' && "$actual_version" != 'Chromium 156.0.8078.0 '* ]]; then
            echo '::error::Installed Chromium version does not match the reviewed snapshot.'
            exit 1
          fi
          printf 'CHROME=%s\nDRAGOWING_REQUIRE_CHROME=1\n' "$chromium" >> "$GITHUB_ENV"
      - name: Require first offline browser startup within eight seconds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/test-results
          sudo unshare --net -- env CHROME="$CHROME" DRAGOWING_REQUIRE_CHROME=1 \
            DRAGOWING_PINNED_PLOTLY_JS="$PWD/build/test-assets/plotly.min.js" \
            "$PWD/.venv/bin/python" -m pytest -c pyproject.toml -q \
            -p scripts.observe_dragowing_startup \
            --browser-startup-evidence=build/export-evidence/first-start.json \
            dragowing/tests/test_render.py::test_stalled_dbus_does_not_block_browser_get_version \
            --junitxml=build/test-results/chrome-first-start-3.14.xml
      - name: Require Chromium and render without a network namespace interface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/test-results
          sudo unshare --net -- env CHROME="$CHROME" DRAGOWING_REQUIRE_CHROME=1 \
            DRAGOWING_EXPORT_EVIDENCE_DIR="$PWD/build/export-evidence" \
            DRAGOWING_PINNED_PLOTLY_JS="$PWD/build/test-assets/plotly.min.js" \
            "$PWD/.venv/bin/python" -m pytest -c pyproject.toml -q \
            dragowing/tests/test_chrome_pipe.py dragowing/tests/test_render.py dragowing/tests/test_export.py \
            dragowing/tests/test_plotly_cdn.py \
            --deselect=dragowing/tests/test_render.py::test_stalled_dbus_does_not_block_browser_get_version \
            --junitxml=build/test-results/chrome-export-3.14.xml
      - name: Preserve Chromium export JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-chrome-export-py3.14
          path: |
            build/test-results/chrome-export-3.14.xml
            build/test-results/chrome-first-start-3.14.xml
          if-no-files-found: error
          retention-days: 14

      - name: Preserve rendered PNG and SVG evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-export-evidence
          path: build/export-evidence
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test, lab-integration, chrome-export]
    if: always() && (needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.11/first-start-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.12/first-start-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.13/first-start-3.13.xml","junit-py3.14/pytest-3.14.xml","junit-py3.14/first-start-3.14.xml","junit-py3.15/pytest-3.15.xml","junit-py3.15/first-start-3.15.xml","junit-lab-integration-py3.14/lab-integration-3.14.xml","junit-chrome-export-py3.14/chrome-export-3.14.xml","junit-chrome-export-py3.14/chrome-first-start-3.14.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: "failure-identity"

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77


  research-digest:
    name: Offline research digest (real c001 inputs)
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Generate digest from committed records only
        run: uv run --locked --python 3.14 python nagoyaction/research_digest.py cycles/c001-chunichi
      - name: Verify reproducibility
        run: uv run --locked --python 3.14 python nagoyaction/research_digest.py cycles/c001-chunichi --check
      - name: Preserve generated research digest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-digest-c001
          path: |
            cycles/c001-chunichi/outputs/research_digest.jsonl
            cycles/c001-chunichi/outputs/research_digest.md
          if-no-files-found: error
          retention-days: 14

  child-heads:
    name: Child heads (subtree children)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Registry, drift and subtree diff
        shell: bash
        run: |
          set -euo pipefail
          python -S scripts/check_child_heads.py --fail-on-diff | tee build-child-heads.json
          { echo '## Child heads'; echo '```json'; cat build-child-heads.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
