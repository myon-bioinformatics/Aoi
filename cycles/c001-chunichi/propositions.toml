# サイクル1の命題（事前登録）。形式と判定規則は docs/propositions.md。
#
# 記録: 2026-10-03 に書いた。このとき Aoi のパイプラインによる実データはまだ取得していない。
#       外部レポート（references/2026-10-03-external-report.md）の数値は読んだうえで書いている。
#       強さ（strength）は言葉で選び、数値の基準はそこから自動で決まる。データに合わせて調整しない。
# 変更: 結果を見てから基準・範囲・条件を変えるときは、新しい id を作り、この命題は残す。
#
# 単位: チーム×シーズン（12球団、2012〜2025年、analysis.toml の除外を適用。除外中の判例は別に表示）

# ---- 得失点で順位を説明する（既存の説明） ----

[[proposition]]
id = "P1"
statement = "得失点差がプラスなら、上位半分（Aクラス）である"
strength = "usually"
if = [{ col = "rd", op = ">", value = 0 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "rank_gap"
context = ["rank", "rank_pythag", "wins_vs_pythag"]
links = ["H2", "H3", "H4"]

[[proposition]]
id = "P2"
statement = "ピタゴラス期待勝率でリーグ3位以内なら、実際も3位以内である"
strength = "usually"
if = [{ col = "rank_pythag", op = "<=", value = 3 }]
then = [{ col = "rank", op = "<=", value = 3 }]
surprise = "rank_gap"
context = ["rd", "wins_vs_pythag"]
links = ["H2", "H3", "H4"]

[[proposition]]
id = "P3"
statement = "得点がリーグ2位以内なら、3位以内である"
strength = "usually"
if = [{ col = "rank_rf", op = "<=", value = 2 }]
then = [{ col = "rank", op = "<=", value = 3 }]
surprise = "rank_gap"
context = ["rank_ra", "rd"]
links = ["H2"]

[[proposition]]
id = "P4"
statement = "失点がリーグで2番目以内に少なければ、3位以内である"
strength = "usually"
if = [{ col = "rank_ra", op = "<=", value = 2 }]
then = [{ col = "rank", op = "<=", value = 3 }]
surprise = "rank_gap"
context = ["rank_rf", "rd"]
links = ["H2"]

[[proposition]]
id = "P5"
statement = "得点がリーグ5位以下なら、下位半分（Bクラス）である"
strength = "usually"
if = [{ col = "rank_rf", op = ">=", value = 5 }]
then = [{ col = "upper_half", op = "==", value = false }]
surprise = "rank_gap"
context = ["rank", "rank_ra", "rd"]
links = ["H2"]

[[proposition]]
id = "P6"
statement = "どのチーム・シーズンでも、実際の勝利数はピタゴラス期待勝利数の±5勝以内に収まる"
strength = "almost_always"
if = []
then = [{ col = "wins_vs_pythag", op = ">=", value = -5 }, { col = "wins_vs_pythag", op = "<=", value = 5 }]
surprise = "wins_vs_pythag"
context = ["rd", "rank", "rank_pythag"]
links = ["H3", "H4", "H5"]

# ---- 得失点差が同程度でも勝率が違う：点差の分布で説明できるか ----
# 追加: 2026-10-03（外部の会話の提案を受けて）。このときもパイプラインの実データはまだ取得していない。

[[proposition]]
id = "P9"
statement = "1点差の試合で勝ち越していれば、ピタゴラス期待勝利数を上回る"
strength = "usually"
if = [{ col = "one_run_net", op = ">", value = 0 }]
then = [{ col = "wins_vs_pythag", op = ">", value = 0 }]
surprise = "wins_vs_pythag"
context = ["rd", "wpct_1run", "blowout_net"]
links = ["H3", "H8"]
falsifier = "1点差で勝ち越したチーム・シーズンのうち、期待勝利数を下回るものが4分の1を超える"
note = "1点差の勝敗とピタゴラスからのずれは計算上も連動しやすい。成り立っても「どうずれたか」の記述で、「なぜか」の説明ではない"

[[proposition]]
id = "P10"
statement = "4点以上差の試合で負け越していれば、ピタゴラス期待勝利数を上回る（大敗が失点を押し上げ、期待勝利数を下げる）"
strength = "usually"
if = [{ col = "blowout_net", op = "<", value = 0 }]
then = [{ col = "wins_vs_pythag", op = ">", value = 0 }]
surprise = "wins_vs_pythag"
context = ["rd", "one_run_net", "rank"]
links = ["H8"]
falsifier = "4点以上差で負け越したチーム・シーズンのうち、期待勝利数を下回るものが4分の1を超える"
note = "得点・失点の「配分」の偏りを見る命題。大差の試合が少ない年は条件に入らない"

[[proposition]]
id = "P11"
statement = "得失点差が ±20 以内のチームの間では、1点差で勝ち越していれば上位半分（Aクラス）に入る"
strength = "more_often_than_not"
if = [{ col = "rd", op = ">=", value = -20 }, { col = "rd", op = "<=", value = 20 }, { col = "one_run_net", op = ">", value = 0 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "rank_gap"
context = ["rank", "rank_pythag", "wins_vs_pythag"]
links = ["H3", "H8"]
falsifier = "得失点差が拮抗し1点差で勝ち越したチーム・シーズンの半数以上が下位半分"
note = "「得失点差が同程度でも勝率が違う」を、得失点差の幅を絞って比べる。±20 は「同程度」の目安として事前に決めた値"

# ---- 中日ドラゴンズについての命題（focus） ----

[[proposition]]
id = "P7"
statement = "中日の順位は、得失点から期待される順位より2つ以上は下回らない"
strength = "usually"
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "rank_gap", op = "<=", value = 1 }]
surprise = "rank_gap"
context = ["rank", "rank_pythag", "rd", "wins_vs_pythag"]
links = ["H3", "H4", "H5"]
skip_forms = ["converse", "inverse"]
skip_reason = "条件が「中日であること」なので、逆（期待どおりなら中日である）は意味を持たない"

[[proposition]]
id = "P8"
statement = "中日の勝利数は、ピタゴラス期待勝利数を3勝以上は下回らない（「運が悪かった」ではない）"
strength = "usually"
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "wins_vs_pythag", op = ">=", value = -3 }]
surprise = "wins_vs_pythag"
context = ["rank", "rank_pythag", "rd", "wpct_1run"]
links = ["H3", "H4", "H5"]
skip_forms = ["converse", "inverse"]
skip_reason = "条件が「中日であること」なので、逆（期待どおりなら中日である）は意味を持たない"

# ---- R1: 得点・失点の配分（research/R1-score-allocation.md と同時に登録。探索的） ----
# 追加: 2026-10-03。配分効果はまだ実データで一度も計算していない。

[[proposition]]
id = "P12"
statement = "配分効果がはっきりプラスのシーズン（alloc_z ≥ 1）の翌年も、配分効果はプラスである（配分はチームの特徴として続く）"
strength = "more_often_than_not"
if = [{ col = "alloc_z", op = ">=", value = 1 }]
then = [{ col = "alloc_z_next", op = ">", value = 0 }]
surprise = "alloc_z_next"
context = ["alloc_z", "wins_vs_pythag"]
links = ["H9"]
falsifier = "alloc_z ≥ 1 のシーズンのうち、翌年の alloc_z が 0 以下になるものが半数以上"
note = "翌年のないシーズン（最終年、除外の前年）は判定できない単位として数える。同じチームでも選手は入れ替わる"

[[proposition]]
id = "P13"
statement = "配分効果がはっきり出たシーズン（|alloc_z| ≥ 1）は、ホームとビジターで配分効果の符号がそろう"
strength = "more_often_than_not"
if = [{ col = "alloc_z_abs", op = ">=", value = 1 }]
then = [{ col = "alloc_same_sign", op = "==", value = true }]
surprise = "alloc_z"
context = ["alloc_net_home", "alloc_net_away"]
links = ["H9"]
falsifier = "|alloc_z| ≥ 1 のシーズンの半数以上で、ホームとビジターの符号が逆"
note = "ホームの勝ち試合は9回裏を行わない・サヨナラで打ち切られるため、ホームの配分効果は偏りやすい（R1 の限界を参照）"

[[proposition]]
id = "P14"
statement = "中日は、得点・失点の配分（どの試合で組み合わさったか）で勝ち越し数を失っていない（alloc_net ≥ 0）"
strength = "usually"
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "alloc_net", op = ">=", value = 0 }]
surprise = "alloc_net"
context = ["rank", "rd", "wins_vs_pythag", "alloc_z"]
links = ["H3", "H9"]
skip_forms = ["converse", "inverse"]
skip_reason = "条件が「中日であること」なので、逆（配分で損をしていなければ中日である）は意味を持たない"
falsifier = "中日のシーズンのうち、配分で負け越し（alloc_net < 0）が4分の1を超える"
note = "成り立てば、CS 不出場の説明は配分ではなく、得点・失点の総量（とその原因）の側に寄る"

# ---- R2: 得点が少なくても A クラスに入れたのはなぜか（research/R2-low-scoring-a-class.md） ----
# 追加: 2026-10-04。R1 の実データの結果と、P5 の判例のチーム・年は見たうえで書いている（値は見ていない）。

[[proposition]]
id = "P15"
statement = "得点がリーグ5位以下のチームの間では、失点がリーグで2番目以内に少なければ A クラス"
strength = "usually"
scope = { where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = [{ col = "rank_ra", op = "<=", value = 2 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "rank_gap"
context = ["rank", "rank_rf", "rd", "rank_rd", "wins_vs_pythag"]
links = ["H2"]
falsifier = "低得点で失点が2番目以内に少ないチーム・シーズンのうち、B クラスが4分の1を超える"
note = "逆（A クラスなら失点が2番目以内）は、低得点の A クラスが失点の少なさで届いたかを見る"

[[proposition]]
id = "P16"
statement = "得点がリーグ5位以下のチームの間では、ピタゴラス期待勝利数を上回れば A クラス"
strength = "more_often_than_not"
scope = { where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = [{ col = "wins_vs_pythag", op = ">", value = 0 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "wins_vs_pythag"
context = ["rank", "rank_ra", "rd", "one_run_net", "alloc_net_strat"]
links = ["H3", "H9"]
falsifier = "低得点で期待以上に勝ったチーム・シーズンの半数以上が B クラス"
note = "逆（A クラスなら期待以上）が成り立つなら、低得点の A クラスは得失点で説明しにくい部分で届いた。R1 ではその部分は翌年に続かなかった"

[[proposition]]
id = "P17"
statement = "得点がリーグ5位以下だったシーズンの中日は、失点がリーグで2番目以内に少なくない"
strength = "usually"
scope = { team = "d", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "rank_ra", op = ">=", value = 3 }]
surprise = "rank_ra"
context = ["rank", "rank_rf", "rd", "RA"]
links = ["H2"]
falsifier = "中日の低得点のシーズンの4分の1を超えて、失点が2番目以内に少ない"
note = "成り立てば「失点でも補えなかった」。成り立たなければ、失点は少なかったのに届かなかった年があり、得点の不足の大きさに戻る"

[[proposition]]
id = "P18"
parent = "P15"
change = "P15 の判例 10件（低得点・失点2番目以内なのに B クラス）を見て、得失点差がプラスかどうかで分かれているように見えたため、前件に rd > 0 を加えた。結果を見てから作ったので、確かめには新しいデータ（2026年以降、または未取得の年）を使う"
motivated_by = ["d-2019", "t-2018", "d-2021", "l-2023", "b-2024", "b-2013", "d-2014", "b-2015", "d-2022", "c-2024", "t-2022", "t-2013", "t-2021", "h-2012", "l-2022", "t-2019"]
statement = "得点がリーグ5位以下で失点が2番目以内に少ないチームの間では、得失点差がプラスなら A クラス"
strength = "usually"
scope = { where = [{ col = "rank_rf", op = ">=", value = 5 }, { col = "rank_ra", op = "<=", value = 2 }] }
if = [{ col = "rd", op = ">", value = 0 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "rank_gap"
context = ["rank", "RF", "RA", "rank_rd", "wins_vs_pythag"]
links = ["H2"]
falsifier = "新しいデータで、この範囲かつ rd > 0 のチーム・シーズンの4分の1を超えて B クラス"
note = "motivated_by に作るきっかけの16単位すべてを入れたので、今のデータでの held-out は0単位（判断保留が正しい）。失点の少なさは、得点の不足を上回ったときにだけ順位に届く、という見方の確かめ"

# ---- R3: 得点の不足はどの得点帯で生まれたか（research/R3-scoring-bands.md） ----
# 追加: 2026-10-04。rf_def_* は実データでまだ計算していない。R1・R2 の結果は見ている。

[[proposition]]
id = "P19"
statement = "得点がリーグ5位以下だったシーズンの中日は、床（0〜2点に抑えられる試合）の不足が、天井（6点以上）の不足より大きい"
strength = "usually"
scope = { team = "d", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "rf_def_floor_minus_ceiling", op = "<", value = 0 }]
surprise = "rf_def_floor_minus_ceiling"
context = ["rank", "rf_def_floor", "rf_def_mid", "rf_def_ceiling", "rf_def_total"]
links = ["H2"]
falsifier = "中日の低得点のシーズンの4分の1を超えて、天井の不足のほうが大きい"
note = "成り立てば「抑え込まれる試合が多い」。成り立たなければ「大量点が出ない」側を調べる"

[[proposition]]
id = "P20"
statement = "得点がリーグ5位以下のチーム・シーズンでは、床の不足が天井の不足より大きい"
strength = "more_often_than_not"
scope = { where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "rf_def_floor_minus_ceiling", op = "<", value = 0 }]
surprise = "rf_def_floor_minus_ceiling"
context = ["rank", "rf_def_floor", "rf_def_ceiling", "rf_def_total"]
links = ["H2"]
falsifier = "低得点のチーム・シーズンの半数以上で、天井の不足のほうが大きい"
note = "P19 と成立率を並べ、中日の形が低得点のチームの中で特別かを見る"

[[proposition]]
id = "P21"
statement = "得点がリーグ5位以下のチームの間では、床の不足が天井の不足より大きい形なら B クラス"
strength = "usually"
scope = { where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = [{ col = "rf_def_floor_minus_ceiling", op = "<", value = 0 }]
then = [{ col = "upper_half", op = "==", value = false }]
surprise = "rank_gap"
context = ["rank", "rank_ra", "rd", "rf_def_total"]
links = ["H2"]
falsifier = "lift が 1 に近い（Fisher の p ≥ 0.05）。不足の形は順位と関係しない"
note = "低得点のチームはもともと大半が B クラスなので、成立率より lift と p を読む"

# ---- R4: 点が入る回が少ないのか、入っても少ないのか（research/R4-scoring-frequency-size.md） ----
# 追加: 2026-10-04。inn_* は実データでまだ計算していない。R1〜R3 の結果と PR #3 のイニング集計の要約は読んでいる。

[[proposition]]
id = "P22"
statement = "得点がリーグ5位以下だったシーズンの中日は、得点する回の頻度の不足が、得点した回の大きさの不足より大きい"
strength = "usually"
scope = { team = "d", seasons = "2013-2025", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "inn_freq_minus_size", op = "<", value = 0 }]
surprise = "inn_freq_minus_size"
context = ["rank", "inn_dlog_freq", "inn_dlog_size", "inn_dlog_rpi"]
links = ["H5", "H6"]
falsifier = "中日の低得点のシーズンの4分の1を超えて、大きさの不足のほうが大きい"
note = "成り立てば「点が入る回が少ない」。成り立たなければ「入っても1点で止まる」側を調べる"

[[proposition]]
id = "P23"
statement = "得点がリーグ5位以下のチーム・シーズンでは、得点する回の頻度の不足が、得点した回の大きさの不足より大きい"
strength = "more_often_than_not"
scope = { seasons = "2013-2025", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "inn_freq_minus_size", op = "<", value = 0 }]
surprise = "inn_freq_minus_size"
context = ["rank", "inn_dlog_freq", "inn_dlog_size"]
links = ["H5", "H6"]
falsifier = "低得点のチーム・シーズンの半数以上で、大きさの不足のほうが大きい"
note = "P22 と成立率を並べ、中日の形が低得点のチームの中で特別かを見る"

[[proposition]]
id = "P24"
statement = "得点がリーグ5位以下のチームの間では、得点する回の頻度の不足が大きい形なら B クラス"
strength = "usually"
scope = { seasons = "2013-2025", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = [{ col = "inn_freq_minus_size", op = "<", value = 0 }]
then = [{ col = "upper_half", op = "==", value = false }]
surprise = "rank_gap"
context = ["rank", "rank_ra", "rd", "inn_dlog_rpi"]
links = ["H5", "H6"]
falsifier = "lift が 1 に近い（Fisher の p ≥ 0.05）。形は順位と関係しない"
note = "低得点のチームはもともと大半が B クラスなので、成立率より lift と p を読む"

[[proposition]]
id = "P25"
statement = "P22 を、双方が6回まで攻撃した試合の1〜6回だけで見ても、頻度の不足が大きさの不足より大きい"
strength = "usually"
scope = { team = "d", seasons = "2013-2025", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "inn_freq_minus_size_6", op = "<", value = 0 }]
surprise = "inn_freq_minus_size_6"
context = ["inn_dlog_freq_6", "inn_dlog_size_6", "inn_freq_minus_size"]
links = ["H5", "H6"]
falsifier = "P22 と判定が食い違う（9回裏の省略・延長の扱いが結果を左右している）"
note = "9回裏の省略・サヨナラの途中終了の影響を小さくした比較。補正ではない"

# ---- R5: 点が入った回が小さいのはどこで・どの形でか（research/R5-scoring-inning-size.md） ----
# 追加: 2026-10-04。*_home / *_away / inn_*_share は実データでまだ計算していない。R4 の結果は見ている。

[[proposition]]
id = "P26"
statement = "得点がリーグ5位以下だったシーズンの中日は、得点した回のうち1点の回の割合が他球団より多い"
strength = "usually"
scope = { team = "d", seasons = "2013-2025", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "inn_d_single_share", op = ">", value = 0 }]
surprise = "inn_d_single_share"
context = ["inn_d_big_share", "inn_dlog_size", "rank"]
links = ["H5", "H6"]
falsifier = "中日の低得点のシーズンの4分の1を超えて、1点の回の割合が他球団以下"
note = "P27 と組で読む。片方だけ成り立つなら、大きさの不足はその側に集中している"

[[proposition]]
id = "P27"
statement = "得点がリーグ5位以下だったシーズンの中日は、得点した回のうち3点以上の回の割合が他球団より少ない"
strength = "usually"
scope = { team = "d", seasons = "2013-2025", where = [{ col = "rank_rf", op = ">=", value = 5 }] }
if = []
then = [{ col = "inn_d_big_share", op = "<", value = 0 }]
surprise = "inn_d_big_share"
context = ["inn_d_single_share", "inn_dlog_size", "rank"]
links = ["H5", "H6"]
falsifier = "中日の低得点のシーズンの4分の1を超えて、3点以上の回の割合が他球団以上"
note = "P30（中日以外の低得点のチーム）と成立率を並べ、中日固有かを見る"

[[proposition]]
