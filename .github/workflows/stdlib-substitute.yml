name: Stdlib substitute

# 実験: 1 ジョブの中で、入っている numpy で render_md と load_overlap の出力を取り、すぐ numpy を外す。
# 外した後は vendor/aoi の numpy_min.py（overlap と兄弟の rule_search より前に載せる）。polars は残す。
# render_md は両方とも自作の markdown.py（vendor/markdown）。バイト単位で比べる。
# Aoi は ci.yml と同じく実行時に main の SHA を解決する。既存の CI ジョブと pyproject の依存には触れない。
on:
  pull_request:
    paths:
      - vendor/aoi/shrink/numpy_min.py
      - vendor.lock.json
      - vendor/markdown/markdown.py
      - scripts/run_stdlib_paths.py
      - tests/test_stdlib_paths.py
      - dragowing.py
      - overlap.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/stdlib-substitute.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  without-numpy:
    name: render_md and load_overlap (real numpy, then numpy_min)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Resolve Aoi main
        id: aoi
        env:
          AOI_REPOSITORY_ID: "1402862784"
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          line=$(git ls-remote https://github.com/myon-bioinformatics/Aoi refs/heads/main)
          sha=$(printf '%s\n' "$line" | awk 'NF { print $1; exit }')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve Aoi main" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "dragowing-stdlib-substitute",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/Aoi",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["AOI_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/Aoi":
              raise SystemExit("Aoi repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Aoi main ${sha}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ steps.aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Aoi checkout matches resolved main
        env:
          AOI_SHA: ${{ steps.aoi.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AOI_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - name: Real packages, then record render_md and load_overlap
        id: recorded
        env:
          AOI_ROOT: ${{ github.workspace }}/.test-deps/aoi
        run: |
          set -euo pipefail
          uv sync --locked --python 3.15
          uv run --locked --python 3.15 pytest -q tests/test_vendor_lock.py tests/test_stdlib_paths.py
          eval "$(.venv/bin/python .test-deps/aoi/aoi.py)"  # Aoi の aoi.py が兄弟（rule_search）の場所を入れる
          .venv/bin/python scripts/run_stdlib_paths.py --deps real reference.json
      - name: Drop numpy; keep polars
        # 🧮 polars・numpy は dev グループにある。dev は残し、numpy だけを外す
        run: uv sync --locked --no-install-package numpy --python 3.15
      - name: numpy is not installed
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -c 'import numpy' && exit 1
          .venv/bin/python -c 'import polars'
      - name: render_md and load_overlap on numpy_min
        run: |
          set -euo pipefail
          eval "$(.venv/bin/python .test-deps/aoi/aoi.py)"  # Aoi の aoi.py が兄弟（rule_search）の場所を入れる
          .venv/bin/python scripts/run_stdlib_paths.py --deps min minimal.json
      - name: Byte-identical to the real numpy result
        run: cmp reference.json minimal.json
