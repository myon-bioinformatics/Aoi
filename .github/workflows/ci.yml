name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      aoi_ref:
        description: "Aoi ref to checkout. Empty resolves latest main."
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e

  resolve-aoi:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      aoi_sha: ${{ steps.resolve.outputs.aoi_sha }}
      myon_bioinformatics_sha: ${{ steps.resolve.outputs.myon_bioinformatics_sha }}
      markdown_sha: ${{ steps.resolve.outputs.markdown_sha }}
      web_ui_sha: ${{ steps.resolve.outputs.web_ui_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Resolve referenced repositories
        id: resolve
        env:
          AOI_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aoi_ref || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python localci.py resolve --github-output

  # vendor/aoi のバイトを、解決した Aoi の原本と shared-tools.lock.json に照合する。
  # pull request では不一致を警告にし、main への push と schedule では失敗にする。
  vendor-aoi:
    name: Aoi vendor hashes
    needs: [changes, resolve-aoi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.resolve-aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Compare vendored tools to the resolved Aoi tree
        env:
          EXPECTED_SHA: ${{ needs.resolve-aoi.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          AOI_REPOSITORY_ID: "1402862784"
        run: |
          set -euo pipefail
          uv --version
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved Aoi SHA missing" >&2
            exit 1
          fi
          actual=$(git -C .test-deps/aoi rev-parse HEAD)
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            mode="strict"
          else
            mode="report-only"
          fi
          {
            echo "## Aoi source"
            echo "Resolved \`$EXPECTED_SHA\`."
            echo "Repository id \`$AOI_REPOSITORY_ID\`."
            echo "Vendor hash check: $mode."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Aoi checkout $actual does not match resolved $EXPECTED_SHA" >&2
            if [[ "$strict" == "1" ]]; then
              exit 1
            fi
            echo "::warning::Aoi checkout does not match the resolved source commit (report-only for this event)"
          fi
          if [[ "$strict" == "1" ]]; then
            python -S scripts/check_vendor_aoi.py --aoi .test-deps/aoi
          else
            python -S scripts/check_vendor_aoi.py --aoi .test-deps/aoi --warn
          fi

  test:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [changes, resolve-aoi]
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Aoi の CI と同じ。failure-identity の expected-reports と揃えること
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require supported Node in parity CI
        run: node -e "if (+process.versions.node.split('.')[0] < 24) process.exit(1)"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.resolve-aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Source checkout provenance
        env:
          EXPECTED_SHA: ${{ needs.resolve-aoi.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved Aoi SHA missing" >&2
            exit 1
          fi
          actual=$(git -C .test-deps/aoi rev-parse HEAD)
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Aoi checkout $actual does not match resolved $EXPECTED_SHA" >&2
            if [[ "$strict" == "1" ]]; then
              exit 1
            fi
            echo "::warning::Aoi checkout does not match the resolved source commit (report-only for this event)"
          fi
      - name: Replace Aoi nagoyaction/ with this repository's tree
        run: |
          rm -rf .test-deps/aoi/nagoyaction
          mkdir .test-deps/aoi/nagoyaction
          git archive HEAD | tar -x -C .test-deps/aoi/nagoyaction
          # リンク確認のテストは git に登録したファイルで照合するので、置き換えた tree を index に載せる
          git -C .test-deps/aoi add -A nagoyaction
          test "$(git -C .test-deps/aoi write-tree --prefix=nagoyaction/)" = "$(git rev-parse 'HEAD^{tree}')"
      - run: python -m compileall -q -x '\.test-deps' .
      - name: Test with JUnit
        working-directory: .test-deps/aoi
        run: uv run --locked --python "${{ matrix.python }}" pytest -q -c pyproject.toml nagoyaction/tests --junitxml="$GITHUB_WORKSPACE/reports/junit.xml"
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: NagoyAction is stdlib-only and the cycle pipeline is runnable
        working-directory: .test-deps/aoi
        run: |
          python -S nagoyaction/nagoyaction.py doctor cycles/c001-chunichi/pipeline.toml
          python -S nagoyaction/nagoyaction.py run cycles/c001-chunichi/pipeline.toml --dry-run

  # 1 ジョブの中で、本物の polars で research_digest.collect のバイト列を取り、
  # polars と polars-runtime-32 を外してから vendor/aoi/shrink/polars_min.py で同じ collect を動かし、cmp する。
  # 最小版は scripts/collect_with_polars_min.py が vendor/aoi/ から載せる。
  polars-min:
    name: collect (real polars, then polars uninstalled)
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [changes, resolve-aoi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.resolve-aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Verify checkout matches resolved SHA
        env:
          AOI_SHA: ${{ needs.resolve-aoi.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$AOI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved Aoi SHA missing" >&2
            exit 1
          fi
          test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - name: Replace Aoi nagoyaction/ with this repository's tree
        run: |
          rm -rf .test-deps/aoi/nagoyaction
          mkdir .test-deps/aoi/nagoyaction
          git archive HEAD | tar -x -C .test-deps/aoi/nagoyaction
          git -C .test-deps/aoi add -A nagoyaction
          test "$(git -C .test-deps/aoi write-tree --prefix=nagoyaction/)" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Vendored polars_min equivalence, then record real collect
        working-directory: .test-deps/aoi
        run: |
          uv sync --locked --python 3.12
          test -f nagoyaction/vendor/aoi/shrink/polars_min.py
          test -f nagoyaction/vendor/aoi/scripts/shrink_module.py
          test -f nagoyaction/vendor/aoi/scripts/shrink_polars.py
          uv run --locked --python 3.12 pytest -q -c pyproject.toml nagoyaction/tests/test_vendor_aoi.py
          uv run --locked --python 3.12 python nagoyaction/scripts/collect_with_polars_min.py --deps real "$GITHUB_WORKSPACE/reference.json"
      - name: Reinstall locked runtime deps except polars and its compiled runtime
        working-directory: .test-deps/aoi
        run: uv sync --locked --no-dev --no-install-package polars --no-install-package polars-runtime-32 --python 3.12
      - name: polars is not installed
        working-directory: .test-deps/aoi
        run: |
          if .venv/bin/python -c 'import polars'; then
            echo "polars is still importable" >&2
            exit 1
          fi
      - name: Same collect on vendored polars_min
        working-directory: .test-deps/aoi
        run: .venv/bin/python nagoyaction/scripts/collect_with_polars_min.py --deps min "$GITHUB_WORKSPACE/minimal.json"
      - name: Byte-identical to the real polars collect result
        run: cmp "$GITHUB_WORKSPACE/reference.json" "$GITHUB_WORKSPACE/minimal.json"

  failure-identity:
    needs: [changes, test]
    if: (always()) && (needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e

  local-ci:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || needs.changes.outputs.workflow_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Run local CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AOI_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aoi_ref || '' }}
        run: |
          set -euo pipefail
          seed="${{ github.run_id }}"
          echo "localci seed=${seed}"
          python localci.py run --repeat 10 --seed "${seed}" --strict
