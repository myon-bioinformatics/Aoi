name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  test:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      # QueRyu（Aoi/queryu）はキャッシュ連携テストで使う。コピーせず、固定 SHA で別途 checkout する
      AOI_SHA: 7084f4bd8463dc8b4732f020ff96c431c7172bf8
      LAB_SHA: 81b1150d633d5c6aaedc893c951c8f584ba877e3
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - uses: actions/checkout@v5
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ env.AOI_SHA }}
          path: .test-deps/aoi
          persist-credentials: false
      - run: test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - uses: actions/checkout@v5
        with:
          repository: myon-bioinformatics/mcp-toolcall-lab
          ref: ${{ env.LAB_SHA }}
          path: .test-deps/lab
          persist-credentials: false
      - run: test "$(git -C .test-deps/lab rev-parse HEAD)" = "$LAB_SHA"
      - run: python -m compileall -q -x '\.test-deps' .
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run --locked --python "${{ matrix.python }}" pytest -q --require-blueprobe-lab-integration --junitxml=reports/junit.xml
        env:
          PYTHONPATH: ${{ github.workspace }}/.test-deps/aoi/queryu:${{ github.workspace }}/.test-deps/lab/src
          AOI_LAB_SOURCE_ROOT: ${{ github.workspace }}/.test-deps/lab/src
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
