name: Minimal stdlib distributions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      queryu-ref:
        description: 'QueRyu ref override; empty reads child-heads.json'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve QueRyu subtree head
        id: resolved
        env:
          QUERYU_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.queryu-ref || '' }}
        run: |
          set -euo pipefail
          resolve_head() {
            local remote="$1" ref="$2" sha
            ref="${ref#refs/heads/}"
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              sha="$ref"
            elif [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              sha=$(git ls-remote "$remote" "refs/heads/${ref}" | awk 'NR==1 { print $1 }')
            else
              echo "ref contains unsupported characters" >&2
              return 1
            fi
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "could not resolve ${ref}" >&2
              return 1
            fi
            printf '%s' "$sha"
          }
          if [[ -n "${QUERYU_REF}" ]]; then
            queryu_sha=$(resolve_head https://github.com/myon-bioinformatics/QueRyu.git "$QUERYU_REF")
          else
            queryu_sha=$(python -S -c 'import json,re,sys; sha=json.load(open("child-heads.json"))["heads"]["myon-bioinformatics/QueRyu"]["sha"]; ok=isinstance(sha,str) and re.fullmatch(r"[0-9a-f]{40}", sha); sys.exit("QueRyu sha in child-heads.json must be a full commit") if not ok else print(sha)')
          fi
          echo "queryu_sha=${queryu_sha}" >> "$GITHUB_OUTPUT"
          {
            echo '## Resolved distribution checkouts'
            echo "myon-bioinformatics/myon-bioinformatics 2192ff22acafdd09e80ac722df91ee937aaedd5e"
            echo "myon-bioinformatics/QueRyu ${queryu_sha}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 2192ff22acafdd09e80ac722df91ee937aaedd5e
          path: .test-deps/distribution-tools
          sparse-checkout: tools/minpy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/QueRyu
          ref: ${{ steps.resolved.outputs.queryu_sha }}
          path: .test-deps/distribution-sources/queryu
          persist-credentials: false
      - name: Restore approved frozen distribution compiler
        run: |
          python -S - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          tool = json.loads(Path("distributions.json").read_text())["tool"]
          commit = tool.get("commit", "")
          digest = tool.get("sha256", "")
          if (tool.get("repository") != "myon-bioinformatics/myon-bioinformatics"
                  or tool.get("source") != "tools/minpy.py"
                  or not re.fullmatch(r"[0-9a-f]{40}", commit)
                  or not re.fullmatch(r"[0-9a-f]{64}", digest)):
              raise SystemExit("invalid approved distribution compiler identity")
          checkout = ".test-deps/distribution-tools"
          subprocess.run(["git", "-C", checkout, "fetch", "--depth=1", "origin", commit], check=True, timeout=90)
          actual = subprocess.check_output(["git", "-C", checkout, "rev-parse", "FETCH_HEAD"], text=True, timeout=30).strip()
          if actual != commit:
              raise SystemExit("frozen distribution compiler commit mismatch")
          data = subprocess.check_output(["git", "-C", checkout, "show", actual + ":tools/minpy.py"], timeout=30)
          if hashlib.sha256(data).hexdigest() != digest:
              raise SystemExit("frozen distribution compiler SHA-256 mismatch")
          Path(".test-deps/frozen-minpy.py").write_bytes(data)
          print("Verified frozen distribution compiler: " + commit)
          PYCODE
      - name: Regenerate and compare every committed artifact and license
        run: python -S scripts/build_distributions.py --minpy .test-deps/frozen-minpy.py --sources .test-deps/distribution-sources --check
      - run: python -m pip install pytest
      - name: Exercise isolated single-file APIs
        run: python -m pytest -c pyproject.toml tests/test_distributions.py tests/test_distribution_kernels.py -q --junitxml=build/distributions-junit.xml
      - name: Preserve distribution JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-min-distributions
          path: build/distributions-junit.xml
          if-no-files-found: warn
          retention-days: 14
