# 保留の問い直し・第6弾（探索。正本の P1〜P114・outputs/・保存済みの年次表は変えない）。この冒頭が宣言で、下が命題。
#
# 記録: 2026-11-13 に書いた。固定の時刻と sha256 は kind_reask_prelock_timestamp.txt に足す。
#       このファイルを固定した時点では、第6弾のスクリプトも、sakanalytics の変更も、下の A・B の計算も書いていない。
# 承諾: 2026-11-13 のユーザーの指示（第5弾の「次の候補」2 つ）。形の指定は無かったので、Claude が「8 回まで」を選んだ
#       （第5弾で、勝ち試合・負け試合の両方の寄りが消えたのはこの形だけ。「9 回まで」は勝ち試合で 35 % と線の上に残る）。
# 置き場: 第1〜5弾と同じスクリプト（../kind_reask.py）と同じ結果ファイルに足す。増えるファイルはこの 1 つだけ。
#
# ==== A. 寄らない作り方の列を、年次表を作る道具に足して、中日の 2 つの命題を問い直す ====
#
# 道具の変更（既定は変えない）:
#   sakanalytics: 日程の観測に試合ごとの 8 回までの得点（hs8・as8）があるときだけ、win_loss_split を 8 回までの得点で
#     もう一度回し、列名の後ろに 8 を付けた列（wl_rf_win_gap8・wl_rf_loss_gap8 など 12 列）を足す。無ければ今までと同じ出力。
#   games_table_from_observed: 回ごとの得点から hs8・as8 を書く切り替え（既定は書かない）。
#   保存済みの年次表（outputs/season.jsonl と from-cycle-001/outputs/season.jsonl）は、LittleBit holdout と回収入力の照合が
#   ハッシュで固定しているので、書き換えない。足した列は、この探索の中で道具から作って使う。
# ゲート: 道具から作った wl_rf_win_gap8 が、第4弾で探索の中だけで作った値（2013〜2025年の 156 単位）と 1e-9 以内で一致する。
#   同じく E85・KE85・DE85 を道具の列で評価し直すと、第4弾の結果と数・終了コードが同じ。
# 命題: 下の E86・KE86・DE86（P86 の 8 回まで版。形は第4弾の E85・KE85・DE85 と同じ）。読み方も同じ。
# 見たもの（この宣言を書く前）: **第5弾で、P86・K86・D86 の列を 8 回までの値に替えた結果を見ている。**
#   中日は 12 中 8（終了コード 4）、B クラスは 72 中 35（同 3）、B クラスの中の中日の fisher_p は 0.146。
#   だから E86・KE86・DE86 の 2013〜2025年の結果は、宣言の前に分かっている。番号をつけるのは、これから足される年で読むため。
# 2026年（まだ使っていない年。記録のみ、読みはつけない）: 2026年の 858 試合の回ごとの得点から同じ道具で 8 回までの列を作り、
#   R18 の部分実行の 2026年の表に入れて、E85・E86・KE85・KE86・DE85・DE86 を confirm_units で数える。
#   2026年の 8 回までの値は見ていない。
# 予想（判定には使わない）:
#   (A1) ゲートが通る（差 0、E85・KE85・DE85 は第4弾と同じ）。
#   (A2) E86 は 12 中 8・終了コード 4、KE86 は 72 中 35・終了コード 3、DE86 の fisher_p は 0.146（第5弾で見た値から決まる）。
#   (A3) 2026年の B クラス 6 単位で、8 回までの勝ち試合の得点が負なのは 2〜4、負け試合の得点が正なのも 2〜4。
#
# ==== B. 得点と失点をランダムに組み合わせる見込みを使う、ほかの列にも延長による寄りがあるか ====
#
# 対象の列: 配分の効果（sakanalytics.allocation_table の alloc_*）と、作り直しの勝率・A クラスの確率（rank_probability の sim_*）。
# 確かめ方: 第3〜5弾と同じ 3 つの表（そのまま・9 回まで・8 回まで）を、同じ 2 つの関数に渡す。
#   ゲート: 「そのまま」の表から作った alloc_*・sim_* が、保存された値（2013〜2025年）と 1e-9 以内で一致する。
#   片寄りの読み（第5弾と同じ線に、強さに沿った寄りの線を足す。仮の線）:
#     見る量: alloc_net・alloc_net_strat・alloc_net_opp（実際の勝ち越し − 見込み）と、実際の勝率 − sim_wpct。
#     全体で正の単位の割合が 35〜65 % の外なら「片寄り」。
#     A クラスで正の割合 − B クラスで正の割合 が 0.30 以上なら「強さに沿った寄り」（A・B は実際の最終順位のまま）。
#   判定が変わる命題: alloc_*・sim_* を使う 13 件（P12・P13・P14・P50・P51・P52・P56・P60・P77・P78・P95・P96・K51）に、
#     列の値だけを替えた表を渡す（第5弾と同じ (a) そのまま・(b) 2012年を空・(c) 9 回まで・(d) 8 回まで）。
#     変わる = どれかの形の終了コードが (b) と違う。
# 見立て（先に書く）: 延長は、組み合わせなら同点で終わる試合を、実際には勝ち負けに変える。強いチームほど勝ち越しが増えるので、
#   「実際 − 見込み」は強いチームで正、弱いチームで負に寄る（全体では打ち消し合い、強さに沿った寄りとして出る）。
# 見たもの: 列の作り方。alloc_*・sim_* の値を、表ごとに替えて見たことはない。
# 予想（判定には使わない）:
#   (B1) ゲートが通る。
#   (B2) 「そのまま」で、4 つの量はどれも全体では片寄っていない（35〜65 %）。
#   (B3) 「そのまま」で、alloc_net_strat と「勝率 − sim_wpct」は強さに沿った寄り（A − B が 0.30 以上）。
#   (B4) 「9 回まで」で、alloc_net_strat の A − B は「そのまま」より小さくなる。
#   (B5) 13 件のうち、(c) で判定が変わるのは 2 件以上。
#   (B6) P52（式1）は (c) でも終了コードが変わらない。
#
# ==== 走らせないこと ====
#   強さ・線・範囲を結果を見てから変えること。保存済みの年次表の書き換え。sakanalytics の既定の出力を変えること。
#   思いついたことは README の未検討に書くだけ。

