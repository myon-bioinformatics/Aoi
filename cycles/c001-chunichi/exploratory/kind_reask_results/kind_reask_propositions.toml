# きっかけ: どれも中日の単位を見て書いた命題なので、motivated_by に範囲内の中日の単位を書く。中日以外は「きっかけ以外」で読む。

[[proposition]]
id = "K17"
statement = "得点がリーグ5位以下のチーム・シーズンなら、失点がリーグで2番目以内に少なくない"
strength = "usually"
if = [{ col = "rank_rf", op = ">=", value = 5 }]
then = [{ col = "rank_ra", op = ">=", value = 3 }]
parent = "P17"
change = "主語（中日）を外して12球団にし、範囲（where）に書いていた条件を「もし」に移した。条件を単位の種類に置いて、4つの形すべてに単位が入るようにする。強さと結論は親のまま"
