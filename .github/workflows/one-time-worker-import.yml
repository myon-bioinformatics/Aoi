name: One-time NagoyAction subtree import
on:
  push:
    branches: [codex/nagoyaction-worker]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'myon-bioinformatics/Aoi' && github.ref == 'refs/heads/codex/nagoyaction-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import reviewed owner history
        env:
          CHILD_SHA: b06f1f6bba210848ed8929556aea9da072f088f3
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git subtree pull --prefix=nagoyaction https://github.com/myon-bioinformatics/NagoyAction.git "$CHILD_SHA" -m "Subtree pull NagoyAction $CHILD_SHA (offline worker; no squash)"
          test "$(git rev-parse HEAD:nagoyaction)" = "$(git rev-parse "$CHILD_SHA^{tree}")"
          git merge-base --is-ancestor "$CHILD_SHA" HEAD
          git push origin HEAD:refs/heads/codex/nagoyaction-worker
