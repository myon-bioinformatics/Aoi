name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "dragowing.py"
      - "overlap.py"
      - "tests/test_formal_overlap_partition.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "dragowing.py"
      - "overlap.py"
      - "tests/test_formal_overlap_partition.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overlap-partition:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@main
    with:
      project-directory: formal
      proof: OverlapPartition.lean
      theorems: |
        DRAgoWing.region_contains_exact_signature
        DRAgoWing.every_row_once
