# サイクル2 月次の命題・第2弾（帯を家計調査の標本誤差にする）。事前宣言 monthly_prelock_r2_2026-11-13.md と一緒に固定した（判定の前）。
# 親は第1弾（monthly_propositions.toml）の同じ段の命題。変えたのは帯の幅だけで、強さ・条件の向き・結論は親のまま。
# ID の末尾 s は標本誤差（sampling）の帯、sx は 2025 を除く版。

[[proposition]]
id = "C2A3s"
statement = "E の前年比が標本のばらつき（1 標準誤差）以上に動いた月なら、E の前年比を足すと、先月の米価の変化までより誤差が小さい月が半分を超える（2025 を含む）"
strength = "more_often_than_not"
scope = { seasons = "2006-2025", where = [{ col = "family", op = "==", value = "A" }] }
if = [{ col = "axs", op = ">=", value = 1 }]
then = [{ col = "a3", op = "==", value = true }]
parent = "C2A3"
change = "帯の幅を E の公表刻み（0.1 ポイント）から、家計調査の標本誤差から作った ln E の前年比の標準誤差に替えた。強さ・結論は親のまま"
surprise = "gain3"
context = ["y", "x", "gamma", "f2", "f3", "axs"]
falsifier = "誤差が小さくなる月の割合の 95% 区間の上端が 0.5 を下回る"
note = "帯の幅は ln E の前年比の標準誤差 σ = 0.0240（宣言 r2 §2。消費支出の月の標準誤差率 1.5 %、食料はその 0.9/1.7 倍、相関 0 の上限、12 か月離れた月は別の世帯）。単位・訓練・見込みは親と同じ。親の結果を見たあとの問い直しで、同じ単位を使う"

