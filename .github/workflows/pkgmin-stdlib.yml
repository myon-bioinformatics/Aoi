name: requests tqdm biopython surface

# One job. Equivalence against the real packages, then the same Aoi entry points
# with those packages uninstalled and the stdlib stand-ins injected. The outputs
# are compared in this run. Existing workflows are not edited.
on:
  pull_request:
    paths:
      - pkgmin/**
      - tests/test_pkgmin_surface.py
      - .github/workflows/pkgmin-stdlib.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface:
    name: Used surface, then the real paths without the packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: false
          python-version: "3.15"
          activate-environment: true
      - name: Locked environment
        run: uv sync --locked --python 3.15
      - name: Survey and traces, packages not required
        run: uv run --locked --python 3.15 pytest -q tests/test_pkgmin_surface.py
      - name: Install requests, tqdm, and biopython at lower bounds
        run: uv pip install 'requests>=2.31.0' 'tqdm>=4.66.0' 'biopython>=1.83'
      - name: Equivalence against the installed packages
        env:
          PKGMIN_REQUIRE_REAL: "1"
        run: .venv/bin/python -m pytest -q tests/test_pkgmin_surface.py
      - name: Reference outputs with the real packages importable
        run: .venv/bin/python pkgmin/run_paths.py --inject none "${{ runner.temp }}/reference.json"
      - name: Wrap trace sees no project use
        run: .venv/bin/python pkgmin/trace_used.py expect-unused
      - name: Uninstall the three packages
        run: uv pip uninstall requests tqdm biopython
      - name: The packages are not installed
        shell: bash
        run: |
          set -euo pipefail
          if .venv/bin/python -c 'import requests' >/dev/null 2>&1; then
            echo 'requests is installed' >&2
            exit 1
          fi
          if .venv/bin/python -c 'import tqdm' >/dev/null 2>&1; then
            echo 'tqdm is installed' >&2
            exit 1
          fi
          if .venv/bin/python -c 'import Bio' >/dev/null 2>&1; then
            echo 'biopython (Bio) is installed' >&2
            exit 1
          fi
      - name: Same paths on the stdlib stand-ins
        run: .venv/bin/python pkgmin/run_paths.py --inject min "${{ runner.temp }}/minimal.json"
      - name: Outputs match
        run: cmp "${{ runner.temp }}/reference.json" "${{ runner.temp }}/minimal.json"
