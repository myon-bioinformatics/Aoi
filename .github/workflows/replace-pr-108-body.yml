name: Replace pull request description

on:
  push:
    branches:
      - chore/parent-pin-rollout-20261021
    paths:
      - .github/workflows/replace-pr-108-body.yml

permissions:
  issues: write
  pull-requests: write

jobs:
  replace-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace the pull request description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = """from: grok
          to: maintainers

          Tracks myon-bioinformatics/myon-bioinformatics#56. Reusable parent workflows stay pinned at 2192ff22acafdd09e80ac722df91ee937aaedd5e because uses cannot be dynamic. The local contract requires those uses refs to be that one 40-character SHA. Runtime tool checkouts are outside that contract.

          Tool checkouts resolve myon-bioinformatics/myon-bioinformatics latest main with git ls-remote, verify repository id 638801160, record the resolved SHA in the job summary, and check out that SHA.

          The resolved main checkout of tools/minpy.py is compared with the digest recorded in distributions.json. A mismatch is a warning on pull requests and a failure on a push to main, a schedule, or any other non-pull-request event. Current main serves 1acd095a6c3aea0449defc2673129834c61dc52fa8e93307fa3828c10ec98395. The approved digest is df4403701b00fe03f887a514701c4e13461d281188aec86b2dd8d148ff2fe771, commit bfacb98da72633c8c70d22fcef6dbab26d3f9294. Reproduction still fetches that approved compiler, verifies repository, path, commit, and digest, and writes it to a separate test-only file before running it. Vendor locks, distributions.json, distribution bytes, and child-heads.json are unchanged.

          Same-head CI is required before a merge commit pinned to that head. The known Offline Chrome export (Python 3.14) 8-second timing flake may be rerun without changing the test.
          """
          cleaned = body.strip() + "\n"
          if not cleaned.startswith("from: grok\n"):
              raise SystemExit("replacement does not start with from: grok")
          if "remove runtime main resolution" in cleaned or chr(64) in cleaned:
              raise SystemExit("replacement still contains retired wording")
          payload = json.dumps({"body": cleaned}).encode()
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/Aoi/pulls/108",
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "aoi-pr-body",
              },
          )
          with urllib.request.urlopen(request) as response:
              stored = json.load(response)["body"]
          first = stored.splitlines()[0] if stored else ""
          print("stored_first_line=" + first)
          if not stored.startswith("from: grok\n"):
              raise SystemExit("stored description does not start with from: grok")
          if "remove runtime main resolution" in stored:
              raise SystemExit("stored description still contains the retired phrase")
          PY
