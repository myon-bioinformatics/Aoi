# Markdown のリンクと画像の参照先を確かめる。テストと違い、docs/ だけの変更でも走る。
name: Links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown links (local + pushed branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Local (tracked files, exact case)
        run: python -S NagoyAction/checks/linkcheck.py
      - name: Remote (files exist on the pushed branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}  # ブランチ名は外部入力なので run に直接埋め込まない
        run: python -S NagoyAction/checks/linkcheck.py --remote "$REPO" --ref "$REF"
