# BlueProbe の CI と同じ形。Aoi は固定 SHA で checkout し、コピーしない。
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  test:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      # サイクルデータ（cycles/）・scripts/・sakanalytics は Aoi に残す。
      # Aoi main（#48/#49/#50 を #51 で統合したマージコミット）。
      AOI_SHA: 85243d6d1285e3bf4667e1447308543c7d648ab7
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Aoi の CI と同じ
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/checkout@v5
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ env.AOI_SHA }}
          path: .test-deps/aoi
          persist-credentials: false
      - run: test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - run: python -m compileall -q -x '\.test-deps' .
      - run: python -m pip install uv
      - run: uv run --python "${{ matrix.python }}" pytest -q --junitxml=reports/junit.xml
        env:
          AOI_ROOT: ${{ github.workspace }}/.test-deps/aoi
          PYTHONPATH: ${{ github.workspace }}/.test-deps/aoi/sakanalytics
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14

  vendor-locked:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    name: Vendor locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify and recreate locked vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path("vendor.lock.json").read_text(encoding="utf-8"))["files"]:
              Path(entry["destination"]).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
