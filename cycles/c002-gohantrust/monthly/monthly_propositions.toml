[[proposition]]
id = "C2A1"
statement = "翌月の米価の変化を、過去の平均の変化（ドリフト）で見込むと、ゼロ変化より誤差が小さい月が半分を超える（2025 を含む）"
strength = "more_often_than_not"
scope = { seasons = "2006-2025", where = [{ col = "family", op = "==", value = "A" }] }
then = [{ col = "a1", op = "==", value = true }]
surprise = "gain1"
context = ["y", "f1"]
falsifier = "誤差が小さくなる月の割合の 95% 区間の上端が 0.5 を下回る"
note = "単位は目標の月。訓練は起点の月までに結果が分かった目標月だけ（最小 60 点、2001-02 から）。月どうしの誤差は独立ではないので、区間は広めに読む。公表の遅れは扱わない"

