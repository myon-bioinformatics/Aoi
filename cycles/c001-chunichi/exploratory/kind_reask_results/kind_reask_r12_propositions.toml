# 保留の問い直し・第12弾（探索。正本の P1〜P114・outputs/・sakanalytics は変えない）。この冒頭が宣言で、下が命題。
#
# 記録: 2026-11-14 に書いた。固定の時刻と sha256 は kind_reask_prelock_timestamp.txt に足す。
#       このファイルを固定した時点では、第12弾のスクリプトも、下の命題の計算も書いていない。
# 承諾: 2026-11-14 のユーザーの指示（第11弾の「次の候補」の 2 つ目）。
#       「B クラスの中で戻る」を、得点・失点の分布（作り直しで A に入る確率 sim_p_upper）でそろえて問う。
#       戻るのが配分の巡り合わせか、分布がもともと良かったからかを、宣言してから分ける。
# 置き場: 第1〜11弾と同じスクリプト（../kind_reask.py）と同じ結果ファイルに足す。増えるファイルはこの 1 つだけ。
#         第1〜11弾の宣言・命題・結果の値は変えない。
#
# ==== 問い ====
# 第11弾の M52B: B クラスの中で、配分が不利（alloc_z_strat < −1）だった 24 単位は 15 が翌年 A クラス。不利でない 48 単位は 15。
# 配分が不利な B クラスは、得点・失点の分布ではもともと良かった（sim_p_upper が高い）かもしれない。
# そこで B クラスの 72 単位（2012〜2024年、2020年は除外）を、配分（不利・不利でない）と分布（高い・低い）の 4 つのマスに分ける。
#
# ==== 分布の線の決め方（結果を見る前に、条件の数だけを数えて決めた） ====
# サイクル3 の手順（4 つの形の件数を先に数える）のとおり、翌年のクラスは見ずに、マスに入る単位の数だけを数えた。
#   線 0.50（第1弾 K51 の線）: 不利でない・低い 46、不利でない・高い 2、不利・低い 17、不利・高い 7 → 2 つのマスが 10 未満
#   線 0.40（第10弾 N52S の線）: 43・5・16・8 → 2 つのマスが 10 未満
#   線 0.32: 38・10・12・12 → 4 つのマスすべてが 10 以上（0.30 は 35・13・9・15、0.33 は 40・8・13・11、0.35 は 43・5・14・10）
# 4 つのマスすべてに 10 単位以上入るのは 0.32 だけだったので、線は 0.32 にする（B クラスの上から 4 分の 1 あたり）。
# 線を前後にずらした 0.30 と 0.35 でも同じ 4 つを数えて並べる（読むだけ。読みには使わない）。
#
# ==== 命題と読み方 ====
# 命題: 下の 4 つ。結論はどれも「翌年は A クラス」。強さは親（M52B）のまま。列 upper_half_next の作り方は第10弾のまま。
#   - G52H・G52L: 分布をそろえて（高い群・低い群の中で）、配分が不利なら戻るか。
#   - G52U・G52N: 配分をそろえて（不利な群・不利でない群の中で）、分布が高いなら戻るか。
# 読み方（判定ではない。元の命題の fisher_p が 0.05 未満なら「そろえても効く」。第10・11弾と同じ線）:
#   1 = 配分の巡り合わせ: G52H か G52L が 0.05 未満で、G52U も G52N も 0.05 以上
#   3 = 分布がもともと良かった: G52U か G52N が 0.05 未満で、G52H も G52L も 0.05 以上
#   2 = 両方: 両方の側に 0.05 未満がある
#   4 = 分けられない: 4 つとも 0.05 以上（マスが 10〜38 単位なので、差があっても届かないことがある）
#   条件に当たる単位が 10 未満の命題は保留として、0.05 未満に数えない。終了コードは docs/propositions.md のまま。
# 添えるもの（命題にはしない）: 4 つのマスごとの、翌年 A クラスの数と割合。線 0.30・0.35 での同じ表。
#
# 見たもの（この宣言を書く前）:
#   - M52B の結果（24 中 15 と 48 中 15）。第10・11弾の表。
#   - 上のマスごとの単位の数と、配分が不利な 24 単位の sim_p_upper の値の並び（0.00〜0.89）。
#   - 見ていないもの: マスごとの翌年のクラス。4 つの命題の数と fisher_p。
# 予想（判定には使わない）:
#   (R1) 翌年 A クラスの割合は、「不利・高い」のマスが最も高く、「不利でない・低い」のマスが最も低い。
#   (R2) G52N（不利でない群の中で、分布が高い ⇒ 戻る）の fisher_p は 0.05 未満。
#   (R3) G52L（分布が低い群の中で、配分が不利 ⇒ 戻る）の fisher_p は 0.05 以上。
#   (R4) 読みは 3（分布がもともと良かった）。
#
# ==== 走らせないこと ====
#   強さ・線・範囲・読み方を、結果を見てから変えること（0.30・0.35 は並べるだけ）。sakanalytics の列の作り方の変更。
#   正本の outputs/ の書き換え。思いついたことは README の未検討に書くだけ。

[[proposition]]
id = "G52H"
statement = "B クラスで、得点・失点の分布から見た A クラスの確率が 0.32 以上の単位の中で、配分が不利（alloc_z_strat < −1）なら、翌年は A クラスに戻る"
strength = "usually"
scope = { seasons = "2012-2024", where = [{ col = "upper_half", op = "==", value = false }, { col = "sim_p_upper", op = ">=", value = 0.32 }] }
if = [{ col = "alloc_z_strat", op = "<", value = -1 }]
then = [{ col = "upper_half_next", op = "==", value = true }]
parent = "M52B"
change = "範囲を、B クラスのうち分布が高い（sim_p_upper が 0.32 以上）単位に絞った。比べる相手は、同じ分布の高さで配分が不利でなかった単位。条件・結論・強さは親のまま"
surprise = "alloc_z_strat"
context = ["rank", "sim_p_upper", "rd"]
links = ["H3", "H9"]
falsifier = "条件に当たる単位の4分の1を超えて、翌年も B クラス"

