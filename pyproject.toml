[project]
name = "queryu"
version = "0.1.0"
description = "再現できる取得が、確かな理解をつくる。取得と観測データセットの作成（Aoi の queryu/ から独立）"
requires-python = ">=3.11"
dependencies = [
    # 問いの候補（ask/suggest.py）。Aoi と同じ指定。2.4 系は Python 3.11–3.14、2.5.2 以降は 3.12–3.15。
    "numpy>=2.4,<2.5; python_version < '3.12'",
    "numpy>=2.5.2; python_version >= '3.12'",
    # BlueProbe（抽出）は固定 SHA の別 checkout を PYTHONPATH で渡す。BlueProbe 自体の依存だけここに置く
    "selectolax>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# サイクルデータ・blueprobe の fixture・nagoyaction/inbox は Aoi に残す（AOI_ROOT）。
# BlueProbe は固定 SHA の checkout を PYTHONPATH で渡す（.github/workflows/ci.yml と同じ）
pythonpath = [".", "ask"]
testpaths = ["tests"]
norecursedirs = ["vendor", ".test-deps", "build", "reports"]
