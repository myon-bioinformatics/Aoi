# 保留の問い直し・第10弾（探索。正本の P1〜P114・outputs/・sakanalytics は変えない）。この冒頭が宣言で、下が命題。
#
# 記録: 2026-11-13 に書いた。固定の時刻と sha256 は kind_reask_prelock_timestamp.txt に足す。
#       このファイルを固定した時点では、第10弾のスクリプトも、下の A・B の計算も書いていない。
# 承諾: 2026-11-13 のユーザーの指示。「8 回にこだわりすぎない。N 回と x 回（整数と実数）で、境界線が分かるなら動かしたり、
#       わざとずらしたりしてよい。ε（0 と 1 の間）の考え。点は取れないが、ε なら融通が利く」。
# 置き場: 第1〜9弾と同じスクリプト（../kind_reask.py）と同じ結果ファイルに足す。増えるファイルはこの 1 つだけ。
#
# ==== A. 境界を動かす: 「何回まで」を N（整数）と x（実数）にし、同点の扱いを θ（0 と 1 の間）にする ====
#
# 見る量: 「勝ち試合の得点 − 見込み」（wl_rf_win_gap）が負になった球団年の割合（144 球団年）。
#         そのまま（延長も含む）で 0.92、9 回までで 0.65、8 回までで 0.49 だった（第3〜5弾）。
#
# つまみ 1（x 回まで。x = N + ε）: 得点を「1〜N 回の点 + ε × (N+1) 回の点」にする。点は整数でしか入らないが、
#   ε を掛ければ、次の回を少しだけ入れられる。勝ち負けもこの得点で付け直す。
#   - 整数: N = 1〜8（N 回に届かない試合は外す）、9（延長に入った試合だけ 9 回終了時の得点に替える）、10（そのまま = 延長も全部）。
#   - 実数: 8 + ε（8 回までの点 + ε × 9 回の点。9 回裏が無ければ 0）と、9 + ε（9 回終了時の点 + ε × 延長の点）。
#   - 同じ sakanalytics.win_loss_split に、得点だけ替えた表を渡す（新しい計算の仕組みは作らない）。
# つまみ 2（θ。同点の扱い）: 得点は最終のまま。見込み（得点と失点の組み合わせ）の中の同点の組を、重み θ で
#   「半分は勝ち（得点は 1 点足す）、半分は負け」に数える。θ = 0 がいまの列（同点は外す）、θ = 1 が同点をすべて決める形。
#   実際の試合では 9 回の同点が延長で決まるので、見込みの側でも同点を決める、という置き方。
#   sakanalytics/epsilon.py の考え方（境界にちょうど乗った値を、頼まれたときだけ ε 持ち上げる）を、差がちょうど 0 の組に当てたもの。
# ε・θ の値: 決め打ちの刻み（0.25・0.5・0.75）に加えて、A × 10^(−k) の A（1 以上 10 未満）と k（1〜6）を乱数で選んだ 5 つ
#   （乱数の種は 20261113。値は結果に残す）。0 < ε < 1 は sakanalytics.epsilon.check_eps と同じ検査を通す。
# 境界の線をずらす: 「片寄り」の線を 0.60・0.65・0.70 の 3 通りにして、それぞれで、負の割合が線を超える最初の x と、
#   線の内側に戻る最初の θ を出す（線は 0.65 が第3弾からの仮の線。前後にわざとずらす）。
# ゲート: x = 8・9・10 と θ = 0 が、第3〜5弾の数（144 中 71・93・133・133）と同じ。
# 見たもの: 第3〜9弾の表。x = 1〜7、8 + ε、9 + ε、θ > 0 の値は見ていない。
# 予想（判定には使わない）:
#   (J1) ゲートが通る。
#   (J2) N = 1〜7 は、どれも負の割合が 0.35〜0.65。
#   (J3) 8 + ε は、どの ε でも 0.65 以下（8 回の同点は、実際の側でも見込みの側でも、同じように 9 回の点で決まる）。
#   (J4) 9 + ε は、どの ε > 0 でも 0.80 以上（境界は「延長に入った瞬間」にあり、ε では動かない。延長の点は、
#        延長に入った試合にしか無いので、見込みの側の同点はほとんど決まらない）。
#   (J5) θ を上げると負の割合は下がり、θ = 1 で 0.35〜0.65 に入る。0.65 を下回るのは θ が 0.3〜0.8 のどこか。
#
# ==== B. 配分の効果と最終順位の両方を使う命題を、最終順位と別の物差しで問い直す ====
#
# 第9弾で、配分の効果（得点・失点の分布から見込まれるより勝ったか）と最終順位は、定義から一部つながっていると分かった。
# 式1（P52: 作り直しで A の確率が 4 割未満 または 配分が不利 ⇒ B クラス）の結論を、その年の最終順位から替える。
#   - 翌年の B クラス（upper_half_next == false）: 同じ球団の次の年の最終順位。2019年の次は 2020年の実際の順位を使う
#     （2020年は単位としては除外のまま。第9弾の「前の年」と同じ扱い）。範囲は次の年がある 2012〜2024年。
#   - 得失点差で B（rank_rd >= 4）: その年の得失点差でリーグ 4 位以下。
# 命題: 下の 5 つ。強さは親（P52）のまま。読み方（判定ではない）: 元の命題の fisher_p が 0.05 未満なら
#   「条件が結論の割合を上げている」、0.05 以上なら「上げていない」。終了コードは docs/propositions.md のまま。
# 見たもの: P52 の判定（その年の B クラスで 83 中 73）。翌年・得失点差との組み合わせは見ていない。
# 予想:
#   (K1) N52A（配分が不利 ⇒ 翌年 B）: fisher_p は 0.05 以上（翌年を言い当てない）。
#   (K2) N52S（作り直しで A の確率 4 割未満 ⇒ 翌年 B）: fisher_p は 0.05 未満。
#   (K3) R52A（配分が不利 ⇒ 得失点差で B）: fisher_p は 0.05 以上。
#   (K4) N0（B クラス ⇒ 翌年も B）: 成立率は 0.60〜0.75。
#
# ==== 走らせないこと ====
#   強さ・線・範囲・ε の値を結果を見てから変えること（線は上の 3 通りを先に決めた）。sakanalytics の列の作り方の変更。
#   正本の outputs/ の書き換え。思いついたことは README の未検討に書くだけ。

[[proposition]]
id = "N0"
statement = "B クラスのチーム・シーズンなら、翌年も B クラスである"
strength = "usually"
scope = { seasons = "2012-2024" }
if = [{ col = "upper_half", op = "==", value = false }]
then = [{ col = "upper_half_next", op = "==", value = false }]
surprise = "rank_gap"
context = ["rank", "rd", "sim_p_upper"]
links = ["H1"]
falsifier = "B クラスの単位の4分の1を超えて、翌年は A クラス"
note = "N52・N52A・N52S を読むための土台（何も足さずに、B クラスであることだけで翌年をどれだけ言い当てるか）"

[[proposition]]
id = "N52"
statement = "得点・失点の分布から見た A クラスの確率が4割未満、または得点と失点の組み合わせ方が偶然の範囲を超えて不利なら、翌年は B クラスである"
strength = "usually"
scope = { seasons = "2012-2024" }
if_any = [[{ col = "sim_p_upper", op = "<", value = 0.4 }], [{ col = "alloc_z_strat", op = "<", value = -1 }]]
then = [{ col = "upper_half_next", op = "==", value = false }]
parent = "P52"
change = "結論を、その年の最終順位から翌年の最終順位に替えた。配分の効果と最終順位は定義から一部つながる（第9弾）ので、同じ年の勝ち負けを使わない結論で問い直す。範囲は次の年がある 2012〜2024年。強さは親のまま"
surprise = "rank_gap"
context = ["rank", "sim_p_upper", "alloc_z_strat", "rd"]
links = ["H2", "H3", "H9"]
falsifier = "条件に当たる単位の4分の1を超えて、翌年は A クラス"

[[proposition]]
id = "N52A"
statement = "得点と失点の組み合わせ方が偶然の範囲を超えて不利（alloc_z_strat < −1）なら、翌年は B クラスである"
strength = "usually"
scope = { seasons = "2012-2024" }
if = [{ col = "alloc_z_strat", op = "<", value = -1 }]
then = [{ col = "upper_half_next", op = "==", value = false }]
parent = "N52"
change = "条件を、式1 の 2 つの道のうち配分の効果の道だけにした"
surprise = "alloc_z_strat"
context = ["rank", "sim_p_upper", "rd"]
links = ["H3", "H9"]
falsifier = "条件に当たる単位の4分の1を超えて、翌年は A クラス"

