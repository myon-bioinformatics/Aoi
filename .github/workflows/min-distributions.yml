name: Minimal stdlib distributions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      parent-ref:
        description: 'Parent ref override; empty resolves latest main'
        required: false
        default: ''
        type: string
      queryu-ref:
        description: 'QueRyu ref override; empty reads child-heads.json'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve parent main and QueRyu subtree head
        id: resolved
        env:
          PARENT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.parent-ref || '' }}
          QUERYU_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.queryu-ref || '' }}
          PARENT_REPOSITORY_ID: "638801160"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          resolve_head() {
            local remote="$1" ref="$2" sha
            ref="${ref#refs/heads/}"
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              sha="$ref"
            elif [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              sha=$(git ls-remote "$remote" "refs/heads/${ref}" | awk 'NR==1 { print $1 }')
            else
              echo "ref contains unsupported characters" >&2
              return 1
            fi
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "could not resolve ${ref}" >&2
              return 1
            fi
            printf '%s' "$sha"
          }
          python -S - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "aoi-parent-resolve",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/myon-bioinformatics",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["PARENT_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/myon-bioinformatics":
              raise SystemExit("parent repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          if [[ -n "${PARENT_REF}" ]]; then
            parent_sha=$(resolve_head https://github.com/myon-bioinformatics/myon-bioinformatics.git "$PARENT_REF")
          else
            # Live provenance must not resolve the frozen distributions.json compiler.
            parent_sha=$(resolve_head https://github.com/myon-bioinformatics/myon-bioinformatics.git main)
          fi
          if [[ -n "${QUERYU_REF}" ]]; then
            queryu_sha=$(resolve_head https://github.com/myon-bioinformatics/QueRyu.git "$QUERYU_REF")
          else
            queryu_sha=$(python -S -c 'import json,re,sys; sha=json.load(open("child-heads.json"))["heads"]["myon-bioinformatics/QueRyu"]["sha"]; ok=isinstance(sha,str) and re.fullmatch(r"[0-9a-f]{40}", sha); sys.exit("QueRyu sha in child-heads.json must be a full commit") if not ok else print(sha)')
          fi
          echo "parent_sha=${parent_sha}" >> "$GITHUB_OUTPUT"
          echo "queryu_sha=${queryu_sha}" >> "$GITHUB_OUTPUT"
          {
            echo '## Resolved distribution checkouts'
            echo "myon-bioinformatics/myon-bioinformatics ${parent_sha}"
            echo "repository_id ${PARENT_REPOSITORY_ID}"
            echo "myon-bioinformatics/QueRyu ${queryu_sha}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: ${{ steps.resolved.outputs.parent_sha }}
          path: .test-deps/distribution-tools
          sparse-checkout: tools/minpy.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/QueRyu
          ref: ${{ steps.resolved.outputs.queryu_sha }}
          path: .test-deps/distribution-sources/queryu
          persist-credentials: false
      # Keep the live checkout intact: fetch/show the approved compiler into a separate file.
      - name: Restore approved frozen distribution compiler
        run: |
          python -S - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          tool = json.loads(Path("distributions.json").read_text())["tool"]
          commit = tool.get("commit", "")
          digest = tool.get("sha256", "")
          if (tool.get("repository") != "myon-bioinformatics/myon-bioinformatics"
                  or tool.get("source") != "tools/minpy.py"
                  or not re.fullmatch(r"[0-9a-f]{40}", commit)
                  or not re.fullmatch(r"[0-9a-f]{64}", digest)):
              raise SystemExit("invalid approved distribution compiler identity")
          checkout = ".test-deps/distribution-tools"
          subprocess.run(["git", "-C", checkout, "fetch", "--depth=1", "origin", commit], check=True, timeout=90)
          actual = subprocess.check_output(["git", "-C", checkout, "rev-parse", "FETCH_HEAD"], text=True, timeout=30).strip()
          if actual != commit:
              raise SystemExit("frozen distribution compiler commit mismatch")
          data = subprocess.check_output(["git", "-C", checkout, "show", actual + ":tools/minpy.py"], timeout=30)
          if hashlib.sha256(data).hexdigest() != digest:
              raise SystemExit("frozen distribution compiler SHA-256 mismatch")
          Path(".test-deps/frozen-minpy.py").write_bytes(data)
          print("Verified frozen distribution compiler: " + commit)
          PYCODE
      - name: Regenerate and compare every committed artifact and license
        run: python -S scripts/build_distributions.py --minpy .test-deps/frozen-minpy.py --sources .test-deps/distribution-sources --check
      - name: Compare resolved parent tool provenance
        env:
          PARENT_SHA: ${{ steps.resolved.outputs.parent_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          head=$(git -C .test-deps/distribution-tools rev-parse HEAD)
          if [[ "$head" != "$PARENT_SHA" ]]; then
            echo "parent tool checkout is not the resolved SHA" >&2
            exit 1
          fi
          python -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          tool = json.loads(Path("distributions.json").read_text(encoding="utf-8"))["tool"]
          recorded = tool.get("sha256")
          if (tool.get("repository") != "myon-bioinformatics/myon-bioinformatics"
                  or tool.get("source") != "tools/minpy.py"
                  or not isinstance(recorded, str)
                  or re.fullmatch(r"[0-9a-f]{64}", recorded) is None):
              raise SystemExit("distributions.json tool identity is not parent tools/minpy.py")
          digest = hashlib.sha256(Path(".test-deps/distribution-tools/tools/minpy.py").read_bytes()).hexdigest()
          event = os.environ["EVENT_NAME"]
          strict = event != "pull_request"
          mismatch = digest != recorded
          lines = [
              "## Parent tool provenance",
              "",
              "- resolved_sha: `%s`" % os.environ["PARENT_SHA"],
              "- checkout_sha256: `%s`" % digest,
              "- approved_commit: `%s`" % tool.get("commit"),
              "- approved_sha256: `%s`" % recorded,
              "- mode: %s" % ("strict" if strict else "report-only"),
              "- result: %s" % ("mismatch" if mismatch else "match"),
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if mismatch:
              message = "resolved parent tools/minpy.py sha256 %s != recorded %s" % (digest, recorded)
              print(("::error::" if strict else "::warning::") + message, file=sys.stderr)
              if strict:
                  raise SystemExit(1)
          PY
      - run: python -m pip install pytest
      - name: Exercise isolated single-file APIs
        run: python -m pytest -c pyproject.toml tests/test_distributions.py tests/test_distribution_kernels.py -q --junitxml=build/distributions-junit.xml
      - name: Preserve distribution JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-min-distributions
          path: build/distributions-junit.xml
          if-no-files-found: warn
          retention-days: 14
