name: Season simulator
on:
  push:
    branches: [main]
    paths: ['sakanalytics/season*', 'sakanalytics/tests/test_season_simulator.py', '.github/workflows/season-simulator.yml']
  pull_request:
    paths: ['sakanalytics/season*', 'sakanalytics/tests/test_season_simulator.py', '.github/workflows/season-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77 # actionlint v1.7.12
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        solver: [stdlib, exact]
    env:
      PYTHONPATH: sakanalytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '${{ matrix.python }}'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Verify optional solver is absent
        if: matrix.solver == 'stdlib'
        run: uv run --locked --python "${{ matrix.python }}" python -c "import importlib.util; assert importlib.util.find_spec('ortools') is None"
      - name: Test without optional solver
        if: matrix.solver == 'stdlib'
        run: uv run --locked --python "${{ matrix.python }}" pytest -c pyproject.toml sakanalytics/tests/test_season_simulator.py -q
      - name: Test with locked optional solver
        if: matrix.solver == 'exact'
        run: uv run --locked --python "${{ matrix.python }}" --with-requirements sakanalytics/season-requirements.txt pytest -c pyproject.toml sakanalytics/tests/test_season_simulator.py -q
      - run: uv run --locked --python "${{ matrix.python }}" python -m compileall -q sakanalytics/season_simulator.py sakanalytics/season_exact.py
      - name: Exercise result-free synthetic CLI
        if: matrix.solver == 'exact'
        run: uv run --locked --python "${{ matrix.python }}" --with-requirements sakanalytics/season-requirements.txt python sakanalytics/season_simulator.py sakanalytics/season-example.json --as-of 2022-01-01 --through 2022-01-04 --trials 100 --exact --output /tmp/season-example-output.json
