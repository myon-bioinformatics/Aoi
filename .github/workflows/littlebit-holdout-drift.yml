name: LittleBit holdout drift

on:
  pull_request:
    paths:
      - 'pythdragoras/**'
      - 'cycles/c001-chunichi/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/littlebit-holdout-drift.yml'
  push:
    branches: [main]
    paths:
      - 'pythdragoras/**'
      - 'cycles/c001-chunichi/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/littlebit-holdout-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: littlebit-holdout-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Exact current-generator replay (Python 3.14.8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AOI_REGENERATE_LITTLEBIT_HOLDOUT: '1'
      AOI_HOLDOUT_DRIFT_OUTPUT: build/littlebit-holdout-drift/regenerated
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Install uv
        run: python -m pip install uv
      - name: Diagnose exact numerical backend without changing evidence
        run: |
          mkdir -p build/littlebit-holdout-drift
          uv run --locked --python 3.14.8 python -c 'import numpy as np; np.show_config()'
          grep -m1 'model name' /proc/cpuinfo
          cp cycles/c001-chunichi/outputs/exploratory/littlebit-holdout/holdout.json build/littlebit-holdout-drift/committed-holdout.json
          kernels='Haswell Sandybridge Nehalem'
          if grep -q avx512f /proc/cpuinfo; then
            kernels="$kernels SkylakeX Cooperlake"
          fi
          status=1
          for kernel in $kernels; do
            echo "NUMERICAL_BACKEND=$kernel"
            export OPENBLAS_CORETYPE="$kernel"
            export AOI_HOLDOUT_DRIFT_OUTPUT="build/littlebit-holdout-drift/$kernel"
            if uv run --locked --python 3.14.8 pytest -q -s \
              pythdragoras/tests/test_littlebit_holdout_drift.py::test_littlebit_committed_holdout_regenerates_from_current_generator \
              --junitxml="build/littlebit-holdout-drift/pytest-$kernel.xml"; then
              echo "EXACT_MATCH=$kernel"
              status=0
            fi
          done
          exit "$status"
      - name: Preserve full regenerated evidence and verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: littlebit-holdout-drift
          path: build/littlebit-holdout-drift/
          if-no-files-found: error
          retention-days: 14
