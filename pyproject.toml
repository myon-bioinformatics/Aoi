[project]
name = "aoi"
version = "0.1.0"
description = "Observe. Measure. Question."
requires-python = ">=3.11"
dependencies = ["polars>=1.30", "httpx>=0.28", "selectolax>=0.3.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# サブプロジェクトはそれぞれ単独のディレクトリ。将来の分離に備え、互いをパッケージにしない
# フォルダ名はサブプロジェクト名（BlueProbe など）、.py は小文字。同名のメインファイルはトップに、
# それ以外は用途のフォルダ（baseball/ = 野球の取得元・シミュレーター、logic/ = 命題と集合、checks/、reports/）に置く
pythonpath = ["BlueProbe", "BlueProbe/baseball", "QueRyu", "QueRyu/ask", "SakAnalytics", "SakAnalytics/baseball",
              "PythDRagoras", "PythDRagoras/logic", "NagoyAction", "NagoyAction/checks", "DRAgoWing", "DRAgoWing/reports"]
testpaths = ["BlueProbe/tests", "QueRyu/tests", "SakAnalytics/tests", "PythDRagoras/tests", "NagoyAction/tests", "DRAgoWing/tests"]
