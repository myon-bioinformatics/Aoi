name = "bounded-research"
root = "../.."

[requires]
python = "3.11"
tools = ["git", "uv"]

[[step]]
name = "dependencies"
run = ["uv", "sync", "--frozen"]
network = true
outputs = [".venv/pyvenv.cfg"]

[[step]]
name = "explore"
run = ["uv", "run", "--frozen", "python", "nagoyaction/inbox/inbox.py", "worker", "--seconds", "18000"]
network = true
