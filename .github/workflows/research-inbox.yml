name: Aoi question inbox

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aoi-question-inbox
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      vars.AOI_INBOX_ISSUE != '' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.number == fromJSON(vars.AOI_INBOX_ISSUE) &&
        startsWith(github.event.comment.body, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Restore verified model cache
        if: vars.AOI_USE_LOCAL_LLM == '1'
        uses: actions/cache@v4
        with:
          path: .models
          key: aoi-llama-${{ vars.AOI_LLAMA_MODEL_SHA256 }}
      - name: Run NagoyAction inbox and optional Docker hooks
        env:
          GH_TOKEN: ${{ github.token }}
          AOI_INBOX_ISSUE: ${{ vars.AOI_INBOX_ISSUE }}
          AOI_USE_LOCAL_LLM: ${{ vars.AOI_USE_LOCAL_LLM }}
          AOI_LLAMA_IMAGE: ${{ vars.AOI_LLAMA_IMAGE }}
          AOI_LLAMA_MODEL_URL: ${{ vars.AOI_LLAMA_MODEL_URL }}
          AOI_LLAMA_MODEL_SHA256: ${{ vars.AOI_LLAMA_MODEL_SHA256 }}
        run: >-
          python NagoyAction/nagoyaction.py run NagoyAction/pipelines/inbox.toml
          --receipt build/inbox-receipt.jsonl
      - name: Preserve any checkpoint whose push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-recovery-${{ github.run_id }}
          path: |
            .research-state/requests
            .research-state/receipts
            .research-state/answers
            .research-state/stops
            build/inbox-receipt.jsonl
            .models/identity.json
          include-hidden-files: true
          if-no-files-found: ignore
