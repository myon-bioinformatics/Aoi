# 保留の問い直し・第11弾（探索。正本の P1〜P114・outputs/・sakanalytics は変えない）。この冒頭が宣言で、下が命題。
#
# 記録: 2026-11-14 に書いた。固定の時刻と sha256 は kind_reask_prelock_timestamp.txt に足す。
#       このファイルを固定した時点では、第11弾のスクリプトも、下の A・B の計算も書いていない。
# 承諾: 2026-11-14 のユーザーの指示（第10弾の「次の候補」2 つ）。
#       1. 「勝ち試合の得点 − 見込み」の列を直す形を決める。θ = 1（延長を残す）と wl_*8（8 回まで）を同じ命題で並べ、線は先に置く。
#       2. 「配分が不利だったチームは翌年 A クラスに戻る」を命題として問う。
# 置き場: 第1〜10弾と同じスクリプト（../kind_reask.py）と同じ結果ファイルに足す。増えるファイルはこの 1 つだけ。
#         第1〜10弾の宣言・命題・結果の値は変えない。
#
# ==== A. 列を直す形を決める: θ = 1（延長を残す）と 8 回まで ====
#
# 2 つの候補（どちらも 2013〜2025年、2020年は除外の 144 球団年）:
#   - 8 回まで: wl_rf_win_gap8（第3・4弾。SakAnalytics の win_loss_split_eighth と同じ値）。
#   - θ = 1 : wl_rf_win_gap_t1 = 最終の得点のまま、見込みの中の同点の組を「半分は勝ち（1 点足す）・半分は負け」に数えた差
#             （第10弾のつまみ 2 の θ = 1。../kind_reask.py の tie_weighted_gap をそのまま使う）。
# 同じ命題で並べる: 第4弾の 3 つ（E85・KE85・DE85）と同じ形を、θ = 1 の列で下に書く（T85・KT85・DT85）。
#   強さ・範囲・きっかけの単位は第4弾のまま。読み方も第1弾（KT85）・第2弾 B（DT85 の fisher_p）のまま。
#
# 測るもの（線は仮。結果を見てから動かさない）:
#   (ア) 片寄り: 負の球団年の割合が 0.35〜0.65 なら「片寄りなし」（第3弾からの線）。
#   (イ) 揺らし: 境界をわざと少しずらす。θ = 1 − ε、8 回までは x = 8 + ε（8 回までの点 + ε × 9 回の点）。
#        ε は第10弾で引いた 5 つ（4.277e-06・0.0001855・0.0009206・0.01591・0.02608。乱数の種 20261113。新しい値は引かない）。
#        その 5 つのすべてで、3 つの命題の各形の終了コードが、ずらす前と同じなら「揺らしても同じ」。
#        符号が変わる球団年の数も出す（線は置かない）。0.25・0.5・0.75 は、どこで変わるかを見るために出すだけ。
#   (ウ) 並び: 元の列（wl_rf_win_gap）との順位相関（スピアマン）が 0.80 以上なら「元の並びを保つ」
#        （片寄りが全球団に共通のずれなら、直した列は元の並びを保つはず）。
#   (エ) 2 つの候補どうし: 符号が同じ球団年の割合が 0.75 以上、かつ順位相関が 0.80 以上なら「同じものを見ている」（読むだけ）。
#
# 決め方（先に決める）:
#   1. (ア)(イ)(ウ) の 3 つを満たす候補を「使える」とする。
#   2. 両方使えて、3 組（T85 と E85・KT85 と KE85・DT85 と DE85）の終了コードと読みがすべて同じなら「どちらでも結論は同じ」。
#      このとき勧めるのは θ = 1（最終の得点だけで作れて回ごとの得点が要らない。延長を捨てない。既存の関数に引数を足す形で済む）。
#   3. 両方使えて、どれかの組で終了コードか読みが違うなら「列の形で結論が変わる」。勧めは出さず、違いを並べて未決のままにする。
#   4. 片方だけ使えるなら、その候補を勧める。どちらも使えないなら、どちらも勧めない。
#   決まっても、この弾では正本の列も SakAnalytics も変えない（変えるのは、勧めを見てもらってからの別の作業）。
#
# 見たもの（この宣言を書く前）:
#   - 負の数: 8 回まで 71/144、θ = 1 で 76/144（第3・10弾）。つまり (ア) は両方とも満たすと分かっている。
#   - 8 + ε の負の数: ε が小さい 4 つで 77、0.02608 で 78（第10弾）。8 回までは、少しずらすと 6〜7 球団年ぶん動くと分かっている。
#   - θ を下げたときの負の数: 0.75 で 93、0.5 で 110（第10弾）。θ = 1 − ε（小さい ε）の値は見ていない。
#   - E85（中日 12 中 5、終了コード 3）・KE85（読み 4）・DE85（fisher_p 0.735、読み 2）（第4弾）。
#   - 見ていないもの: θ = 1 の列の球団ごと・年ごとの値、2 つの列の相関と符号の一致、T85・KT85・DT85 の数、ずらしたときの終了コード。
# 予想（判定には使わない）:
#   (Q1) ゲート: θ = 1 の列の負の数は 76、8 回までは 71（第10弾・第3弾と同じ）。
#   (Q2) 並び: θ = 1 の列は元の列との順位相関が 0.80 以上で、8 回までの列より高い。
#   (Q3) 2 つの候補どうし: 符号が同じ球団年の割合は 0.65〜0.85。
#   (Q4) T85: 中日の 12 単位のうち負は 4〜8。終了コードは 0・1（支持）にならない。
#   (Q5) DT85 の fisher_p は 0.05 以上。KT85 の読みは 1 にならない。
#   (Q6) 揺らし: θ = 1 − ε は 5 つとも終了コードが変わらない。8 + ε は、どれかの ε で、どれかの命題の終了コードが変わる。
#
# ==== B. 「配分が不利だったチームは翌年 A クラスに戻る」を問う ====
#
# 命題: 下の 3 つ。条件は第10弾の N52A と同じ（alloc_z_strat < −1）。結論を「翌年は A クラス」にする。
#   - M52A: 範囲は N52A と同じ（次の年がある 2012〜2024年）。
#   - M52B: 範囲を、その年が B クラスの単位に絞る（「戻る」の本来の意味。比べる相手は、配分が不利でなかった B クラス）。
#   - M52U: 範囲を、その年が A クラスの単位に絞る（配分が不利でも A クラスだった球団が、翌年も A クラスか）。
#   列 upper_half_next の作り方は第10弾のまま（2019年の次は 2020年の実際の順位。2020年は単位としては除外のまま）。強さは親のまま。
# 読み方（第10弾のまま。新しい読み方は作らない）: 元の命題の fisher_p が 0.05 未満なら「条件が結論の割合を上げている」、
#   0.05 以上なら「上げていない」。条件に当たる単位が 10 未満なら保留。終了コードは docs/propositions.md のまま。
# 添えるもの（命題にはしない）: 条件に当たる単位のうち、中日の単位と、その翌年のクラス。
#
# 見たもの（この宣言を書く前）: N52A の 4 つの形の数（第10弾）。M52A の数はそこから決まるので、見たのと同じ:
#   配分が不利 27（翌年 A 18・翌年 B 9）、不利でない 117（翌年 A 54・翌年 B 63）。M52A の fisher_p は計算していない。
#   27 単位がその年 A クラスと B クラスにどう分かれるか（M52B・M52U の数）は見ていない。
# 予想:
#   (L1) M52A: 元 27 中 18・対偶 72 中 63・逆 72 中 18・裏 117 中 63（N52A から決まる）。fisher_p は 0.10 未満。
#   (L2) M52B: 条件に当たる単位は 15 以上で、成立率は 0.50 以上。fisher_p は 0.05 未満。
#   (L3) M52U: 条件に当たる単位は 10 未満（保留）。
#
# ==== 走らせないこと ====
#   強さ・線・範囲・ε の値・決め方を、結果を見てから変えること。sakanalytics の列の作り方の変更。正本の outputs/ の書き換え。
#   思いついたことは README の未検討に書くだけ。

[[proposition]]
id = "T85"
statement = "中日は、見込みの同点を決める形（θ = 1）で見て、勝ち試合の得点が、自分の得点・失点の分布から見込まれるより少ない"
strength = "usually"
scope = { team = "d", seasons = "2013-2025" }
if = []
then = [{ col = "wl_rf_win_gap_t1", op = "<", value = 0 }]
parent = "P85"
change = "結論の列を、見込みの中の同点の組を半分は勝ち（1 点足す）・半分は負けに数えて作り直した値に替えた（元の列は、延長で同点が決まるぶん、どの球団でも負に寄る。第3・10弾）。得点は最終のまま。範囲は試合の記録がある 2013〜2025年。強さは親のまま"
surprise = "wl_rf_win_gap_t1"
context = ["wl_rf_win_gap", "rank", "rd"]
links = ["H2", "H3"]
falsifier = "中日のシーズンの4分の1を超えて、θ = 1 で見た勝ち試合の得点が見込み以上"

