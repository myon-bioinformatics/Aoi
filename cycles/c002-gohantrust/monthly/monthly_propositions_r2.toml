[[proposition]]
id = "C2B3s"
statement = "食料（消費者物価指数）の前年比から量を固定して見込んだ E の動きが、標本のばらつき（1 標準誤差）以上の月では、E の前年比はその向きに動く（2025 を含む）"
strength = "always"
scope = { seasons = "2001-2025", where = [{ col = "family", op = "==", value = "B" }, { col = "acs3", op = ">=", value = 1 }] }
if = [{ col = "c3", op = ">", value = 0 }]
then = [{ col = "yE", op = ">", value = 0 }]
parent = "C2B3"
change = "帯の幅を E の公表刻み（0.1 ポイント）から、家計調査の標本誤差から作った ln E の前年比の標準誤差に替えた。強さ・条件・結論は親のまま"
surprise = "u3"
context = ["c1", "c2", "c3", "c4", "tau"]
falsifier = "見込みの向きと E の前年比の向きが逆の月が 1 つでもある"
note = "帯の幅は ln E の前年比の標準誤差 σ = 0.0240（宣言 r2 §2）。式の見込みが σ 以上の月だけを言い切る。会計上のつながりを含む。親の結果を見たあとの問い直しで、同じ単位を使う。下げと言い切る月は 2 か月（段 3）・1 か月（段 4）しかないので、裏は件数が足りない（宣言 r2 §3）"

