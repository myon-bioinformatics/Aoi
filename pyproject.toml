[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aoi"
version = "0.1.0"
description = "Observe. Measure. Question."
requires-python = ">=3.11"
# git から入るのは標準ライブラリの共有モジュールだけ。研究用ライブラリは下のグループ。

[dependency-groups]
dev = ["pytest>=8", "coverage>=7", "selectolax>=1"]
runtime = [
    "polars>=2",
    "httpx>=0.28",
    # 2.4 系は Python 3.11–3.14、2.5.2 以降は 3.12–3.15（3.15 の wheel は 2.5.2 から）。
    "numpy>=2.4; python_version < '3.12'",
    "numpy>=2.5.2; python_version >= '3.12'",
    # 図はブラウザの plotly.js。Python plotly は置かない。matplotlib / seaborn / statsmodels も置かない。
    # ページの文章。実行時の依存はこのパッケージだけで、3.11–3.15。
    "markdown>=3.7",
]

[tool.uv]
default-groups = ["dev", "runtime"]

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"scripts/fetch_module.py" = "fetch_module.py"
"shrink/numpy_min.py" = "numpy_min.py"

[tool.hatch.build.targets.sdist]
only-include = ["scripts/fetch_module.py", "shrink/numpy_min.py"]

[tool.pytest.ini_options]
# サブプロジェクトはそれぞれ単独のディレクトリ。将来の分離に備え、互いをパッケージにしない
pythonpath = [".", "blueprobe", "queryu", "queryu/ask", "sakanalytics", "pythdragoras", "nagoyaction", "nagoyaction/inbox", "dragowing"]
testpaths = ["tests", "blueprobe/tests", "queryu/tests", "sakanalytics/tests", "pythdragoras/tests", "nagoyaction/tests", "dragowing/tests"]
