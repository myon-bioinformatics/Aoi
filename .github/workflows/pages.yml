name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only). The parent's reusable
# workflow renders it with the PySaiyanWeBoo commit pinned there — no HTML, CSS or JS lives in this repository.
# Pull requests build the page (an invalid spec fails there); only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
      - "queryu.py"
      - "ask/*.py"
      - "core/cache_core.py"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
      - "queryu.py"
      - "ask/*.py"
      - "core/cache_core.py"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@a6996161eb1e8509a1673f68dd66f0e83efbada0
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_features_config: docs/guide.features.json
      guide_brand: QueRyu   # ♻️ icon and favicon from CaChereCyCle (QueRyu.icon / QueRyu.favicon)
