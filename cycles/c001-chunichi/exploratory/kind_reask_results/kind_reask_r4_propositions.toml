# 保留の問い直し・第4弾（探索。正本の P1〜P114・outputs/・sakanalytics は変えない）。この冒頭が宣言で、下が命題。
#
# 記録: 2026-11-13 に書いた。固定の時刻と sha256 は kind_reask_prelock_timestamp.txt に足す。
#       このファイルを固定した時点では、第4弾のスクリプトも、下の A・B・C の計算も書いていない（見たものは各節に書く）。
# 承諾: 2026-11-13 のユーザーの指示（第3弾の「次の候補」2 つと、2026年のチーム打撃がリポジトリの中にあるという指摘）。
# 置き場: 第1〜3弾と同じスクリプト（../kind_reask.py）と同じ結果ファイルに足す。増えるファイルはこの 1 つだけ。
#         第1〜3弾の宣言・命題・結果の値は変えない（第2弾 A の表はそのまま残し、打撃を足した表を別に出す）。
#
# ==== A. 2026年のチーム打撃を足して、K32 を照らし直す ====
#
# データ: references/season-2026-central-summary.jsonl（2026-10-15 に公式ページから転記・確認された、セ・リーグ 6 球団の年成績。
#         bat_obp・bat_iso・bat_d_obp・bat_d_iso と、その元の数）。第2弾 A の 2026年の表で空だった列のうち、
#         このファイルにある列だけを、同じ球団・同じ年の行に入れる。パ・リーグの 6 球団は空のまま（判定不能）。
#         このファイルに無い列（四死球の割合・故意四球・走者あたりの得点・イニング）は作らない。
#         入れる前に、このファイルの G・W・L・T・RF・RA・順位・A/B が、2026年の表の同じ球団の値と一致することを確かめる（合わなければ入れない）。
# 仕組みと読み方: 第2弾 A と同じ（confirm_units。学習データの率で、判例がその数以上になる確率が 0.05 未満なら
#         「学習データほどは成り立っていない」）。読み方は第2弾の宣言のまま変えない。
# 見たもの（この宣言を書く前）: **このファイルの 6 球団の bat_d_obp と bat_d_iso の値を見た。**
#         ファイルを探して開いた時点で見えたので、K32・K31 のセ・リーグでの結果は、宣言の前に分かっていた。
#         K32・K31 の定義は見る前の刻印（14:36）で、読み方は第2弾の刻印（16:12）で固定済み。
# 予想（見た値から決まる。判定には使わない）:
#   (A1) K32: 成立 2（広島・ヤクルト）・判例 0・逆の判例 2（巨人・中日）・どちらも当たらない 2・判定不能 6。読みは「学習データと矛盾しない」。
#   (A2) K31（記録のみ）: 成立 2・判例 0・逆の判例 1（巨人）・どちらも当たらない 3・判定不能 6。
#
# ==== B. 8 回までの得点で作り直した列で、P85 を問い直す ====
#
# 列: wl_rf_win_gap8 = 第3弾の「8 回まで」の表から、同じ sakanalytics.win_loss_split で作った「勝ち試合の得点 − 見込み」。
#     第3弾で、元の列（wl_rf_win_gap）は見込みの作り方で片側に寄る（144 中 133 が負）が、この作り方では寄らない（144 中 71）と分かった。
#     範囲は、試合の記録がある 2013〜2025年（2020年は除外）。
# 命題: 下の 3 つ。E85 は親 P85 と同じ形（中日なら）、KE85 は第1弾の形（B クラスなら。中日以外で読む）、
#       DE85 は第2弾 B の形（B クラスの中で、中日なら。差は fisher_p で読む）。強さは親のまま（概ね）。
# 読み方: 第1弾（KE85 の読み 1〜5）・第2弾 B（DE85 の fisher_p < 0.05）と同じ。新しい読み方は作らない。
# 見たもの: 第3弾の集計（8 回までで負の単位は 144 中 71、差の中央値 +0.001）。球団ごと・年ごとの値は見ていない。
# 予想:
#   (B1) E85: 中日の 12 単位のうち、負は 4〜8。元の命題の終了コードは 0・1（支持）にならない。
#   (B2) DE85: fisher_p は 0.05 以上（B クラスの中で、中日が特に多いとは言えない）。
#   (B3) KE85: 読みは 1（種類の性質）にならない。
#
# ==== C. 第3弾で消えた片寄りを、延長と 9 回の終わり方に分ける ====
#
# 確かめ方: 第3弾と同じ win_loss_split に、もう 1 つ表を渡す。
#   「9 回まで」= 延長に入った試合だけ、9 回終了時の得点に替える（同点なので勝ち負けなしになる）。9 回以内に終わった試合はそのまま。
#   そのまま → 9 回まで の変化が延長の分、9 回まで → 8 回まで の変化が 9 回の終わり方（9 回裏が無い・サヨナラ）の分。
#   試合の終わり方の件数（9 回裏なし・9 回のサヨナラ・延長・そのほか）も数える。
# 読み方（先に決める。仮の線）: 「9 回まで」で負の単位が 80 % 以上なら「主に 9 回の終わり方」、65 % 以下なら「主に延長」、その間は「両方」。
# 弱い点（先に書く）: 9 回裏が無いこととサヨナラは、この方法では分けられない（打ち切られなかった場合の得点が無い）。件数だけ分けて出す。
# 見たもの: 第3弾の 4 つの表の集計。「9 回まで」の値と、終わり方の件数は見ていない。
# 予想: (C1) 「9 回まで」で負の単位は 80 % 以上。(C2) 「9 回まで」の差の中央値は −0.25〜−0.10 点。
#
# ==== 走らせないこと ====
#   強さ・線・範囲を結果を見てから変えること。sakanalytics の列の作り方の変更。正本の outputs/ の書き換え。
#   このファイルに無い 2026年の打撃の列を、元の数から自分で作ること。思いついたことは README の未検討に書くだけ。

