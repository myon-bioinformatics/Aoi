# サイクル3の命題・第16弾（事前登録）。形式と判定規則は docs/propositions.md。第1弾〜第15弾のファイルは変更しない。
#
# 主題: エンジン本体の丸め方 carry64 を、ポンプが出ている槽と、開き具合が動く弁（浮きで動く弁）にも広げる。
#
# 記録: 2026-11-13 13:22 JST（時刻の道具の値）に書いた。このとき第16弾の単位（eng2 の組）・列・エンジンの変更はまだ作っていない。
#   書く前に見ていたもの: 第1弾〜第15弾の結果すべて（carry64 は、弁だけ・開き具合が一定の槽で、60 桁の値から 1.4 目盛り以内だった）。
#   エンジンに入れる形（これから FluidFullSpeedSimulation に作る。作る前に決めたこと）:
#     ポンプが出ている槽: 弁の合計は (V + P/L)·Φ − P = V·Φ − P·(1 − Φ/L)（P = そのステップのポンプの量）。
#       P·(1 − Φ/L) の掛け算も 2^-64 刻みの係数と繰り越しで出す（掛け算の場所が 1 つ増える）。
#       入る量があるときは V·Φ + (I − P)·(1 − Φ/L) まで増やす（今の q48 と同じ式）。0 より小さければ 0、増やす分は I まで。
#     開き具合が動く弁: L = Σ 開き具合·dt/τ をステップごとに、そのステップの開き具合（2^-48 刻みの整数）から分数で出し直す。
#       開き具合そのものの刻み（カムの出す値が 2^-48 刻み）は直さない。同じ開き具合の並びを 60 桁の計算にも渡して比べる。
#   紙の上の見込み: 掛け算の場所が増えても、残りは 1 か所につき 1 目盛り未満で積もらない。だから第15弾と同じく数目盛り以内。
#     q48 は、量が大きいと係数の丸め、小さいと切り捨てが積もり、8 目盛りより大きくずれる。
#   単位の組を決めるために計算したもの: ポンプの量が 2^-48 刻みでちょうど表せるように、ポンプの速さを V0/(8τ)・V0/(16τ) にした（式だけ）。
#     槽が空にならない（ポンプが足りなくならない）ことを、厳密な式で確かめた（mixed は t = τ で残り 0.21·V0 以上）。
#   境の値（8 目盛り）は第15弾と同じ仮置きで、結果に合わせて動かさない。
#
# 第16弾で足す単位（前の弾の命題の範囲には入らない組）: eng2。エンジン本体（uniform・槽ごとに厳密）を rounding = q48 と carry64 で進める。
#   mixed   = 槽 A（最初に V0）から弁とポンプが出る。測るのは A。弁 1 本 + ポンプ V0/(8τ)、弁 2 本（割合 3/5・2/5）+ ポンプ V0/(4τ)。t = 0.5τ・τ
#   midpump = A（V0）→ B（最初に V0/2）→ C → 受け。B からはポンプ（V0/(16τ)）も出る。測るのは C。(τB/τ, τC/τ) = (2, 3/4)・(2/5, 3/2)。t = 1.5τ・3τ
#   sched   = A（V0）→ B → 受け。A の弁の開き具合が時刻とともに 1 → 1/4 へ直線で下がる（一定の速さでたまる槽の水位をカムで読む）。
#             測るのは B。τB/τ = 3/5・2。t = 1.5τ・3τ
#   どれも刻み 1/128・1/512、V0 = 128・2^-12。比べる相手は、同じ式を 60 桁の小数で進めた値（sched はエンジンと同じ開き具合の並びを使う）。
# 第16弾で足す列: eng2 = 組。carry64・round_ulps・is_best_round は第15弾と同じ作り方

[[proposition]]
id = "O119"
statement = "エンジン本体で、ポンプが出ている槽や開き具合が動く弁があっても、carry64 にすると丸めのずれは q48 より小さい"
strength = "always"
parent = "O112"
change = "弁だけ・開き具合が一定の槽を、ポンプが出ている槽と、開き具合が動く弁に替えた"
scope = { where = [{ col = "eng2", op = "==", value = true }] }
if = [{ col = "carry64", op = "==", value = true }]
then = [{ col = "is_best_round", op = "==", value = true }]
surprise = "round_ulps"
context = ["h", "v0", "steps", "shape", "pipe_set", "span_ratio"]
falsifier = "q48 のほうが小さい単位があれば、その形と何目盛りの差かを書く"

[[proposition]]
id = "O120"
statement = "エンジン本体で、ポンプが出ている槽や開き具合が動く弁があっても、carry64 なら測る槽の量は 60 桁の小数で進めた値から 8 目盛り以内である（q48 は 8 目盛りより大きくずれる）"
strength = "always"
parent = "O113"
change = "O119 と同じ"
scope = { where = [{ col = "eng2", op = "==", value = true }] }
if = [{ col = "carry64", op = "==", value = true }]
then = [{ col = "round_ulps", op = "<=", value = 8.0 }]
surprise = "round_ulps"
context = ["h", "v0", "steps", "shape", "pipe_set", "span_ratio"]
falsifier = "carry64 で 8 目盛りを超える単位、または q48 で 8 目盛り以内の単位があれば、その形を書く"
