[project]
name = "aoi"
version = "0.1.0"
description = "Observe. Measure. Question."
requires-python = ">=3.11"
dependencies = [
    "polars>=2",
    "httpx>=0.28",
    "selectolax>=1",
    # 2.4 系は Python 3.11–3.14、2.5.2 以降は 3.12–3.15（3.15 の wheel は 2.5.2 から）。
    "numpy>=2.4; python_version < '3.12'",
    "numpy>=2.5.2; python_version >= '3.12'",
    # 図はブラウザの plotly.js。Python plotly は置かない。matplotlib / seaborn / statsmodels も置かない。
    # ページの文章。実行時の依存はこのパッケージだけで、3.11–3.15。
    "markdown>=3.7",
]

[dependency-groups]
dev = ["pytest>=8", "coverage>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# サブプロジェクトはそれぞれ単独のディレクトリ。将来の分離に備え、互いをパッケージにしない
pythonpath = [".", "blueprobe", "queryu", "queryu/ask", "sakanalytics", "pythdragoras", "nagoyaction", "nagoyaction/inbox", "dragowing"]
testpaths = ["tests", "blueprobe/tests", "queryu/tests", "sakanalytics/tests", "pythdragoras/tests", "nagoyaction/tests", "dragowing/tests"]
