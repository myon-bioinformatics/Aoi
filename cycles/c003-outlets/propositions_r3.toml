# サイクル3の命題・第3弾（事前登録）。形式と判定規則は docs/propositions.md。第1弾・第2弾のファイルは変更しない。
#
# 主題: 槽と槽のあいだのずれ（上の槽やポンプから入る量を、同じステップの中で知らない）と、エンジンに入った直し方の追試。
#
# 記録: 2026-11-12 17:45 JST に書いた。このとき第3弾の単位（native・chain2・fed の組）と列はまだ作っていない。
#   書く前に見ていたもの:
#     第1弾・第2弾の結果すべて。とくに O23 の判例（2 段目のずれが t ≈ 2τ で dt/(2·τ2) ほど。τ2/τ = 1/4・1/2・3/4・2・4）。
#     FluidFullSpeedSimulation の E29（エンジンの既定 outlets="exact" で、1〜8 本・偏った 3 本・弁 2 本 + ポンプの差が 7e-12 以下）。
#       O26 はこれを知ったうえで書いた追試（Aoi の単位の組で確かめ直す）。
#   見ていないもの: 2 段の槽の別の τ2・別の時刻、ポンプから入る槽、入る量の扱いを変える 2 つの方式（uniform・through）の結果。
#   O27 は第2弾の判例を見て作った命題なので、第2弾と別の単位（chain2: τ2 も時刻も別）だけで確かめる。
#     紙の上の説明: 入った量はステップの終わりに足され、そのステップのあいだ減らない。平均して半ステップぶん減りそこねるので、
#     2 段目は e^(dt/(2·τ2)) 倍ほど多くなる。この説明が正しければ、ずれは時刻にも 1 段目の速さにもよらない。
#   境の値（1e-9・5 %・h ≤ 1/32・10 倍・3.8〜4.2）は人が決めた仮置きで、結果に合わせて動かさない。
#
# 第3弾で足す単位（第1弾・第2弾の命題の範囲には入らない組）:
#   native = エンジンの既定（outlets="exact"。FluidFullSpeedSimulation の main、PR #16 の後）で、
#            弁だけ 2・3・4・8・16 本（等分／偏り）、弁 1・2・4 本 + ポンプ（第1弾 mixed と同じ条件）、
#            弁 1・2・4 本 + 弱いポンプ（第2弾 gentle と同じ条件）を進める
#   chain2 = 槽 A（弁 1 本、τ）→ 槽 B（弁 1 本、τ2）→ 受け。τ2/τ = 1/3・3/2・3・8、測る時刻 t ≈ τ と 3τ。槽 B の量を Bateman の式と比べる
#   fed    = ポンプ（一定の速さ）→ 槽 B（弁 1 本、τ2）→ 受け。τ2/τ = 1/4・1・4、t ≈ 2τ。槽 B の量を q·τ2·(1 − e^(−t/τ2)) と比べる
# 方式（chain2・fed）:
#   independent = 今のエンジン（弁はステップ最初の量だけを見る。出口が 1 本なので outlets の切り替えでは変わらない）
#   uniform     = 入ってくる量 I が 1 ステップのあいだ一定の速さで入ると見なす: 出る量 = B·(1 − e^(−x)) + I·(1 − (1 − e^(−x))/x)、x = dt/τ2
#   through     = 2 段を 1 ステップぶん厳密に解く: 槽 B の新しい量 = B·e^(−k2·dt) + A·k1/(k2 − k1)·(e^(−k1·dt) − e^(−k2·dt))（chain2 だけ）
#   uniform・through はエンジンに無い（出る量がステップ最初の量を超えうるので、法則を足すだけでは入らない）。
#   単位を作るスクリプトが、エンジンと同じ固定小数点（Q48、床）の整数で漸化式を進める。検算は float の別実装。
# 第3弾で足す列:
#   chain_pred_rel      = |err − dt/(2·τ2)| / (dt/(2·τ2))（chain2 の independent）
#   fed_gap             = |err − (x/(1 − e^(−x)) − 1)|、x = dt/τ2（fed の independent）
#   gain_vs_independent = |同じ条件の independent の err| / |この単位の err|（uniform。分母が 0 のときは ε = 1e-15 に置き、ログに残す）
#   uniform_halving・has_half = err / 同じ組で刻みが半分の単位の err と、その単位があるか（chain2 の uniform）
#   span_ratio          = 測る時刻 / τ

# ---- エンジンに入った直し方の追試 ----

[[proposition]]
id = "O26"
statement = "エンジンの既定の取り方（槽ごとに 1 ステップを厳密に解く）なら、弁だけの槽も、弁とポンプが混ざる槽も、残りは厳密である"
strength = "always"
scope = { where = [{ col = "native", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "n", "equal_split", "team"]
falsifier = "ずれる単位があれば、エンジンへの入れ方が affine（O11・O22）と違っていると書き、エンジンを見直す"
note = "O9・O11・O22 は単位を作るスクリプトが足した法則で確かめた。これはエンジン本体に入った実装を同じ条件で確かめ直す"

# ---- 槽と槽のあいだのずれ ----

[[proposition]]
id = "O27"
statement = "槽が 2 段つながるとき、刻みが時定数の 1/32 以下なら、2 段目のずれは dt/(2·τ2) と 5 % 以内で合う（1 段目の速さにも時刻にもよらない）"
strength = "always"
scope = { where = [{ col = "chain2", op = "==", value = true }, { col = "independent", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "chain_pred_rel", op = "<=", value = 0.05 }]
surprise = "chain_pred_rel"
context = ["h", "tau2_ratio", "span_ratio", "err"]
falsifier = "外れる単位があれば、半ステップぶん減りそこねるという説明は足りない（時刻か 1 段目の速さが効く）と書く"
note = "O23 の判例（t ≈ 2τ、τ2/τ = 1/4〜4）を見て作った命題。別の τ2 と別の時刻の単位だけで確かめる"

[[proposition]]
id = "O28"
statement = "ポンプから入って弁 1 本から出る槽は、今のエンジンで厳密である"
strength = "always"
scope = { where = [{ col = "fed", op = "==", value = true }, { col = "independent", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "err"]
falsifier = "ずれる単位があれば、槽と槽のあいだのずれは上が弁でもポンプでも起きると書く"
note = "破れると見込んで書いている"

[[proposition]]
id = "O29"
statement = "ポンプから入って弁 1 本から出る槽のずれは、閉じた式 x/(1 − e^(−x)) − 1（x = dt/τ2）と一致する"
strength = "always"
scope = { where = [{ col = "fed", op = "==", value = true }, { col = "independent", op = "==", value = true }] }
if = []
then = [{ col = "fed_gap", op = "<", value = 1e-9 }]
surprise = "fed_gap"
context = ["h", "tau2_ratio", "err"]
falsifier = "合わない単位があれば、1 ステップの取り方の説明（入った量はステップの終わりに足される）を見直す"
note = "紙の上で導いた式。時刻によらない（どの時刻でも同じ割合だけ多い）"

# ---- 入る量の扱いを変える方式 ----

[[proposition]]
id = "O30"
statement = "ポンプから入る槽は、入る量が一定の速さで入ると見なす方式（uniform）なら厳密である"
strength = "always"
scope = { where = [{ col = "fed", op = "==", value = true }, { col = "uniform", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "err"]
falsifier = "ずれる単位があれば、uniform の式を見直す"

[[proposition]]
id = "O31"
statement = "槽が 2 段つながるときも、uniform なら 2 段目は厳密である"
strength = "always"
scope = { where = [{ col = "chain2", op = "==", value = true }, { col = "uniform", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "span_ratio", "err"]
falsifier = "ずれる単位があれば、上の槽から入る量は 1 ステップのあいだ一定ではない（減りながら入る）と書く"
note = "破れると見込んで書いている"

[[proposition]]
id = "O32"
statement = "槽が 2 段つながるとき、刻みが時定数の 1/32 以下なら、uniform は今のエンジンよりずれを 1/10 以下にする"
strength = "always"
scope = { where = [{ col = "chain2", op = "==", value = true }, { col = "uniform", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "gain_vs_independent", op = ">=", value = 10 }]
surprise = "gain_vs_independent"
context = ["h", "tau2_ratio", "span_ratio", "err"]
falsifier = "1/10 にならない単位があれば、uniform は槽と槽のあいだのずれの直し方として弱いと書く"

[[proposition]]
id = "O33"
statement = "槽が 2 段つながるとき、刻みが時定数の 1/32 以下なら、uniform のずれは刻みを半分にすると 1/4 になる（比 3.8〜4.2）"
strength = "always"
scope = { where = [{ col = "chain2", op = "==", value = true }, { col = "uniform", op = "==", value = true }, { col = "has_half", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "uniform_halving", op = ">=", value = 3.8 }, { col = "uniform_halving", op = "<=", value = 4.2 }]
surprise = "uniform_halving"
context = ["h", "tau2_ratio", "span_ratio", "err"]
falsifier = "比が外れる単位があれば、uniform の残りのずれは 2 次ではないと書く"

[[proposition]]
id = "O34"
statement = "槽が 2 段つながるとき、2 段を 1 ステップぶん厳密に解く方式（through）なら 2 段目は厳密である"
strength = "always"
scope = { where = [{ col = "chain2", op = "==", value = true }, { col = "through", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
surprise = "err"
context = ["h", "tau2_ratio", "span_ratio", "err"]
falsifier = "ずれる単位があれば、2 段の閉じた式の入れ方を見直す"
note = "through は上の槽の量と速さを知っている前提の式で、上がポンプや何本もの管のときにはそのまま使えない"
