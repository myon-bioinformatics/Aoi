[project]
name = "dragowing"
version = "0.1.0"
description = "記録を、判定をやり直さずに置く（Aoi の dragowing/ から独立）"
requires-python = ">=3.11"
dependencies = [
    "polars>=2",
    # Aoi と同じ指定。2.4 系は Python 3.11–3.14、2.5.2 以降は 3.12–3.15。
    "numpy>=2.4,<2.5; python_version < '3.12'",
    "numpy>=2.5.2; python_version >= '3.12'",
    # ページの文章。実行時の依存はこのパッケージだけで、3.11–3.15。matplotlib は入れない。
    "markdown>=3.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# サイクルデータ、PythDRagoras（propositions, rule_search）、QueRyu（ask）は Aoi に残す。AOI_ROOT と PYTHONPATH で固定 SHA の Aoi を指す（.github/workflows/ci.yml）
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".test-deps", "build", "reports"]
