# 分析設定。除外・注目チームなど「解釈の判断」はすべてここに書き、結果にも記録される。

[focus]
team = "d"
league = "C"   # 順位の検定はセ・リーグの6球団で比べる（交流戦の試合は成績に含む）

[[exclude]]
season = 2020
reason = "120試合の短縮シーズン（開幕延期）で、セ・リーグはCSを実施していない。他の年と同じ条件の順位とみなせるか判断を保留する（人の判断による除外）"

[teams]
g  = { name = "巨人", league = "C" }
s  = { name = "ヤクルト", league = "C" }
db = { name = "DeNA", league = "C" }
d  = { name = "中日", league = "C" }
t  = { name = "阪神", league = "C" }
c  = { name = "広島", league = "C" }
h  = { name = "ソフトバンク", league = "P" }
f  = { name = "日本ハム", league = "P" }
b  = { name = "オリックス", league = "P" }
e  = { name = "楽天", league = "P" }
l  = { name = "西武", league = "P" }
m  = { name = "ロッテ", league = "P" }

# まだ使っていない年での確かめ（R18、research/R18-confirmation-2026.md）。命題を作るのに使っていない年の単位だけを、
# 命題ごとに4つの欄（成立・判例・逆の判例・どちらも当たらない）に分けて outputs/confirmation.md に並べる。
# 年をデータに入れるのは、その年の公式戦が全球団で終わってから（pipeline.toml の years）。
[confirm]
seasons = [2026]
registered = "2026-10-04"
detail = ["P52", "P50", "P64", "P62", "P78", "P76", "P80", "P79", "P51"]
