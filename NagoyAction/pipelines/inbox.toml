name = "research-inbox"
root = "../.."

[requires]
python = "3.11"
tools = ["git"]
optional = ["docker"]

[[step]]
name = "model"
run = ["python", "NagoyAction/containers/llama.py", "prepare"]
when_env = "AOI_USE_LOCAL_LLM"
network = true
outputs = [".models/model.gguf", ".models/identity.json"]

[[step]]
name = "llama-start"
run = ["docker", "compose", "-p", "aoi-inbox", "-f", "NagoyAction/containers/llama.compose.yml", "up", "--detach"]
when_env = "AOI_USE_LOCAL_LLM"
network = true

[[step]]
name = "llama-ready"
run = ["python", "NagoyAction/containers/llama.py", "wait"]
when_env = "AOI_USE_LOCAL_LLM"
network = true

[[step]]
name = "intake"
always = true
run = ["python", "NagoyAction/inbox/inbox.py", "intake"]
network = true

[[step]]
name = "llama-stop"
run = ["docker", "compose", "-p", "aoi-inbox", "-f", "NagoyAction/containers/llama.compose.yml", "down"]
when_env = "AOI_USE_LOCAL_LLM"
always = true
