name: DRAgoWing reports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      markdown-ref:
        description: 'markdown upstream ref (main for latest; past-pattern snapshot SHA for replay)'
        # past-pattern snapshot of markdown, fetched by SHA for verification test data
        default: aa5bccfcaf11f17473c7f1ff502509dfa1547660
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dragowing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Markdown once for this build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/markdown
          # past-pattern snapshot of markdown, fetched by SHA for verification test data
          ref: ${{ inputs.markdown-ref || 'aa5bccfcaf11f17473c7f1ff502509dfa1547660' }}
          path: .deps/markdown
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Build current reports and previous-version comparison
        env:
          PREVIOUS_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python -S dragowing/reports/build_reports.py
          --markdown-root .deps/markdown
          --output build/dragowing
          --previous-ref "$PREVIOUS_REF"
      - name: Preserve report and exact renderer snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dragowing-reports
          path: build/dragowing
          if-no-files-found: error
          retention-days: 14
