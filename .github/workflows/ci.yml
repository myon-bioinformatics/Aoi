name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      aoi_ref:
        description: "Aoi ref to checkout. Empty resolves latest main."
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  resolve-aoi:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve Aoi main
        id: resolve
        env:
          AOI_REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aoi_ref || '' }}
          AOI_REPOSITORY_ID: "1402862784"
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          export GCM_INTERACTIVE=never
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes"

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = "myon-bioinformatics/Aoi"
          expected = int(os.environ["AOI_REPOSITORY_ID"])
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "nagoyaction-ci"}
          if token:
              headers["Authorization"] = "Bearer " + token
          req = urllib.request.Request("https://api.github.com/repos/" + repo, headers=headers)
          with urllib.request.urlopen(req, timeout=60) as resp:
              data = json.load(resp)
          full_name = str(data.get("full_name", "")).lower()
          if data.get("id") != expected or full_name != repo.lower():
              raise SystemExit("Aoi repository id mismatch")
          if data.get("visibility") not in (None, "public") or data.get("private") is True:
              raise SystemExit("Aoi repository is not public")
          PY

          how="refs/heads/main"
          if [[ -n "$AOI_REF_INPUT" ]]; then
            if [[ "$AOI_REF_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]; then
              sha=$(printf '%s' "$AOI_REF_INPUT" | tr '[:upper:]' '[:lower:]')
              how="workflow_dispatch input"
            elif [[ "$AOI_REF_INPUT" =~ ^refs/heads/[A-Za-z0-9._/-]+$ ]]; then
              listing=$(git ls-remote https://github.com/myon-bioinformatics/Aoi "$AOI_REF_INPUT")
              sha=$(printf '%s\n' "$listing" | awk -v ref="$AOI_REF_INPUT" '$2 == ref { print $1; exit }')
              how="$AOI_REF_INPUT"
            elif [[ "$AOI_REF_INPUT" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              refspec="refs/heads/$AOI_REF_INPUT"
              listing=$(git ls-remote https://github.com/myon-bioinformatics/Aoi "$refspec")
              sha=$(printf '%s\n' "$listing" | awk -v ref="$refspec" '$2 == ref { print $1; exit }')
              how="$refspec"
            else
              echo "invalid aoi_ref" >&2
              exit 1
            fi
          else
            listing=$(git ls-remote https://github.com/myon-bioinformatics/Aoi refs/heads/main)
            sha=$(printf '%s\n' "$listing" | awk '$2 == "refs/heads/main" { print $1; exit }')
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve Aoi SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Source-commit provenance is recorded here. A later checkout mismatch is
          # report-only on pull_request and strict on push to main and schedule.
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            mode="strict"
          else
            mode="report-only"
          fi
          {
            echo "## Aoi source"
            echo "Resolved \`$sha\` from \`$how\`."
            echo "Repository id \`$AOI_REPOSITORY_ID\`."
            echo "Source-hash provenance: $mode."
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [changes, resolve-aoi]
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Aoi の CI と同じ。failure-identity の expected-reports と揃えること
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ needs.resolve-aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Source checkout provenance
        env:
          EXPECTED_SHA: ${{ needs.resolve-aoi.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved Aoi SHA missing" >&2
            exit 1
          fi
          actual=$(git -C .test-deps/aoi rev-parse HEAD)
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Aoi checkout $actual does not match resolved $EXPECTED_SHA" >&2
            if [[ "$strict" == "1" ]]; then
              exit 1
            fi
            echo "::warning::Aoi checkout does not match the resolved source commit (report-only for this event)"
          fi
      - name: Replace Aoi nagoyaction/ with this repository's tree
        run: |
          rm -rf .test-deps/aoi/nagoyaction
          mkdir .test-deps/aoi/nagoyaction
          git archive HEAD | tar -x -C .test-deps/aoi/nagoyaction
          # リンク確認のテストは git に登録したファイルで照合するので、置き換えた tree を index に載せる
          git -C .test-deps/aoi add -A nagoyaction
          test "$(git -C .test-deps/aoi write-tree --prefix=nagoyaction/)" = "$(git rev-parse 'HEAD^{tree}')"
      - run: python -m compileall -q -x '\.test-deps' .
      - name: Test with JUnit
        working-directory: .test-deps/aoi
        run: uv run --locked --python "${{ matrix.python }}" pytest -q -c pyproject.toml nagoyaction/tests --junitxml="$GITHUB_WORKSPACE/reports/junit.xml"
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: NagoyAction is stdlib-only and the cycle pipeline is runnable
        working-directory: .test-deps/aoi
        run: |
          python -S nagoyaction/nagoyaction.py doctor cycles/c001-chunichi/pipeline.toml
          python -S nagoyaction/nagoyaction.py run cycles/c001-chunichi/pipeline.toml --dry-run

  # 1 ジョブの中で、本物の polars で research_digest.collect のバイト列を取り、
  # polars と polars-runtime-32 を外してから polars_min で同じ collect を動かし、cmp する。
  polars-min:
    name: collect (real polars, then polars uninstalled)
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AOI_SHA: c0d4f64d27bb3a43f893df09e56effc381997f13
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ env.AOI_SHA }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Verify pinned checkout
        run: test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - name: Replace Aoi nagoyaction/ with this repository's tree
        run: |
          rm -rf .test-deps/aoi/nagoyaction
          mkdir .test-deps/aoi/nagoyaction
          git archive HEAD | tar -x -C .test-deps/aoi/nagoyaction
          git -C .test-deps/aoi add -A nagoyaction
          test "$(git -C .test-deps/aoi write-tree --prefix=nagoyaction/)" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Equivalence, AST, proxy trace, absent-polars tracebacks, then record real collect
        working-directory: .test-deps/aoi
        run: |
          uv sync --locked --python 3.12
          uv run --locked --python 3.12 pytest -q -c pyproject.toml nagoyaction/tests/test_polars_min.py
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py survey
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py analyze
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py generate --out nagoyaction/shrink/polars_min.py --check
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py trace
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py absent
          uv run --locked --python 3.12 python nagoyaction/shrink/run_collect.py --deps real "$GITHUB_WORKSPACE/reference.json"
      - name: Reinstall locked runtime deps except polars and its compiled runtime
        working-directory: .test-deps/aoi
        run: uv sync --locked --no-dev --no-install-package polars --no-install-package polars-runtime-32 --python 3.12
      - name: polars is not installed
        working-directory: .test-deps/aoi
        run: |
          if .venv/bin/python -c 'import polars'; then
            echo "polars is still importable" >&2
            exit 1
          fi
      - name: Same collect on polars_min
        working-directory: .test-deps/aoi
        run: .venv/bin/python nagoyaction/shrink/run_collect.py --deps min "$GITHUB_WORKSPACE/minimal.json"
      - name: Byte-identical to the real polars collect result
        run: cmp "$GITHUB_WORKSPACE/reference.json" "$GITHUB_WORKSPACE/minimal.json"

  failure-identity:
    needs: [changes, test]
    if: (always()) && (needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
