# 命題の集合（R48）。登録済みの命題の条件だけから集合を作り、式を計算の前に書く。
#   uv run python pythdragoras/sets.py --season cycles/c001-chunichi/outputs/season.jsonl --config cycles/c001-chunichi/analysis.toml \
#     --propositions cycles/c001-chunichi/propositions.toml --sets cycles/c001-chunichi/sets.toml --outdir cycles/c001-chunichi/outputs --report-only
# 集合は全単位（2012〜2025年、2020年は除外）の上で作る。命題の範囲（seasons・team）は使わない。

[[set]]
id = "OFF_SHORT"        # 得点の優位が誤差を超えてマイナス
from = "P147"

[[set]]
id = "DEF_WORSE"        # 失点の優位が誤差を超えてマイナス
from = "P148"

[[set]]
id = "OFF_SHORT_DEF_CLEAR"   # 得点 −1 かつ 失点 +1（R35〜R36 の形）
from = "P140"
part = "where"

[[set]]
id = "TOP_WIN"          # 上の相手（1・2位）との勝率 .47 以上
from = "P144"

[[set]]
id = "LOWER_FAIL"       # 下の相手（4〜6位）に .500 未満
from = "P146"

[[set]]
id = "BIG_SHORT"        # 得点の不足が1試合 0.6点を超える
from = "P138"

[[set]]
id = "PERSIST_LOW"      # 得点した回の大きさが2年以上続けて下位2位以内（式2）
from = "P62"

[[set]]
id = "F52"              # 式1: 分布の見込み < 0.4 または 組み合わせ方 < −1
from = "P52"

[[set]]
id = "F96"              # 式1′
from = "P96"

# ---- 式（どれも「式に入るなら B クラス」。強さは 概ね） ----

[[expr]]
id = "E1"
expr = "OFF_SHORT & ~TOP_WIN"
statement = "得点がはっきり足りず、上の相手に .47 未満なら B"

[[expr]]
id = "E2"
expr = "OFF_SHORT & ~OFF_SHORT_DEF_CLEAR"
statement = "得点がはっきり足りず、失点がはっきり上回ってはいないなら B"

[[expr]]
id = "E3"
expr = "BIG_SHORT | (OFF_SHORT & ~OFF_SHORT_DEF_CLEAR)"
statement = "得点の不足が大きいか、得点がはっきり足りず失点がはっきり上回ってはいないなら B"

[[expr]]
id = "E4"
expr = "F52"
statement = "式1（P52）をそのまま集合として"

[[expr]]
id = "E5"
expr = "F96"
statement = "式1′（P96）をそのまま集合として"

[[expr]]
id = "E6"
expr = "PERSIST_LOW | (OFF_SHORT & ~TOP_WIN)"
statement = "得点した回の大きさが続けて低いか、得点がはっきり足りず上の相手に .47 未満なら B"

[[expr]]
id = "E7"
expr = "F96 | (OFF_SHORT & ~TOP_WIN)"
statement = "式1′か、得点がはっきり足りず上の相手に .47 未満なら B"

[[expr]]
id = "E8"
expr = "DEF_WORSE & ~TOP_WIN"
statement = "失点がはっきり劣り、上の相手に .47 未満なら B（E1 の鏡、中日を覆うことは求めない）"

[[expr]]
id = "E9"
expr = "(OFF_SHORT | DEF_WORSE) & ~TOP_WIN & ~(OFF_SHORT_DEF_CLEAR)"
statement = "得点か失点がはっきり劣り、上の相手に .47 未満で、得点 −1・失点 +1 の形ではないなら B"

# ---- 追加: 2026-10-05、R49。阪神 2015年をきっかけにした命題の前件を集合にし、E6・E7 から除く式を計算の前に書く ----

[[set]]
id = "CONVERT_BIG"      # 点の差より5勝以上多く勝った（P177）
from = "P177"

[[set]]
id = "ALLOC_GOOD"       # 組み合わせ方 ≥ 1（P178）
from = "P178"

[[set]]
id = "MID_CONVERT"      # 中位の相手から点の差より3勝以上多く勝った（P179）
from = "P179"

[[expr]]
id = "E10"
expr = "(PERSIST_LOW | (OFF_SHORT & ~TOP_WIN)) & ~CONVERT_BIG"
statement = "E6 から、点の差より5勝以上多く勝った単位を除く"

[[expr]]
id = "E11"
expr = "(F96 | (OFF_SHORT & ~TOP_WIN)) & ~CONVERT_BIG"
statement = "E7 から、点の差より5勝以上多く勝った単位を除く"

[[expr]]
id = "E12"
expr = "(PERSIST_LOW | (OFF_SHORT & ~TOP_WIN)) & ~ALLOC_GOOD"
statement = "E6 から、組み合わせ方 ≥ 1 の単位を除く"

[[expr]]
id = "E13"
expr = "(F96 | (OFF_SHORT & ~TOP_WIN)) & ~ALLOC_GOOD"
statement = "E7 から、組み合わせ方 ≥ 1 の単位を除く"

[[expr]]
id = "E14"
expr = "(PERSIST_LOW | (OFF_SHORT & ~TOP_WIN)) & ~MID_CONVERT"
statement = "E6 から、中位の相手から3勝以上多く勝った単位を除く"

[[expr]]
id = "E15"
expr = "(F96 | (OFF_SHORT & ~TOP_WIN)) & ~MID_CONVERT"
statement = "E7 から、中位の相手から3勝以上多く勝った単位を除く"

# 追加: 2026-10-05。R55 の種1。中日の B の2つの道（計算前に書いた式。P186・P187 の判定はまだ Actions で見ていない）
[[set]]
id = "SHORT_T"          # 収支の不足が誤差を超える（P186）
from = "P186"

[[set]]
id = "UNDER"            # 点の差より負けた（P187）
from = "P187"

[[expr]]
id = "E16"
expr = "SHORT_T | UNDER"
statement = "不足が誤差を超えるか、点の差より負けたか（中日の B の2つの道）。後半は A にも多いので、判例の形を見る式"

[[expr]]
id = "E17"
expr = "SHORT_T | (UNDER & ~ALLOC_GOOD)"
statement = "E16 の後半から、組み合わせ方 ≥ 1 の単位を除く（点の差より負けても組み合わせ方がよい単位を外す）"
