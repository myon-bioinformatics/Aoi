name: Shared Python launcher

on:
  pull_request:
    paths:
      - "vendor/py_launch.cjs"
      - "vendor.lock.json"
      - "shared-tools.lock.json"
      - "tests/py_launch.test.cjs"
      - ".github/workflows/py-launch-tests.yml"
  push:
    branches: [main]
    paths:
      - "vendor/py_launch.cjs"
      - "vendor.lock.json"
      - "shared-tools.lock.json"
      - "tests/py_launch.test.cjs"
      - ".github/workflows/py-launch-tests.yml"

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher regressions (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: node --test tests/py_launch.test.cjs
      - run: python -S scripts/check_shared_tools_lock.py
