# R21: 式1（P52）が取りこぼした 2014年も含めて B クラスを言い当てる式の候補（research/R21-formula-with-2014.md）
# 記録: 2026-10-04。探索を実行する前に書いた。R11 の候補（rule_candidates.toml、17個）はそのまま残し、
# 2014年の道筋（R17: 強い相手との試合で点の差どおりに勝てていない、opp_conv_top）の3個を足して、「または」を3つまでにした。
# opp_conv_top は R17 の表で、2014年の道筋のグループ8単位の値を見ている（中日 2014 は −2.57）。

target = [{ col = "upper_half", op = "==", value = false }]
max_terms = 3   # 「または」でつなぐ組の数の上限（R11 は 2）
max_conds = 2   # 1つの組の中の「かつ」の数の上限

