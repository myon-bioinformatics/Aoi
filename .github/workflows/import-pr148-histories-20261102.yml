name: One-time fixed PR148 child history import
on:
  push:
    branches: [ops/import-pr148-histories-20261102]
    paths: [.github/workflows/import-pr148-histories-20261102.yml]
permissions: {}
concurrency:
  group: one-time-pr148-history-import-20261102
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.repository == 'myon-bioinformatics/Aoi' &&
      github.ref == 'refs/heads/ops/import-pr148-histories-20261102' &&
      github.event_name == 'push' && github.run_attempt == '1' &&
      github.event.before == '9e0147a17695ce63fa73daf75d8195a4f49095bb'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Import only fixed accepted commits to four new refs
        env:
          IMPORT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          
          DEST = 'myon-bioinformatics/Aoi'
          BASE = '9e0147a17695ce63fa73daf75d8195a4f49095bb'
          CONTROL = 'refs/heads/ops/import-pr148-histories-20261102'
          SOURCES = [
              ('PythDRagoras', 1423045231, '9fb998c6db1be112cacda5d5963b9b751fd3c4e4', '06d7ee4e4bd354ea10b9f158c7455dbf9dd36209', 'pythdragoras'),
              ('SakAnalytics', 1423489570, '95cfacd4f8aeb29eda0696a61f503e25a8789fce', '68c6facfced122d6823b6874588f98464f921f64', 'sakanalytics'),
              ('NagoyAction', 1423491480, 'da68f374ad1ae7c786f926190b98c94920d91420', '97cb7ea2c71d55203fc7b40b5d7ec9e025bafd74', 'nagoyaction'),
              ('DRAgoWing', 1423772286, '434fd1376454fbe537e7a22ca4552302d9cd2d73', '1a9cbc4148a5052ea7b8aa9f41b181d44f34341b', 'dragowing'),
          ]
          EXPECTED_PARENTS = {'9fb998c6db1be112cacda5d5963b9b751fd3c4e4': ['e6e6036eb9ae52bdd738b10f644c13edfe31e0f3'], '95cfacd4f8aeb29eda0696a61f503e25a8789fce': ['f3edc2707a87009912fbc01ef6c83259bd637669'], 'da68f374ad1ae7c786f926190b98c94920d91420': ['9df163e502c4fd3cc7e3f35fab276cfb1d0db8b4'], '434fd1376454fbe537e7a22ca4552302d9cd2d73': ['d7a71a02db30f56278878ef0d442b39507dcb5d4', '4ae6dbd3bd6c95eadb6a9520504a24e01eef8dbd']}
          TOKEN = os.environ['IMPORT_TOKEN']
          assert TOKEN
          assert os.environ['GITHUB_REPOSITORY'] == DEST
          assert os.environ['GITHUB_REF'] == CONTROL
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before'] == BASE
          assert event['after'] == os.environ['GITHUB_SHA']
          assert not event.get('forced') and not event.get('deleted')
          DEADLINE = time.monotonic() + 500
          
          def api(path, absent_ok=False):
              req = urllib.request.Request('https://api.github.com/repos/' + path, headers={
                  'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + TOKEN,
                  'User-Agent': 'aoi-pr148-fixed-history-import',
              })
              try:
                  with urllib.request.urlopen(req, timeout=min(20, max(1, DEADLINE-time.monotonic()))) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if absent_ok and exc.code == 404:
                      return None
                  raise
          
          def dest_ref(name):
              return 'refs/heads/import/pr148-20261102/' + name
          
          def observed(name):
              value = api(DEST + '/git/ref/heads/import/pr148-20261102/' + name, absent_ok=True)
              return value['object']['sha'] if value else None
          
          repo = api(DEST)
          assert repo['id'] == 1402862784 and repo['full_name'] == DEST and repo['default_branch'] == 'main'
          assert api(DEST + '/git/ref/heads/main')['object']['sha'] == BASE
          for name, identity, sha, tree, slug in SOURCES:
              source = 'myon-bioinformatics/' + name
              meta = api(source)
              assert meta['id'] == identity and meta['full_name'] == source and meta['default_branch'] == 'main'
              assert api(source + '/git/ref/heads/main')['object']['sha'] == sha
              commit = api(source + '/git/commits/' + sha)
              assert commit['sha'] == sha and commit['tree']['sha'] == tree and [parent['sha'] for parent in commit['parents']] == EXPECTED_PARENTS[sha]
              assert observed(slug) is None, 'Destination must be new: ' + dest_ref(slug)
          
          with tempfile.TemporaryDirectory(prefix='aoi-history-import-') as directory:
              root = Path(directory)
              askpass = root / 'askpass'
              askpass.write_text('#!/bin/sh\ncase "$1" in *Username*) printf "%s\\n" x-access-token;; *) printf "%s\\n" "$IMPORT_TOKEN";; esac\n')
              askpass.chmod(0o700)
              env = {**os.environ, 'GIT_ASKPASS': str(askpass), 'GIT_TERMINAL_PROMPT': '0',
                     'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null', 'GCM_INTERACTIVE': 'never'}
              bare = root / 'objects.git'
              def git(*args, check=True):
                  remaining = DEADLINE-time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError('Import wall-clock budget exhausted')
                  return subprocess.run(['git', '-c', 'credential.helper=', '-c', 'core.hooksPath=/dev/null',
                      '-c', 'protocol.file.allow=never', *args], cwd=root, env=env,
                      capture_output=True, text=True, check=check, timeout=min(100, remaining))
              git('init', '--bare', str(bare))
              for name, identity, sha, tree, slug in SOURCES:
                  git('-C', str(bare), 'fetch', '--no-tags', '--no-recurse-submodules',
                      'https://github.com/myon-bioinformatics/' + name + '.git', sha + ':refs/import-source/' + slug)
                  assert git('-C', str(bare), 'rev-parse', sha + '^{commit}').stdout.strip() == sha
                  assert git('-C', str(bare), 'rev-parse', sha + '^{tree}').stdout.strip() == tree
                  assert observed(slug) is None, 'Destination appeared during fetch: ' + dest_ref(slug)
              assert api(DEST + '/git/ref/heads/main')['object']['sha'] == BASE
              assert api(DEST + '/git/ref/heads/ops/import-pr148-histories-20261102')['object']['sha'] == os.environ['GITHUB_SHA']
              for *_, slug in SOURCES:
                  assert observed(slug) is None, 'Destination exists before push: ' + dest_ref(slug)
              # Empty expectations are CREATE-ONLY leases: no existing ref is overwritten.
              # A concurrent identical SHA may be reported up-to-date (no update); divergent
              # concurrent refs reject the atomic transaction. No existing expected SHA or
              # unconditional --force is permitted.
              args = ['-C', str(bare), 'push', '--atomic']
              args += ['--force-with-lease=' + dest_ref(slug) + ':' for *_, slug in SOURCES]
              args += ['https://github.com/' + DEST + '.git']
              args += [sha + ':' + dest_ref(slug) for name, identity, sha, tree, slug in SOURCES]
              push_error = None
              try:
                  result = git(*args, check=False)
                  if result.returncode:
                      push_error = 'push returned exit ' + str(result.returncode)
              except subprocess.TimeoutExpired:
                  push_error = 'push transport timed out; verifying outcome without retry'
              rows = []
              for name, identity, sha, tree, slug in SOURCES:
                  got = observed(slug)
                  rows.append({'repository': name, 'source': sha, 'destination': dest_ref(slug), 'observed': got, 'ok': got == sha})
              print(json.dumps({'push_transport': push_error or 'completed', 'refs': rows}, indent=2))
              assert all(row['ok'] for row in rows), 'Import not fully verified; inspect refs, never blindly retry'
              assert api(DEST + '/git/ref/heads/main')['object']['sha'] == BASE, 'Main changed externally; stop integration and inspect'
          PYCODE
