# Markdown のリンクと画像の参照先を確かめる。テストと違い、docs/ だけの変更でも走る。
name: Links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown links (local + checked-out commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Local (tracked files, exact case)
        run: python -S nagoyaction/linkcheck.py
      - name: Remote (files exist in the checked-out commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # pull_requestではcheckoutもgithub.shaもマージ後のcommit。
          # head_refを使うとmain側だけにあるファイルを404と誤判定する。
          REF: ${{ github.sha }}
        run: python -S nagoyaction/linkcheck.py --remote "$REPO" --ref "$REF"
