name: Stdlib feasibility survey

# 実験の棚卸し。第三者がどこで使われているかを数え、import を塞いだ・スタブにした・包んだ
# 実行で AST が見ない属性を記録する。既存のワークフローには触れない。<pkg>_min は作らない。
on:
  pull_request:
    paths:
      - scripts/survey_third_party.py
      - scripts/trace_surface.py
      - scripts/trace_drivers.py
      - tests/test_survey_third_party.py
      - tests/test_trace_surface.py
      - docs/drafts/stdlib-replacement-feasibility.md
      - docs/evidence/third-party-survey.json
      - docs/evidence/trace-surfaces.json
      - .github/workflows/stdlib-feasibility-survey.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey-and-trace:
    name: Recount imports and re-trace surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          enable-cache: false
      - run: uv sync --locked --python 3.12
      - name: Inventory matches the tree
        run: uv run --locked --python 3.12 python scripts/survey_third_party.py --check docs/evidence/third-party-survey.json
      - name: Tool tests
        run: uv run --locked --python 3.12 pytest -q tests/test_survey_third_party.py tests/test_trace_surface.py
      - name: Fresh absent, stub, and wrap runs match the committed surfaces
        run: uv run --locked --python 3.12 python scripts/trace_surface.py collect --check --out docs/evidence/trace-surfaces.json
