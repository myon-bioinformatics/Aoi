# サイクル3の命題・第5弾（事前登録）。形式と判定規則は docs/propositions.md。第1弾〜第4弾のファイルは変更しない。
#
# 主題: 3 段目のずれの式（O39 の判例を受けて）と、判断保留になった O41 を単位を足して判定し直すこと。
#
# 記録: 2026-11-12 19:40 JST に書いた。このとき第5弾の単位（chain3b・chain4 の組）と列はまだ作っていない。
#   書く前に見ていたもの: 第1弾〜第4弾の結果すべて。とくに O39 の判例 12 件（3 段目のずれは dt/(2·τ2) + dt/(2·τ3) にならない。
#     向きが逆の組もある）と、O41 に当たる 8 件の比（3.94〜4.02）。
#   紙の上で導いた式（今までの入る量の扱い end、槽が 1 列につながり、どの槽も弁 1 本）:
#     1 ステップは x ← (I + dt·G̃)·x と書ける。G̃ は速さ k_i を (1 − e^(−k_i·dt))/dt に置き換えた行列。
#     これを連続の式 dx/dt = G_eff·x に読み替えると、G_eff = G − (dt/2)·(D + G²) + （dt の 2 次）。
#     D は G の k_i を k_i² に置き換えた行列。成分で書くと、
#       槽 i が自分で減る速さは k_i のまま（厳密）、
#       槽 i から次の槽へ入る速さは k_i·(1 + k_{i+1}·dt/2)（次の槽の半ステップぶん多い）、
#       槽 i から 2 つ先の槽へは −(dt/2)·k_i·k_{i+1}（1 つ飛ばしで引かれる）。
#     2 段目はこれで dt/(2·τ2) になる（O27 と同じ）。3 段目は
#       ずれ = (dt/2)·[(k2 + k3) − k2·P13(t)/C(t)]、P13 = 速さ k1 → k3 の 2 段の式の 2 段目、C = 3 段目の厳密な量。
#     O39 の予想に無かったのは最後の項（1 つ飛ばし）で、時刻によって変わる。
#   式を導いた後に 1 件だけ照らした: 第4弾の (τ2/τ, τ3/τ) = (1/3, 3)・h = 1/128 の単位で、式は +0.122 %、単位は +0.122 %。
#     ほかの単位とは照らしていない。命題は、第4弾と別の組（別の時定数、別の時刻、4 段）だけで確かめる。
#   O47 は O41 と同じ問いを、当たる単位が 10 件以上になる組で問い直す（第4弾の 8 件は使わない）。
#   境の値（5 %・h ≤ 1/32・10 倍・3.8〜4.2）は人が決めた仮置きで、結果に合わせて動かさない。
#
# 第5弾で足す単位（前の弾の命題の範囲には入らない組）。どれもエンジン本体（FluidFullSpeedSimulation の main）で進める:
#   chain3b = 3 段の槽。(τ2/τ, τ3/τ) = (1/4, 3/4)・(3/4, 1/4)・(3/2, 4)・(4, 3/2)・(2/5, 5/2)・(6, 1/5)、測る時刻 t ≈ τ と 3τ。
#             刻みは今までの 10 通りに 1/256 を足した 11 通り。入る量の扱いは end と uniform
#   chain4  = 4 段の槽。(τ2/τ, τ3/τ, τ4/τ) = (1/2, 1/3, 1/4)・(2, 1/2, 3)・(1/3, 3, 1/2)・(3, 5, 2)、t ≈ 2τ。刻み 11 通り。end だけ
# 第5弾で足す列:
#   stage_fit = |err − 式の予想| / ((dt/2)·Σ_{i≥2} k_i)。式の予想 = G を G_eff に置き換えた連続の式の最後の槽の量 / 厳密な量 − 1
#   sign_ok   = err と式の予想の向き（正負）が同じか
#   gain_vs_end・flow_halving・has_half = 第4弾と同じ意味（chain3b の uniform）

# ---- 3 段目・4 段目のずれの式 ----

[[proposition]]
id = "O45"
statement = "槽が 3 段つながるとき、今までの入る量の扱い（end）で、刻みが時定数の 1/32 以下なら、3 段目のずれは G_eff の式と合う（差は目安 (dt/2)·(k2 + k3) の 5 % 以内）"
strength = "always"
parent = "O39"
change = "予想の式を、段ごとの足し算から G_eff = G − (dt/2)·(D + G²) に替えた（1 つ飛ばしで引かれる項が入る）。単位は別の組"
scope = { where = [{ col = "chain3b", op = "==", value = true }, { col = "uniform_in", op = "==", value = false }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "stage_fit", op = "<=", value = 0.05 }]
surprise = "stage_fit"
context = ["h", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "外れる単位があれば、1 ステップを連続の式に読み替える導き方（dt の 1 次まで）を見直す"

[[proposition]]
id = "O46"
statement = "槽が 3 段つながるとき、刻みが時定数の 1/32 以下なら、3 段目のずれの向き（多いか少ないか）は G_eff の式の向きと同じである"
strength = "always"
scope = { where = [{ col = "chain3b", op = "==", value = true }, { col = "uniform_in", op = "==", value = false }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "sign_ok", op = "==", value = true }]
context = ["h", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "向きが違う単位があれば、式の予想が 0 に近い組（2 つの項が打ち消し合う所）では向きまでは当たらないと書く"
note = "O39 の判例に、ずれが少ない側（向きが逆）の組があったことを受けた命題"

[[proposition]]
id = "O49"
statement = "槽が 4 段つながるとき、今までの入る量の扱い（end）で、刻みが時定数の 1/32 以下なら、4 段目のずれは G_eff の式と合う（差は目安 (dt/2)·(k2 + k3 + k4) の 5 % 以内）"
strength = "always"
scope = { where = [{ col = "chain4", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "stage_fit", op = "<=", value = 0.05 }]
surprise = "stage_fit"
context = ["h", "tau2_ratio", "tau3_ratio", "tau4_ratio", "err"]
falsifier = "外れる単位があれば、G_eff の式は 3 段までしか当たらないと書く"
note = "同じ式を、導くときに考えていない段数で確かめる"

# ---- 判断保留の問い直しと、別の単位での確かめ ----

[[proposition]]
id = "O47"
statement = "槽が 3 段つながるとき、刻みが時定数の 1/32 以下なら、エンジンの uniform のずれは刻みを半分にすると 1/4 になる（比 3.8〜4.2）"
strength = "always"
parent = "O41"
change = "問いは同じ。当たる単位が 8 件で判断保留だったので、別の組（chain3b、刻み 1/256 を足した）で問い直す"
scope = { where = [{ col = "chain3b", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }, { col = "has_half", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "flow_halving", op = ">=", value = 3.8 }, { col = "flow_halving", op = "<=", value = 4.2 }]
surprise = "flow_halving"
context = ["h", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "比が外れる単位があれば、3 段では uniform の残りのずれは 2 次ではないと書く"

[[proposition]]
id = "O48"
statement = "槽が 3 段つながるとき、刻みが時定数の 1/32 以下なら、エンジンの uniform は 3 段目のずれを end の 1/10 以下にする（別の組で）"
strength = "always"
scope = { where = [{ col = "chain3b", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "gain_vs_end", op = ">=", value = 10 }]
surprise = "gain_vs_end"
context = ["h", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "1/10 にならない単位があれば、O40 の支持は第4弾の 4 組に寄っていたと書く"
note = "O40 と同じ問いを、別の時定数と別の時刻で確かめる。end のずれが 0 に近い組（O46 の所）では比が小さく出うる"
