# サイクル3の命題・第7弾（事前登録）。形式と判定規則は docs/propositions.md。第1弾〜第6弾のファイルは変更しない。
#
# 主題: 第6弾で外れた境目の式を、end の 2 次の項を入れて作り直す。
#
# 記録: 2026-11-12 20:40 JST に書いた。このとき第7弾の単位（cross3 の組）と列はまだ作っていない。
#   書く前に見ていたもの: 第1弾〜第6弾の結果すべて。とくに O52・O53 の判例（|a1/b2| の境目は外れた。境目より細かいのに
#     uniform のほうが大きい単位が (4, 3/2) の横切る時刻の少し後に集まり、ずっと粗いのに小さい単位が h = 0.343・0.74 にある）。
#   紙の上で導いた式（数式処理で dt の 2 次まで展開。データに当てはめた係数は無い）:
#     G_eff(end) = G + dt·H1 + dt²·H2。
#       H1（第5弾と同じ）: 次の槽へ k_i·k_{i+1}/2、2 つ先へ −k_i·k_{i+1}/2
#       H2: 次の槽へ k_i·k_{i+1}·(k_i + k_{i+1})/12、2 つ先へ −k_i·k_{i+1}·(k_i + k_{i+1} + 4·k_{i+2})/12、3 つ先へ k_i·k_{i+1}·k_{i+2}/3
#   境目の作り直し: 単位ごとに、その刻みと時刻での 2 つの式の予想（end は G + dt·H1 + dt²·H2、uniform は G + dt²·H）を出し、
#     大きさの比 pred_margin = |uniform の予想| / |end の予想| を見る。1 より大きければ「uniform のほうが大きい」という予想。
#     end のずれが実際に 0 を横切る時刻は刻みによって少しずれる（式では、t/τ が h = 1/256 から 1/8 で 0.03〜0.05 ほど後ろへ動く）。
#   この式は、どの単位とも照らしていない。
#   単位の組を決めるために、式だけを使って計算したもの（データは使っていない）: 5 つの組・7 つの刻みで、end の式が 0 を横切る時刻と、
#     その前後のステップでの pred_margin。pred_margin ≥ 1.25 に当たる単位が 10 件以上になるように、横切るステップの前後 2 ステップを測る。
#   境の値（5 %・h ≤ 1/32・1.25・0.8）は人が決めた仮置きで、結果に合わせて動かさない。
#
# 第7弾で足す単位（前の弾の命題の範囲には入らない組）。エンジン本体（FluidFullSpeedSimulation の main）で進める:
#   cross3 = 3 段の槽。(τ2/τ, τ3/τ) = (5, 2)・(3/10, 2)・(3, 5/4)・(1/2, 3)・(3/5, 5/2)（第6弾までと別の組。どれも end のずれが 0 を横切る）。
#            刻みは 1/256・1/128・1/64・1/32・0.0478・1/16・1/8（粗い刻みは使わない）。入る量の扱いは end と uniform。
#            測るステップは、式で end のずれが 0 を横切るステップ n0 の −2・−1・0・+1・+2 と、0.7·n0・1.3·n0。
#            同じ刻みで同じステップ数になる組み合わせは 1 つだけ作る（同じ計算を 2 度数えない）
# 第7弾で足す列:
#   end2_fit    = |err − G_eff(end) の 2 次までの式の予想| / ((dt·k_max)²/12)（cross3 の end）
#   pred_margin = |uniform の式の予想| / |end の式の予想|（cross3 の uniform）
#   gain_vs_end = |同じ条件の end の err| / |この単位の err|（1 より小さければ uniform のほうが大きい）

[[proposition]]
id = "O54"
statement = "槽が 3 段つながるとき、刻みが時定数の 1/32 以下なら、end の 3 段目のずれは 2 次までの式 G + dt·H1 + dt²·H2 と合う（差は目安 (dt·k_max)²/12 の 5 % 以内）"
strength = "always"
scope = { where = [{ col = "cross3", op = "==", value = true }, { col = "uniform_in", op = "==", value = false }] }
if = [{ col = "h", op = "<=", value = 0.03125 }]
then = [{ col = "end2_fit", op = "<=", value = 0.05 }]
surprise = "end2_fit"
context = ["h", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "外れる単位があれば、H2 の展開を見直す"
note = "0 を横切る近くの単位で確かめるので、1 次の項だけの式（O45）より厳しい"

[[proposition]]
id = "O55"
statement = "槽が 3 段つながるとき、式が「uniform のずれは end の 1.25 倍以上」と言う単位では、uniform のずれは実際に end より大きい"
strength = "always"
parent = "O53"
change = "境目を係数の比 |a1/b2| から、その刻みと時刻での 2 つの式の予想の比に替えた（end の 2 次の項を入れた）。単位は別の組で、粗い刻みは使わない"
scope = { where = [{ col = "cross3", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }] }
if = [{ col = "pred_margin", op = ">=", value = 1.25 }]
then = [{ col = "gain_vs_end", op = "<", value = 1.0 }]
surprise = "gain_vs_end"
context = ["h", "pred_margin", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "uniform のほうが小さい単位があれば、2 次までの式でも境目は出ないと書く"
note = "逆（uniform のほうが大きいなら、式の比は 1.25 以上）の判例は、式が言い切れなかった単位（比が 0.8〜1.25）を示す"

[[proposition]]
id = "O56"
statement = "槽が 3 段つながるとき、式が「uniform のずれは end の 0.8 倍以下」と言う単位では、uniform のずれは実際に end より小さい"
strength = "always"
parent = "O52"
change = "O55 と同じ替え方"
scope = { where = [{ col = "cross3", op = "==", value = true }, { col = "uniform_in", op = "==", value = true }] }
if = [{ col = "pred_margin", op = "<=", value = 0.8 }]
then = [{ col = "gain_vs_end", op = ">", value = 1.0 }]
surprise = "gain_vs_end"
context = ["h", "pred_margin", "tau2_ratio", "tau3_ratio", "span_ratio", "err"]
falsifier = "uniform のほうが大きい単位があれば、2 次までの式でも境目は出ないと書く"
