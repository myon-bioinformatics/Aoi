# サイクル2 月次の命題・第3弾。事前宣言 monthly_prelock_r3_2026-11-13.md と一緒に固定した（判定の前）。
# 族 A: 段 3 の E の前年比を、米（xr）・穀類（xc）の寄与に替える。族 Y: 族 B を年の単位で、年平均の標準誤差の帯で問う。
# 末尾 f は E の実測も帯を超える年だけ（候補 1）、x は 2025 を除く版。件数が 10 に満たない版は登録していない（宣言 r3 §5）。

[[proposition]]
id = "C2A3r"
statement = "E の前年比のうち米の値段の寄与だけで E を公表値の 1 刻み以上動かす月なら、その寄与を足すと、先月の米価の変化までより誤差が小さい月が半分を超える（2025 を含む）"
strength = "more_often_than_not"
scope = { seasons = "2006-2025", where = [{ col = "family", op = "==", value = "A" }] }
if = [{ col = "axr", op = ">=", value = 1 }]
then = [{ col = "a3r", op = "==", value = true }]
parent = "C2A3"
change = "段 3 で足す説明を、E の前年比から米の寄与（族 B の c1）に替えた。帯・強さ・結論は親のまま"
surprise = "gain3r"
context = ["y", "xr", "gamma_r", "f2", "f3r"]
falsifier = "誤差が小さくなる月の割合の 95% 区間の上端が 0.5 を下回る"
note = "単位・訓練・段 2 までの見込みは親と同じ。段 3 で足す説明だけを、E の前年比から、族 B の式で作った起点の月の寄与（米は小売価格、穀類は物価指数。重みは 12 か月前）に替えた。米の寄与は米価自身の前年比をほぼ定数倍したもの（宣言 r3 §3）。帯は親と同じ公表刻み τ"

