services:
  llama:
    image: ${AOI_LLAMA_IMAGE:?Set a digest-pinned llama.cpp server image}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../.models:/models:ro
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "4096", "--threads", "2", "--parallel", "1"]
