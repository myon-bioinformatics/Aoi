name: CI

# docs/ だけの変更ではテストを走らせない（リンク確認は links.yml が担当する）
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -VV
      - name: Install uv
        run: python -m pip install uv
      - name: Test all sub-projects
        run: uv run --python "${{ matrix.python }}" pytest -q
      - name: NagoyAction is stdlib-only and the cycle pipeline is runnable
        run: |
          python -S nagoyaction/nagoyaction.py doctor cycles/c001-chunichi/pipeline.toml
          python -S nagoyaction/nagoyaction.py run cycles/c001-chunichi/pipeline.toml --dry-run

  actionlint:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@main

