# サイクル1の命題（事前登録）。形式と判定規則は docs/propositions.md。
#
# 記録: 2026-10-03 に書いた。このとき Aoi のパイプラインによる実データはまだ取得していない。
#       外部レポート（references/2026-10-03-external-report.md）の数値は読んだうえで書いている。
#       強さ（strength）は言葉で選び、数値の基準はそこから自動で決まる。データに合わせて調整しない。
# 変更: 結果を見てから基準・範囲・条件を変えるときは、新しい id を作り、この命題は残す。
#
# 単位: チーム×シーズン（12球団、2012〜2025年、analysis.toml の除外を適用。除外中の判例は別に表示）

# ---- 得失点で順位を説明する（既存の説明） ----

[[proposition]]
id = "P1"
statement = "得失点差がプラスなら、上位半分（Aクラス）である"
strength = "usually"
if = [{ col = "rd", op = ">", value = 0 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "rank_gap"
context = ["rank", "rank_pythag", "wins_vs_pythag"]
links = ["H2", "H3", "H4"]

[[proposition]]
id = "P2"
statement = "ピタゴラス期待勝率でリーグ3位以内なら、実際も3位以内である"
strength = "usually"
if = [{ col = "rank_pythag", op = "<=", value = 3 }]
then = [{ col = "rank", op = "<=", value = 3 }]
surprise = "rank_gap"
context = ["rd", "wins_vs_pythag"]
links = ["H2", "H3", "H4"]

[[proposition]]
id = "P3"
statement = "得点がリーグ2位以内なら、3位以内である"
strength = "usually"
if = [{ col = "rank_rf", op = "<=", value = 2 }]
then = [{ col = "rank", op = "<=", value = 3 }]
surprise = "rank_gap"
context = ["rank_ra", "rd"]
links = ["H2"]

[[proposition]]
id = "P4"
statement = "失点がリーグで2番目以内に少なければ、3位以内である"
strength = "usually"
if = [{ col = "rank_ra", op = "<=", value = 2 }]
then = [{ col = "rank", op = "<=", value = 3 }]
surprise = "rank_gap"
context = ["rank_rf", "rd"]
links = ["H2"]

[[proposition]]
id = "P5"
statement = "得点がリーグ5位以下なら、下位半分（Bクラス）である"
strength = "usually"
if = [{ col = "rank_rf", op = ">=", value = 5 }]
then = [{ col = "upper_half", op = "==", value = false }]
surprise = "rank_gap"
context = ["rank", "rank_ra", "rd"]
links = ["H2"]

[[proposition]]
id = "P6"
statement = "どのチーム・シーズンでも、実際の勝利数はピタゴラス期待勝利数の±5勝以内に収まる"
strength = "almost_always"
if = []
then = [{ col = "wins_vs_pythag", op = ">=", value = -5 }, { col = "wins_vs_pythag", op = "<=", value = 5 }]
surprise = "wins_vs_pythag"
context = ["rd", "rank", "rank_pythag"]
links = ["H3", "H4", "H5"]

# ---- 得失点差が同程度でも勝率が違う：点差の分布で説明できるか ----
# 追加: 2026-10-03（外部の会話の提案を受けて）。このときもパイプラインの実データはまだ取得していない。

[[proposition]]
id = "P9"
statement = "1点差の試合で勝ち越していれば、ピタゴラス期待勝利数を上回る"
strength = "usually"
if = [{ col = "one_run_net", op = ">", value = 0 }]
then = [{ col = "wins_vs_pythag", op = ">", value = 0 }]
surprise = "wins_vs_pythag"
context = ["rd", "wpct_1run", "blowout_net"]
links = ["H3", "H8"]
falsifier = "1点差で勝ち越したチーム・シーズンのうち、期待勝利数を下回るものが4分の1を超える"
note = "1点差の勝敗とピタゴラスからのずれは計算上も連動しやすい。成り立っても「どうずれたか」の記述で、「なぜか」の説明ではない"

[[proposition]]
id = "P10"
statement = "4点以上差の試合で負け越していれば、ピタゴラス期待勝利数を上回る（大敗が失点を押し上げ、期待勝利数を下げる）"
strength = "usually"
if = [{ col = "blowout_net", op = "<", value = 0 }]
then = [{ col = "wins_vs_pythag", op = ">", value = 0 }]
surprise = "wins_vs_pythag"
context = ["rd", "one_run_net", "rank"]
links = ["H8"]
falsifier = "4点以上差で負け越したチーム・シーズンのうち、期待勝利数を下回るものが4分の1を超える"
note = "得点・失点の「配分」の偏りを見る命題。大差の試合が少ない年は条件に入らない"

[[proposition]]
id = "P11"
statement = "得失点差が ±20 以内のチームの間では、1点差で勝ち越していれば上位半分（Aクラス）に入る"
strength = "more_often_than_not"
if = [{ col = "rd", op = ">=", value = -20 }, { col = "rd", op = "<=", value = 20 }, { col = "one_run_net", op = ">", value = 0 }]
then = [{ col = "upper_half", op = "==", value = true }]
surprise = "rank_gap"
context = ["rank", "rank_pythag", "wins_vs_pythag"]
links = ["H3", "H8"]
falsifier = "得失点差が拮抗し1点差で勝ち越したチーム・シーズンの半数以上が下位半分"
note = "「得失点差が同程度でも勝率が違う」を、得失点差の幅を絞って比べる。±20 は「同程度」の目安として事前に決めた値"

# ---- 中日ドラゴンズについての命題（focus） ----

[[proposition]]
id = "P7"
statement = "中日の順位は、得失点から期待される順位より2つ以上は下回らない"
strength = "usually"
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "rank_gap", op = "<=", value = 1 }]
surprise = "rank_gap"
context = ["rank", "rank_pythag", "rd", "wins_vs_pythag"]
links = ["H3", "H4", "H5"]
skip_forms = ["converse", "inverse"]
skip_reason = "条件が「中日であること」なので、逆（期待どおりなら中日である）は意味を持たない"

[[proposition]]
id = "P8"
statement = "中日の勝利数は、ピタゴラス期待勝利数を3勝以上は下回らない（「運が悪かった」ではない）"
strength = "usually"
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "wins_vs_pythag", op = ">=", value = -3 }]
surprise = "wins_vs_pythag"
context = ["rank", "rank_pythag", "rd", "wpct_1run"]
links = ["H3", "H4", "H5"]
skip_forms = ["converse", "inverse"]
skip_reason = "条件が「中日であること」なので、逆（期待どおりなら中日である）は意味を持たない"

# ---- R1: 得点・失点の配分（research/R1-score-allocation.md と同時に登録。探索的） ----
# 追加: 2026-10-03。配分効果はまだ実データで一度も計算していない。

[[proposition]]
id = "P12"
statement = "配分効果がはっきりプラスのシーズン（alloc_z ≥ 1）の翌年も、配分効果はプラスである（配分はチームの特徴として続く）"
strength = "more_often_than_not"
if = [{ col = "alloc_z", op = ">=", value = 1 }]
then = [{ col = "alloc_z_next", op = ">", value = 0 }]
surprise = "alloc_z_next"
context = ["alloc_z", "wins_vs_pythag"]
links = ["H9"]
falsifier = "alloc_z ≥ 1 のシーズンのうち、翌年の alloc_z が 0 以下になるものが半数以上"
note = "翌年のないシーズン（最終年、除外の前年）は判定できない単位として数える。同じチームでも選手は入れ替わる"

[[proposition]]
id = "P13"
statement = "配分効果がはっきり出たシーズン（|alloc_z| ≥ 1）は、ホームとビジターで配分効果の符号がそろう"
strength = "more_often_than_not"
if = [{ col = "alloc_z_abs", op = ">=", value = 1 }]
then = [{ col = "alloc_same_sign", op = "==", value = true }]
surprise = "alloc_z"
context = ["alloc_net_home", "alloc_net_away"]
links = ["H9"]
falsifier = "|alloc_z| ≥ 1 のシーズンの半数以上で、ホームとビジターの符号が逆"
note = "ホームの勝ち試合は9回裏を行わない・サヨナラで打ち切られるため、ホームの配分効果は偏りやすい（R1 の限界を参照）"

[[proposition]]
id = "P14"
statement = "中日は、得点・失点の配分（どの試合で組み合わさったか）で勝ち越し数を失っていない（alloc_net ≥ 0）"
strength = "usually"
if = [{ col = "team", op = "==", value = "d" }]
then = [{ col = "alloc_net", op = ">=", value = 0 }]
surprise = "alloc_net"
context = ["rank", "rd", "wins_vs_pythag", "alloc_z"]
links = ["H3", "H9"]
skip_forms = ["converse", "inverse"]
skip_reason = "条件が「中日であること」なので、逆（配分で損をしていなければ中日である）は意味を持たない"
falsifier = "中日のシーズンのうち、配分で負け越し（alloc_net < 0）が4分の1を超える"
note = "成り立てば、CS 不出場の説明は配分ではなく、得点・失点の総量（とその原因）の側に寄る"
