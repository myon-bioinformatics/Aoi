name: One-off reviewed Aoi subtree history repair
on:
  push:
    branches: [automation/aoi-history-sync-20261030]
permissions:
  contents: read
concurrency:
  group: aoi-history-sync-20261030
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'myon-bioinformatics/Aoi' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: plan
          persist-credentials: false
      - name: Checkout fixed integration base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9f72b00e954cde61ab2c50cff4d5f41a709379ef
          path: integration
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.3'
          enable-cache: false
      - name: Test the reviewed synchronization guards
        run: python -m unittest discover -s plan/scripts/history_sync_once -p 'test_*.py' -v
      - name: Prepare locked integration environment
        working-directory: integration
        run: uv sync --locked --python 3.12
      - name: Build and validate without push credentials
        run: |
          mkdir "$RUNNER_TEMP/aoi-history-sync"
          integration/.venv/bin/python plan/scripts/history_sync_once/sync_history.py build \
            --root integration --scratch "$RUNNER_TEMP/aoi-history-sync"
      - name: Publish only the new repair branch
        env:
          SYNC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          unset SYNC_TOKEN
          integration/.venv/bin/python plan/scripts/history_sync_once/sync_history.py publish --root integration
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
      - name: Preserve non-secret validation summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aoi-history-sync-evidence
          path: |
            ${{ runner.temp }}/aoi-history-sync/result.json
            ${{ runner.temp }}/aoi-history-sync/focused.xml
          if-no-files-found: warn
          retention-days: 14
