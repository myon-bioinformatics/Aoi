name: Shared tool lock

# Aoi が配る stdlib-shrink の道具を shared-tools.lock.json の sha256 と照合する。
# pull request では不一致を警告にし、main への push と schedule では失敗にする。
# 子の SHA は lock にもこのファイルにも書かない。実行時に git ls-remote で main を取る。
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: shared-tools-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Shared tool hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
          python-version: "3.15"
          activate-environment: true
      - name: Test consumer integrity checker
        run: python -S tests/test_shared_tool_consumers.py
      - name: Tool files match the lock (always strict)
        run: python -S scripts/repo_checks.py shared_tools_lock
      - name: Resolve consumer mains
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          export GCM_INTERACTIVE=never
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes"
          uv --version
          python -S scripts/repo_checks.py shared_tools_lock --resolve-consumers | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare tool hashes to the lock
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          strict=0
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            strict=1
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            strict=1
          fi
          if [[ "$strict" == "1" ]]; then
            python -S scripts/repo_checks.py shared_tool_consumers
          else
            python -S scripts/repo_checks.py shared_tool_consumers --warn
          fi

  # 🔁 own sources follow main: on schedule / manual run, take main of own repositories and push to main
  follow-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-follow-main.yml@main
    permissions:
      contents: write
    with:
      node-version: "26"
      after: python -S scripts/repo_checks.py shared_tools_lock --refresh-vendored
      check: |
        uv run --locked python -m pytest -c pyproject.toml -q --deselect tests/test_child_registry.py::test_mutations_all_killed
