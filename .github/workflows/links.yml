# Markdown のリンクと画像の参照先を確かめる。テストと違い、docs/ だけの変更でも走る。
name: Links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown links (local + checked-out commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Local (tracked files, exact case)
        run: python -S nagoyaction/linkcheck.py
      - name: Remote (files exist in the checked-out commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # pull_requestではcheckoutもgithub.shaもマージ後のcommit。
          # head_refを使うとmain側だけにあるファイルを404と誤判定する。
          REF: ${{ github.sha }}
        run: python -S nagoyaction/linkcheck.py --remote "$REPO" --ref "$REF"
