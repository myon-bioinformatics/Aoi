name: Stdlib substitute

# 実験: 1 ジョブの中で、入っている markdown と numpy で render_md と load_overlap の出力を取り、
# すぐ両方を外す。markdown は sha256 を照合した pure wheel、numpy は shrink/numpy_min.py
# （overlap と兄弟の rule_search より前に載せる）。polars は残す。バイト単位で比べる。
# Aoi は ci.yml と同じく実行時に main の SHA を解決する。既存の CI ジョブと pyproject の依存には触れない。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  without-markdown-or-numpy:
    name: render_md and load_overlap (real, then neither installed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - name: Resolve Aoi main
        id: aoi
        env:
          AOI_REPOSITORY_ID: "1402862784"
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          line=$(git ls-remote https://github.com/myon-bioinformatics/Aoi refs/heads/main)
          sha=$(printf '%s\n' "$line" | awk 'NF { print $1; exit }')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve Aoi main" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("GITHUB_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "dragowing-stdlib-substitute",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          request = urllib.request.Request(
              "https://api.github.com/repos/myon-bioinformatics/Aoi",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)
          expected = int(os.environ["AOI_REPOSITORY_ID"])
          got = data.get("id")
          name = data.get("full_name")
          if got != expected or name != "myon-bioinformatics/Aoi":
              raise SystemExit("Aoi repository identity mismatch: id=%s name=%s" % (got, name))
          PY
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Aoi main ${sha}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ steps.aoi.outputs.sha }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Aoi checkout matches resolved main
        env:
          AOI_SHA: ${{ steps.aoi.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AOI_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - name: Resolve the latest pure markdown wheel
        id: markdown
        run: python scripts/fetch_module.py resolve markdown --github-output
      - name: Real packages, then record render_md and load_overlap
        env:
          AOI_ROOT: ${{ github.workspace }}/.test-deps/aoi
          PYTHONPATH: ${{ github.workspace }}/.test-deps/aoi/pythdragoras:${{ github.workspace }}/.test-deps/aoi/queryu/ask
        run: |
          set -euo pipefail
          uv sync --locked --python 3.14
          uv run --locked --python 3.14 pytest -q tests/test_fetch_module.py tests/test_numpy_min.py tests/test_stdlib_paths.py
          installed="$(.venv/bin/python -c 'import markdown; print(markdown.__version__)')"
          test "$installed" = "${{ steps.markdown.outputs.version }}"
          .venv/bin/python scripts/run_stdlib_paths.py --deps real --markdown-version "${{ steps.markdown.outputs.version }}" reference.json
      - name: Drop markdown and numpy; keep polars
        run: uv sync --locked --no-dev --no-install-package markdown --no-install-package numpy --python 3.14
      - name: markdown and numpy are not installed
        run: |
          ! .venv/bin/python -c 'import markdown'
          ! .venv/bin/python -c 'import numpy'
          .venv/bin/python -c 'import polars'
      - name: render_md from the wheel and load_overlap on numpy_min
        env:
          AOI_ROOT: ${{ github.workspace }}/.test-deps/aoi
          PYTHONPATH: ${{ github.workspace }}/.test-deps/aoi/pythdragoras:${{ github.workspace }}/.test-deps/aoi/queryu/ask
        run: .venv/bin/python scripts/run_stdlib_paths.py --deps min --markdown-version "${{ steps.markdown.outputs.version }}" --cache .cdn-cache minimal.json
      - name: Byte-identical to the real markdown and numpy result
        run: cmp reference.json minimal.json
