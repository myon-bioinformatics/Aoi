[project]
name = "aoi"
version = "0.1.0"
description = "Observe. Measure. Question."
requires-python = ">=3.11"
dependencies = ["polars>=1.30", "httpx>=0.28", "selectolax>=0.3.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# サブプロジェクトはそれぞれ単独のディレクトリ。将来の分離に備え、互いをパッケージにしない
pythonpath = ["blueprobe", "queryu", "sakanalytics", "pythdragoras", "nagoyaction"]
testpaths = ["blueprobe/tests", "queryu/tests", "sakanalytics/tests", "pythdragoras/tests", "nagoyaction/tests"]
