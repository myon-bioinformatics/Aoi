falsifier = "ずれる単位があれば、O11 の支持は範囲（残りが小さい条件）に寄っていたと書く"

[[proposition]]
id = "O23"
statement = "槽が 2 段つながるとき、出口が 1 本ずつなら 2 段目の量も厳密である"
strength = "always"
scope = { where = [{ col = "chain", op = "==", value = true }] }
if = []
then = [{ col = "err_abs", op = "<", value = 1e-9 }]
