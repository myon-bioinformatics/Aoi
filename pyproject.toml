[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragowing"
version = "0.1.0"
description = "記録を、判定をやり直さずに置く（Aoi の dragowing/ から独立）"
requires-python = ">=3.11"
# 📦 実行時の依存は無い（標準ライブラリだけ）。ページの文章は自作の markdown.py（vendor/markdown）、
# SVG は親の plotly_min（vendor/tools/stdlib_min）。matplotlib・Python-Markdown は入れない。
dependencies = []

# 🧰 uv tool: `uv tool install .` で dragowing.py 1 ファイルがそのまま `dragowing` コマンドになる（ビルダーの写しは要らない）
[project.scripts]
dragowing = "dragowing:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # 🧮 native の重なり（--overlap-backend native）は兄弟 PythDRagoras の rule_search を呼ぶ。
    # 既定の stdlib の経路では使わないので、実行時の依存ではなくテスト用に置く。
    "polars>=2.0.0",
    # 2.5 系の最新は Python 3.12 以上。3.11 では配布物の Requires-Python により 2.4.6 が選ばれる。
    "numpy>=2.4.6",
    "numpy>=2.5.4; python_version >= '3.12'",
    # 🎨 ヒートマップページ（scripts/build_heatmap_page.py）の CSS/UI バンドルを PySaiyanWeBoo から生成・検証する（実行時は標準ライブラリのみ）
    "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@a55e8504d351c7f58bb13096ef1abae3ce5fcc8a",
]

[tool.setuptools]
py-modules = ["dragowing"]

[tool.uv]
# uv run / uv sync ではこのリポジトリを入れない（テストはパスで読む）。uv tool install . は上の setuptools で 1 ファイルを入れる
package = false

[tool.pytest.ini_options]
# サイクルデータ、PythDRagoras（propositions, rule_search）、QueRyu（ask）は Aoi に残す。AOI_ROOT で Aoi の main を指す（兄弟の場所は Aoi の aoi.py が決め、conftest.py がそれを使う。.github/workflows/ci.yml が実行時に SHA を解決する）
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".test-deps", "build", "reports"]
