# 記録: 2026-11-13 に書いた。選び方・先に数えた件数・見たもの・予想は kind_reask_prelock_2026-11-13.md。
#       このファイルを固定した時点では、スクリプトも、条件と結論の組み合わせ（hold）の計算も書いていない。
# 番号: K<親の番号>。親は正本 cycles/c001-chunichi/propositions.toml の命題。
