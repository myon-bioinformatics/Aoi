name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  test:
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      # NagoyAction は Aoi の直下（cycles/・queryu/・sakanalytics/・blueprobe/・vendor/・scripts/・docs/）を
      # 相対パスで使う。Aoi を固定 SHA で checkout し、その nagoyaction/ をこのリポジトリの tree に置き換えてテストする
      AOI_SHA: c0d4f64d27bb3a43f893df09e56effc381997f13
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Aoi の CI と同じ。failure-identity の expected-reports と揃えること
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ env.AOI_SHA }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Verify pinned checkout
        run: test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - name: Replace Aoi nagoyaction/ with this repository's tree
        run: |
          rm -rf .test-deps/aoi/nagoyaction
          mkdir .test-deps/aoi/nagoyaction
          git archive HEAD | tar -x -C .test-deps/aoi/nagoyaction
          # リンク確認のテストは git に登録したファイルで照合するので、置き換えた tree を index に載せる
          git -C .test-deps/aoi add -A nagoyaction
          test "$(git -C .test-deps/aoi write-tree --prefix=nagoyaction/)" = "$(git rev-parse 'HEAD^{tree}')"
      - run: python -m compileall -q -x '\.test-deps' .
      - name: Test with JUnit
        working-directory: .test-deps/aoi
        run: uv run --locked --python "${{ matrix.python }}" pytest -q -c pyproject.toml nagoyaction/tests --junitxml="$GITHUB_WORKSPACE/reports/junit.xml"
      - name: Preserve JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: NagoyAction is stdlib-only and the cycle pipeline is runnable
        working-directory: .test-deps/aoi
        run: |
          python -S nagoyaction/nagoyaction.py doctor cycles/c001-chunichi/pipeline.toml
          python -S nagoyaction/nagoyaction.py run cycles/c001-chunichi/pipeline.toml --dry-run

  # 1 ジョブの中で、本物の polars で research_digest.collect のバイト列を取り、
  # polars と polars-runtime-32 を外してから polars_min で同じ collect を動かし、cmp する。
  polars-min:
    name: collect (real polars, then polars uninstalled)
    if: needs.changes.outputs.product_changed == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AOI_SHA: c0d4f64d27bb3a43f893df09e56effc381997f13
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/Aoi
          ref: ${{ env.AOI_SHA }}
          path: .test-deps/aoi
          persist-credentials: false
      - name: Verify pinned checkout
        run: test "$(git -C .test-deps/aoi rev-parse HEAD)" = "$AOI_SHA"
      - name: Replace Aoi nagoyaction/ with this repository's tree
        run: |
          rm -rf .test-deps/aoi/nagoyaction
          mkdir .test-deps/aoi/nagoyaction
          git archive HEAD | tar -x -C .test-deps/aoi/nagoyaction
          git -C .test-deps/aoi add -A nagoyaction
          test "$(git -C .test-deps/aoi write-tree --prefix=nagoyaction/)" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Equivalence, AST, proxy trace, absent-polars tracebacks, then record real collect
        working-directory: .test-deps/aoi
        run: |
          uv sync --locked --python 3.12
          uv run --locked --python 3.12 pytest -q -c pyproject.toml nagoyaction/tests/test_polars_min.py
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py survey
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py analyze
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py generate --out nagoyaction/shrink/polars_min.py --check
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py trace
          uv run --locked --python 3.12 python nagoyaction/scripts/shrink_polars.py absent
          uv run --locked --python 3.12 python nagoyaction/shrink/run_collect.py --deps real "$GITHUB_WORKSPACE/reference.json"
      - name: Reinstall locked runtime deps except polars and its compiled runtime
        working-directory: .test-deps/aoi
        run: uv sync --locked --no-dev --no-install-package polars --no-install-package polars-runtime-32 --python 3.12
      - name: polars is not installed
        working-directory: .test-deps/aoi
        run: |
          if .venv/bin/python -c 'import polars'; then
            echo "polars is still importable" >&2
            exit 1
          fi
      - name: Same collect on polars_min
        working-directory: .test-deps/aoi
        run: .venv/bin/python nagoyaction/shrink/run_collect.py --deps min "$GITHUB_WORKSPACE/minimal.json"
      - name: Byte-identical to the real polars collect result
        run: cmp "$GITHUB_WORKSPACE/reference.json" "$GITHUB_WORKSPACE/minimal.json"

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: '["junit-py3.11/junit.xml","junit-py3.12/junit.xml","junit-py3.13/junit.xml","junit-py3.14/junit.xml","junit-py3.15/junit.xml"]'
      artifact-pattern: junit-*
      output-artifact: failure-identity
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
